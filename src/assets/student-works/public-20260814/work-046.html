<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>水果连连看</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --orange: #FF6B35;
      --green: #2EC4B6;
      --yellow: #FFD166;
      --red: #EF476F;
      --bg-start: #FFF0E6;
      --bg-end: #FFE0D0;
      --card-bg: rgba(255, 255, 255, 0.85);
      --text: #3D2C2E;
      --text-light: #8B7B7B;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.12);
      --radius: 16px;
      --radius-sm: 10px;
      --font: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
      --font-mono: 'SF Mono', 'Consolas', 'Courier New', monospace;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--font);
      color: var(--text);
      background: linear-gradient(135deg, #FFF5EC 0%, #FFE8D6 30%, #FFDBC4 60%, #FFECD2 100%);
      background-attachment: fixed;
    }

    body::before {
      content: '';
      position: fixed;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background:
        radial-gradient(circle at 20% 80%, rgba(255, 107, 53, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(46, 196, 182, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(255, 209, 102, 0.06) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    #app {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .screen {
      display: none;
      width: 100%;
      max-width: 900px;
      padding: 20px;
    }

    .screen.active {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #screen-menu { gap: 20px; }

    .logo {
      text-align: center;
      animation: logoFloat 3s ease-in-out infinite;
      margin-top: 10px;
    }
    .logo-icon {
      font-size: 64px; display: block;
      animation: logoBounce 2s ease-in-out infinite;
    }
    .logo-title {
      font-size: 32px; font-weight: 800;
      background: linear-gradient(135deg, var(--orange), var(--red));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 3px;
      margin-top: 8px;
    }
    .logo-subtitle {
      font-size: 13px; color: var(--text-light);
      letter-spacing: 2px; margin-top: 4px;
    }

    .difficulty-selector {
      display: flex; gap: 12px; width: 100%;
    }
    .difficulty-card {
      flex: 1; background: var(--card-bg);
      border: 2px solid transparent; border-radius: var(--radius);
      padding: 16px 10px; text-align: center; cursor: pointer;
      transition: all 0.3s ease; box-shadow: var(--shadow);
      position: relative; overflow: hidden;
    }
    .difficulty-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
    .difficulty-card.active {
      border-color: var(--orange);
      background: linear-gradient(135deg, rgba(255, 107, 53, 0.08), rgba(255, 255, 255, 0.9));
    }
    .difficulty-card .diff-icon { font-size: 32px; display: block; margin-bottom: 6px; }
    .difficulty-card .diff-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .difficulty-card .diff-info { font-size: 11px; color: var(--text-light); line-height: 1.5; }

    .level-section { width: 100%; }
    .level-label {
      font-size: 14px; font-weight: 600;
      margin-bottom: 12px; text-align: center;
    }
    .level-selector {
      display: flex; gap: 12px; justify-content: center; align-items: center;
    }
    .level-btn {
      width: 50px; height: 50px; border-radius: 50%;
      border: 2px solid #e0d0c0; background: var(--card-bg);
      font-size: 18px; font-weight: 700; cursor: pointer;
      transition: all 0.3s ease;
      display: flex; align-items: center; justify-content: center;
      position: relative; color: var(--text);
    }
    .level-btn.unlocked {
      border-color: var(--green);
      background: linear-gradient(135deg, rgba(46, 196, 182, 0.1), white);
    }
    .level-btn.unlocked:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 15px rgba(46, 196, 182, 0.3);
    }
    .level-btn.locked { border-color: #d0c8c0; background: #f5f0eb; color: #c0b8b0; cursor: not-allowed; }
    .level-btn.locked::after { content: '🔒'; font-size: 14px; position: absolute; }
    .level-btn .level-num { position: relative; z-index: 1; }

    .level-connector { width: 20px; height: 2px; background: #e0d0c0; }
    .level-connector.done { background: var(--green); }

    .menu-bottom { display: flex; gap: 12px; width: 100%; margin-top: 6px; }
    .menu-btn {
      flex: 1; padding: 12px 16px; border-radius: var(--radius-sm);
      border: 2px solid #e0d0c0; background: var(--card-bg);
      font-size: 15px; font-weight: 600; cursor: pointer;
      transition: all 0.3s ease;
      display: flex; align-items: center; justify-content: center;
      gap: 6px; font-family: var(--font); color: var(--text);
    }
    .menu-btn:hover {
      transform: translateY(-2px); box-shadow: var(--shadow);
      border-color: var(--orange);
    }

    .game-header {
      width: 100%; display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 12px;
    }
    .game-info-cards { display: flex; gap: 8px; flex-wrap: wrap; }
    .info-card {
      background: var(--card-bg); border-radius: var(--radius-sm);
      padding: 8px 14px; box-shadow: var(--shadow);
      text-align: center; min-width: 60px;
    }
    .info-card .info-label {
      font-size: 10px; color: var(--text-light);
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px;
    }
    .info-card .info-value {
      font-size: 20px; font-weight: 800;
      font-family: var(--font-mono);
    }
    .info-card.score .info-value { color: var(--orange); }
    .info-card.combo .info-value { color: var(--green); transition: color 0.3s; }
    .info-card.combo .info-value.hot { color: var(--red); animation: comboPulse 0.5s ease-in-out infinite; }
    .info-card.timer .info-value { color: var(--green); transition: color 0.3s; }
    .info-card.timer .info-value.warning { color: var(--red); animation: timerPulse 1s ease-in-out infinite; }

    .game-controls { display: flex; gap: 8px; }
    .control-btn {
      width: 38px; height: 38px; border-radius: 50%;
      border: 2px solid #e0d0c0; background: var(--card-bg);
      font-size: 16px; cursor: pointer; transition: all 0.3s ease;
      display: flex; align-items: center; justify-content: center;
    }
    .control-btn:hover { transform: scale(1.1); box-shadow: var(--shadow); }

    .canvas-container {
      width: 100%; display: flex; justify-content: center; align-items: center;
      margin-bottom: 12px; background: var(--card-bg);
      border-radius: var(--radius); padding: 6px; box-shadow: var(--shadow);
    }

    canvas { max-width: 100%; height: auto; cursor: pointer; border-radius: 8px; }

    .items-bar {
      display: flex; gap: 10px; width: 100%;
      flex-wrap: wrap; justify-content: center;
    }
    .item-btn {
      flex: 1; min-width: 70px; max-width: 120px;
      padding: 10px 8px; border-radius: var(--radius-sm);
      border: 2px solid #e0d0c0; background: var(--card-bg);
      cursor: pointer; transition: all 0.3s ease;
      text-align: center; font-family: var(--font); box-shadow: var(--shadow);
    }
    .item-btn:hover:not(.disabled) {
      transform: translateY(-2px); box-shadow: var(--shadow-lg);
      border-color: var(--orange);
    }
    .item-btn.disabled { opacity: 0.4; cursor: not-allowed; }
    .item-btn .item-icon { font-size: 24px; display: block; margin-bottom: 3px; }
    .item-btn .item-name { font-size: 11px; font-weight: 600; }
    .item-btn .item-count { font-size: 13px; font-weight: 700; color: var(--orange); font-family: var(--font-mono); }

    .overlay {
      display: none; position: fixed; top: 0; left: 0;
      width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5);
      z-index: 100; align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
    }
    .overlay.active { display: flex; }
    .overlay-card {
      background: white; border-radius: var(--radius);
      padding: 30px; text-align: center; max-width: 360px;
      width: 90%; box-shadow: var(--shadow-lg);
      animation: overlayIn 0.3s ease-out;
    }
    .overlay-card h2 { font-size: 26px; margin-bottom: 12px; font-weight: 800; }
    .overlay-card .overlay-message {
      font-size: 14px; color: var(--text-light);
      margin-bottom: 20px; line-height: 1.8;
    }
    .overlay-buttons {
      display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
    }
    .overlay-btn {
      padding: 10px 22px; border-radius: 25px;
      border: none; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: all 0.3s ease;
      font-family: var(--font);
    }
    .overlay-btn.primary {
      background: linear-gradient(135deg, var(--orange), #FF8555);
      color: white; box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
    }
    .overlay-btn.primary:hover {
      transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 107, 53, 0.4);
    }
    .overlay-btn.secondary { background: #f5f5f5; color: var(--text); }
    .overlay-btn.secondary:hover { background: #eee; }

    #screen-leaderboard { max-width: 600px; }
    .lb-header {
      display: flex; justify-content: space-between;
      align-items: center; width: 100%; margin-bottom: 16px;
    }
    .lb-header h2 {
      font-size: 24px; font-weight: 800;
      background: linear-gradient(135deg, var(--orange), var(--yellow));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent; background-clip: text;
    }
    .lb-close-btn {
      width: 36px; height: 36px; border-radius: 50%;
      border: 2px solid #e0d0c0; background: white;
      font-size: 18px; cursor: pointer; transition: all 0.3s ease;
      display: flex; align-items: center; justify-content: center;
    }
    .lb-close-btn:hover { background: #f5f5f5; }

    .lb-tabs {
      display: flex; gap: 6px; margin-bottom: 14px; width: 100%;
    }
    .lb-tab {
      flex: 1; padding: 10px; border-radius: var(--radius-sm);
      border: 2px solid #e0d0c0; background: white;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: all 0.3s ease; font-family: var(--font); color: var(--text);
    }
    .lb-tab.active {
      border-color: var(--orange); background: rgba(255, 107, 53, 0.08);
      color: var(--orange);
    }
    .lb-table-wrapper { width: 100%; overflow-x: auto; }
    .lb-table {
      width: 100%; border-collapse: collapse; background: var(--card-bg);
      border-radius: var(--radius); overflow: hidden;
    }
    .lb-table th {
      padding: 12px 10px;
      background: linear-gradient(135deg, var(--orange), #FF8555);
      color: white; font-size: 13px; font-weight: 600; text-align: center;
    }
    .lb-table td {
      padding: 10px; text-align: center; font-size: 13px;
      border-bottom: 1px solid #f0e8e0;
    }
    .lb-table tr:last-child td { border-bottom: none; }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes logoBounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    @keyframes overlayIn {
      from { opacity: 0; transform: scale(0.9) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes comboPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
    @keyframes timerPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    @media (max-width: 480px) {
      .screen { padding: 12px; }
      .logo-icon { font-size: 48px; }
      .logo-title { font-size: 26px; letter-spacing: 2px; }
      .difficulty-selector { gap: 8px; }
      .difficulty-card { padding: 12px 6px; }
      .difficulty-card .diff-icon { font-size: 26px; }
      .difficulty-card .diff-name { font-size: 14px; }
      .difficulty-card .diff-info { font-size: 10px; }
      .level-btn { width: 42px; height: 42px; font-size: 16px; }
      .level-connector { width: 14px; }
      .game-header { flex-direction: column; gap: 8px; }
      .game-info-cards { justify-content: center; }
      .game-controls { justify-content: center; }
      .info-card { padding: 6px 10px; min-width: 50px; }
      .info-card .info-value { font-size: 16px; }
      .info-card .info-label { font-size: 9px; }
      .items-bar { gap: 6px; }
      .item-btn { padding: 8px 4px; min-width: 60px; }
      .item-btn .item-icon { font-size: 20px; }
      .item-btn .item-name { font-size: 10px; }
      .item-btn .item-count { font-size: 11px; }
      .overlay-card { padding: 24px 16px; }
    }

    .great-job-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; align-items: flex-start; justify-content: center;
      pointer-events: none; z-index: 2000;
      opacity: 0; transition: opacity 0.3s ease; padding-top: 80px;
    }
    .great-job-overlay.active { opacity: 1; }
    .great-job-content { text-align: center; }
    .great-title {
      font-size: 64px; font-weight: 800;
      background: linear-gradient(135deg, #FF6B35, #FFD700, #FF3B30);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 4px 20px rgba(255, 107, 53, 0.4);
      animation: greatJobBounce 0.6s ease-out;
    }
    @keyframes greatJobBounce {
      0% { transform: scale(0.5) translateY(50px); }
      50% { transform: scale(1.1) translateY(-10px); }
      100% { transform: scale(1) translateY(0); }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="screen-menu" class="screen active">
      <div class="logo">
        <span class="logo-icon">🍎</span>
        <div class="logo-title">水果连连看</div>
        <div class="logo-subtitle">FRUIT LINK</div>
      </div>
      <div class="difficulty-selector">
        <div class="difficulty-card active" data-difficulty="easy">
          <span class="diff-icon">🌱</span>
          <div class="diff-name">简单</div>
          <div class="diff-info">8×8 · 6种水果<br>300秒 · 5提示</div>
        </div>
        <div class="difficulty-card" data-difficulty="medium">
          <span class="diff-icon">🌿</span>
          <div class="diff-name">中等</div>
          <div class="diff-info">10×10 · 8种水果<br>240秒 · 3提示</div>
        </div>
        <div class="difficulty-card" data-difficulty="hard">
          <span class="diff-icon">🔥</span>
          <div class="diff-name">困难</div>
          <div class="diff-info">12×12 · 10种水果<br>180秒 · 1提示</div>
        </div>
      </div>
      <div class="level-section">
        <div class="level-label">选择关卡</div>
        <div class="level-selector">
          <button class="level-btn unlocked" data-level="1"><span class="level-num">1</span></button>
          <span class="level-connector"></span>
          <button class="level-btn unlocked" data-level="2"><span class="level-num">2</span></button>
          <span class="level-connector"></span>
          <button class="level-btn unlocked" data-level="3"><span class="level-num">3</span></button>
          <span class="level-connector"></span>
          <button class="level-btn unlocked" data-level="4"><span class="level-num">4</span></button>
          <span class="level-connector"></span>
          <button class="level-btn unlocked" data-level="5"><span class="level-num">5</span></button>
          <span class="level-connector"></span>
          <button class="level-btn unlocked" data-level="6"><span class="level-num">6</span></button>
          <span class="level-connector"></span>
          <button class="level-btn unlocked" data-level="7"><span class="level-num">7</span></button>
          <span class="level-connector"></span>
          <button class="level-btn unlocked" data-level="8"><span class="level-num">8</span></button>
          <span class="level-connector"></span>
          <button class="level-btn unlocked" data-level="9"><span class="level-num">9</span></button>
          <span class="level-connector"></span>
          <button class="level-btn unlocked" data-level="10"><span class="level-num">10</span></button>
        </div>
      </div>
      <div class="menu-bottom">
        <button class="menu-btn" id="btnLeaderboard">🏆 排行榜</button>
        <button class="menu-btn" id="btnSoundToggle">🔊</button>
      </div>
    </div>

    <div id="screen-game" class="screen">
      <div class="game-header">
        <div class="game-info-cards">
          <div class="info-card">
            <div class="info-label">关卡</div>
            <div class="info-value" id="gameLevel">第1关</div>
          </div>
          <div class="info-card">
            <div class="info-label">难度</div>
            <div class="info-value" id="gameDifficulty" style="font-size:12px;font-family:var(--font);">简单</div>
          </div>
          <div class="info-card score">
            <div class="info-label">得分</div>
            <div class="info-value" id="gameScore">0</div>
          </div>
          <div class="info-card combo">
            <div class="info-label">连击</div>
            <div class="info-value" id="gameCombo">0</div>
          </div>
          <div class="info-card timer">
            <div class="info-label">时间</div>
            <div class="info-value" id="gameTime">05:00</div>
          </div>
        </div>
        <div class="game-controls">
          <button class="control-btn" id="btnPause" title="暂停">⏸️</button>
          <button class="control-btn" id="btnBack" title="返回">🏠</button>
        </div>
      </div>
      <div class="canvas-container">
        <canvas id="gameCanvas"></canvas>
      </div>
      <div class="items-bar">
        <button class="item-btn" data-item="hint">
          <span class="item-icon">💡</span>
          <span class="item-name">提示</span>
          <span class="item-count">5</span>
        </button>
        <button class="item-btn" data-item="shuffle">
          <span class="item-icon">🔀</span>
          <span class="item-name">重排</span>
          <span class="item-count">3</span>
        </button>
        <button class="item-btn" data-item="addTime">
          <span class="item-icon">⏱️</span>
          <span class="item-name">加时</span>
          <span class="item-count">3</span>
        </button>
        <button class="item-btn" data-item="eliminate">
          <span class="item-icon">💣</span>
          <span class="item-name">消除</span>
          <span class="item-count">3</span>
        </button>
      </div>
    </div>

    <div id="screen-leaderboard" class="screen">
      <div class="lb-header">
        <h2>🏆 排行榜</h2>
        <button class="lb-close-btn" id="btnCloseLeaderboard">✕</button>
      </div>
      <div class="lb-tabs">
        <button class="lb-tab active" data-difficulty="easy">🌱 简单</button>
        <button class="lb-tab" data-difficulty="medium">🌿 中等</button>
        <button class="lb-tab" data-difficulty="hard">🔥 困难</button>
      </div>
      <div class="lb-table-wrapper">
        <table class="lb-table">
          <thead>
            <tr>
              <th>排名</th><th>难度</th><th>关卡</th><th>分数</th><th>日期</th>
            </tr>
          </thead>
          <tbody id="lbBody">
            <tr><td colspan="5" style="text-align:center;padding:30px;color:#999;">暂无记录</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="pauseOverlay" class="overlay">
    <div class="overlay-card">
      <h2>⏸️ 游戏暂停</h2>
      <div class="overlay-message">休息一下，随时继续</div>
      <div class="overlay-buttons">
        <button class="overlay-btn primary" id="btnResume">继续游戏</button>
        <button class="overlay-btn secondary" id="btnQuit">返回菜单</button>
      </div>
    </div>
  </div>

  <div id="gameOverOverlay" class="overlay">
    <div class="overlay-card">
      <h2 id="gameOverTitle">🎉 恭喜通关</h2>
      <div class="overlay-message" id="gameOverMessage"></div>
      <div class="overlay-buttons">
        <button class="overlay-btn primary" id="btnNextLevel">下一关</button>
        <button class="overlay-btn primary" id="btnRestart">重新挑战</button>
        <button class="overlay-btn secondary" id="btnRetry">再试一次</button>
        <button class="overlay-btn secondary" id="btnMenu">返回菜单</button>
      </div>
    </div>
  </div>

  <div id="greatJobOverlay" class="great-job-overlay">
    <div class="great-job-content">
      <h2 class="great-title">太棒了！</h2>
    </div>
  </div>

  <script>
    // ============ 配置模块 ============
    const FRUITS = [
      { emoji: '🍎', name: '苹果', color: '#FF3B30' },
      { emoji: '🍊', name: '橙子', color: '#FF9500' },
      { emoji: '🍋', name: '柠檬', color: '#FFCC00' },
      { emoji: '🍇', name: '葡萄', color: '#AF52DE' },
      { emoji: '🍓', name: '草莓', color: '#FF2D55' },
      { emoji: '🍑', name: '桃子', color: '#FFB3A7' },
      { emoji: '🍒', name: '樱桃', color: '#E53E3E' },
      { emoji: '🥝', name: '猕猴桃', color: '#68D391' },
      { emoji: '🍌', name: '香蕉', color: '#FFD60A' },
      { emoji: '🍉', name: '西瓜', color: '#34C759' }
    ];

    // ============ 工具函数 ============
    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }
    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }
    function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
    function getDifficultyName(difficulty) {
      const names = { easy: '简单', medium: '中等', hard: '困难' };
      return names[difficulty] || difficulty;
    }

    // ============ Board 类 ============
    class Board {
      constructor(rows, cols, fruitCount, shapeType) {
        this.rows = rows; this.cols = cols; this.fruitCount = fruitCount;
        this.shapeType = shapeType || 'rect';
        this.shapeTemplate = SHAPE_TEMPLATES[this.shapeType] || null;
        this.grid = [];
        this.totalRows = rows + 2; this.totalCols = cols + 2;
      }
      init() {
        const validPositions = [];
        for (let r = 1; r <= this.rows; r++) {
          for (let c = 1; c <= this.cols; c++) {
            if (this.isValidPosition(r, c)) validPositions.push({ r, c });
          }
        }
        if (validPositions.length % 2 !== 0 && validPositions.length > 0) validPositions.pop();
        const pairsNeeded = Math.floor(validPositions.length / 2);
        const fruits = [];
        for (let i = 0; i < pairsNeeded; i++) {
          const fruitType = (i % this.fruitCount) + 1;
          fruits.push(fruitType, fruitType);
        }
        const shuffled = shuffle(fruits);
        this.grid = [];
        for (let r = 0; r < this.totalRows; r++) {
          this.grid[r] = [];
          for (let c = 0; c < this.totalCols; c++) this.grid[r][c] = 0;
        }
        for (let i = 0; i < validPositions.length && i < shuffled.length; i++) {
          const pos = validPositions[i];
          this.grid[pos.r][pos.c] = shuffled[i];
        }
      }
      isValidPosition(r, c) {
        if (this.shapeTemplate === null) return true;
        const tr = Math.min(r - 1, this.shapeTemplate.length - 1);
        const tc = Math.min(c - 1, (this.shapeTemplate[0] ? this.shapeTemplate[0].length : 1) - 1);
        if (tr < 0 || tc < 0 || tr >= this.shapeTemplate.length) return false;
        const row = this.shapeTemplate[tr];
        if (!row || tc >= row.length) return false;
        return row[tc] === 1;
      }
      getCell(r, c) {
        if (r < 0 || r >= this.totalRows || c < 0 || c >= this.totalCols) return 0;
        return this.grid[r][c];
      }
      setCell(r, c, value) {
        if (r >= 0 && r < this.totalRows && c >= 0 && c < this.totalCols) this.grid[r][c] = value;
      }
      isEmpty(r, c) { return this.getCell(r, c) === 0; }
      isInside(r, c) { return r >= 1 && r <= this.rows && c >= 1 && c <= this.cols; }
      getInnerCells() {
        const cells = [];
        for (let r = 1; r <= this.rows; r++) {
          for (let c = 1; c <= this.cols; c++) {
            if (this.grid[r][c] !== 0) cells.push({ r, c, type: this.grid[r][c] });
          }
        }
        return cells;
      }
      getRemainingCount() {
        let count = 0;
        for (let r = 1; r <= this.rows; r++) {
          for (let c = 1; c <= this.cols; c++) {
            if (this.grid[r][c] !== 0) count++;
          }
        }
        return count;
      }
      removePair(r1, c1, r2, c2) { this.grid[r1][c1] = 0; this.grid[r2][c2] = 0; }
      shuffleBoard() {
        const cells = this.getInnerCells();
        const types = cells.map(c => c.type);
        const shuffledTypes = shuffle(types);
        for (let i = 0; i < cells.length; i++) this.grid[cells[i].r][cells[i].c] = shuffledTypes[i];
      }
      getFruitEmoji(type) { return type > 0 && type <= FRUITS.length ? FRUITS[type - 1].emoji : ''; }
      getFruitColor(type) { return type > 0 && type <= FRUITS.length ? FRUITS[type - 1].color : '#ccc'; }
      applyGravity() {
        let changed = false;
        for (let c = 1; c <= this.cols; c++) {
          const column = [];
          for (let r = this.rows; r >= 1; r--) {
            if (this.isValidPosition(r, c) && this.grid[r][c] !== 0) column.push(this.grid[r][c]);
          }
          let writeIndex = this.rows, colIdx = 0;
          while (writeIndex >= 1) {
            if (this.isValidPosition(writeIndex, c)) {
              const newValue = colIdx < column.length ? column[colIdx] : 0;
              if (this.grid[writeIndex][c] !== newValue) changed = true;
              this.grid[writeIndex][c] = newValue; colIdx++;
            } else {
              if (this.grid[writeIndex][c] !== 0) changed = true;
              this.grid[writeIndex][c] = 0;
            }
            writeIndex--;
          }
        }
        return changed;
      }
    }

    // ============ PathFinder 类 ============
    class PathFinder {
      constructor(board) { this.board = board; }
      canConnect(r1, c1, r2, c2) {
        if (r1 === r2 && c1 === c2) return null;
        if (this.board.getCell(r1, c1) !== this.board.getCell(r2, c2)) return null;
        if (this.board.getCell(r1, c1) === 0) return null;
        let path = this.directConnect(r1, c1, r2, c2);
        if (path) return { turns: 0, path };
        path = this.oneTurnConnect(r1, c1, r2, c2);
        if (path) return { turns: 1, path };
        path = this.twoTurnConnect(r1, c1, r2, c2);
        if (path) return { turns: 2, path };
        return null;
      }
      directConnect(r1, c1, r2, c2) {
        if (r1 === r2) {
          const minC = Math.min(c1, c2), maxC = Math.max(c1, c2);
          for (let c = minC + 1; c < maxC; c++) if (this.board.getCell(r1, c) !== 0) return null;
          return [{ r: r1, c: c1 }, { r: r2, c: c2 }];
        }
        if (c1 === c2) {
          const minR = Math.min(r1, r2), maxR = Math.max(r1, r2);
          for (let r = minR + 1; r < maxR; r++) if (this.board.getCell(r, c1) !== 0) return null;
          return [{ r: r1, c: c1 }, { r: r2, c: c2 }];
        }
        return null;
      }
      oneTurnConnect(r1, c1, r2, c2) {
        if (this.board.isEmpty(r1, c2)) {
          if (this.isLineClear(r1, c1, r1, c2, true) && this.isLineClear(r1, c2, r2, c2, false))
            return [{ r: r1, c: c1 }, { r: r1, c: c2 }, { r: r2, c: c2 }];
        }
        if (this.board.isEmpty(r2, c1)) {
          if (this.isLineClear(r1, c1, r2, c1, false) && this.isLineClear(r2, c1, r2, c2, true))
            return [{ r: r1, c: c1 }, { r: r2, c: c1 }, { r: r2, c: c2 }];
        }
        return null;
      }
      twoTurnConnect(r1, c1, r2, c2) {
        for (let r = 0; r < this.board.totalRows; r++) {
          if (this.board.isEmpty(r, c1) && this.board.isEmpty(r, c2)) {
            if (this.isLineClear(r1, c1, r, c1, false) && this.isLineClear(r, c1, r, c2, true) && this.isLineClear(r, c2, r2, c2, false))
              return [{ r: r1, c: c1 }, { r: r, c: c1 }, { r: r, c: c2 }, { r: r2, c: c2 }];
          }
        }
        for (let c = 0; c < this.board.totalCols; c++) {
          if (this.board.isEmpty(r1, c) && this.board.isEmpty(r2, c)) {
            if (this.isLineClear(r1, c1, r1, c, true) && this.isLineClear(r1, c, r2, c, false) && this.isLineClear(r2, c, r2, c2, true))
              return [{ r: r1, c: c1 }, { r: r1, c: c }, { r: r2, c: c }, { r: r2, c: c2 }];
          }
        }
        return null;
      }
      isLineClear(r1, c1, r2, c2, isHorizontal) {
        if (isHorizontal) {
          const minC = Math.min(c1, c2), maxC = Math.max(c1, c2);
          for (let c = minC + 1; c < maxC; c++) if (this.board.getCell(r1, c) !== 0) return false;
        } else {
          const minR = Math.min(r1, r2), maxR = Math.max(r1, r2);
          for (let r = minR + 1; r < maxR; r++) if (this.board.getCell(r, c1) !== 0) return false;
        }
        return true;
      }
      findAnyMatch() {
        const cells = this.board.getInnerCells();
        for (let i = 0; i < cells.length; i++) {
          for (let j = i + 1; j < cells.length; j++) {
            if (cells[i].type === cells[j].type) {
              const result = this.canConnect(cells[i].r, cells[i].c, cells[j].r, cells[j].c);
              if (result) return { cell1: cells[i], cell2: cells[j], ...result };
            }
          }
        }
        return null;
      }
      hasValidMove() { return this.findAnyMatch() !== null; }
    }

    // ============ CanvasRenderer 类 ============
    class CanvasRenderer {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.cellSize = 50;
        this.offsetX = 0; this.offsetY = 0;
        this.selectedCell = null;
        this.hintCells = null;
        this.hintAlpha = 0;
      }
      resize(boardRows, boardCols) {
        const container = this.canvas.parentElement;
        const maxWidth = Math.max(100, container.clientWidth - 10);
        const maxHeight = Math.max(100, window.innerHeight * 0.92);
        const cellByWidth = Math.floor(maxWidth / (boardCols + 2));
        const cellByHeight = Math.floor(maxHeight / (boardRows + 2));
        this.cellSize = Math.max(40, Math.min(cellByWidth, cellByHeight, 200));
        this.canvas.width = (boardCols + 2) * this.cellSize;
        this.canvas.height = (boardRows + 2) * this.cellSize;
        this.offsetX = this.cellSize;
        this.offsetY = this.cellSize;
      }
      clear() { this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height); }
      drawBoard(board) {
        this.clear();
        for (let r = 1; r <= board.rows; r++) {
          for (let c = 1; c <= board.cols; c++) {
            if (board.shapeTemplate !== null && !board.isValidPosition(r, c)) continue;
            const x = c * this.cellSize;
            const y = r * this.cellSize;
            this.ctx.fillStyle = (r + c) % 2 === 0 ? '#FFF9F0' : '#FFF3E0';
            this.ctx.fillRect(x + 2, y + 2, this.cellSize - 4, this.cellSize - 4);
            this.ctx.strokeStyle = '#E8D5C0';
            this.ctx.lineWidth = 0.5;
            this.ctx.strokeRect(x + 2, y + 2, this.cellSize - 4, this.cellSize - 4);
          }
        }
        for (let r = 1; r <= board.rows; r++) {
          for (let c = 1; c <= board.cols; c++) {
            if (board.shapeTemplate !== null && !board.isValidPosition(r, c)) continue;
            const type = board.grid[r][c];
            if (type === 0) continue;
            const cx = c * this.cellSize + this.cellSize / 2;
            const cy = r * this.cellSize + this.cellSize / 2;
            const isSelected = this.selectedCell && this.selectedCell.r === r && this.selectedCell.c === c;
            const isHinted = this.hintCells && this.hintCells.some(h => h.r === r && h.c === c);
            this.drawFruit(cx, cy, type, isSelected, isHinted, board);
          }
        }
      }
      drawFruit(cx, cy, type, isSelected, isHinted, board) {
        const radius = Math.max(1, this.cellSize * 0.43);
        const ctx = this.ctx;
        const color = board.getFruitColor(type);
        if (isSelected) {
          ctx.save();
          ctx.shadowColor = color; ctx.shadowBlur = 20;
          ctx.beginPath(); ctx.arc(cx, cy, radius + 6, 0, Math.PI * 2);
          ctx.fillStyle = color; ctx.globalAlpha = 0.3; ctx.fill();
          ctx.restore();
          ctx.save();
          ctx.beginPath(); ctx.arc(cx, cy, radius + 4, 0, Math.PI * 2);
          ctx.strokeStyle = color; ctx.lineWidth = 4; ctx.stroke();
          ctx.restore();
        }
        if (isHinted && this.hintAlpha > 0) {
          ctx.save();
          ctx.beginPath(); ctx.arc(cx, cy, radius + 6, 0, Math.PI * 2);
          ctx.fillStyle = '#FFD700'; ctx.globalAlpha = this.hintAlpha * 0.4; ctx.fill();
          ctx.shadowColor = '#FFD700'; ctx.shadowBlur = 15;
          ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 4; ctx.stroke();
          ctx.restore();
        }
        const innerRadius = Math.max(0, radius * 0.1);
        const gradient = ctx.createRadialGradient(cx - radius * 0.3, cy - radius * 0.3, innerRadius, cx, cy, radius);
        gradient.addColorStop(0, this.lightenColor(color, 40));
        gradient.addColorStop(0.7, color);
        gradient.addColorStop(1, this.darkenColor(color, 20));
        ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fillStyle = gradient; ctx.fill();
        ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.strokeStyle = this.darkenColor(color, 10); ctx.lineWidth = 3; ctx.stroke();
        const fontSize = Math.max(16, this.cellSize * 0.65);
        ctx.font = `${fontSize}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(board.getFruitEmoji(type), cx, cy + 1);
      }
      lightenColor(hex, percent) {
        const num = parseInt(hex.replace('#', ''), 16);
        const r = Math.min(255, (num >> 16) + percent);
        const g = Math.min(255, ((num >> 8) & 0x00FF) + percent);
        const b = Math.min(255, (num & 0x0000FF) + percent);
        return `rgb(${r},${g},${b})`;
      }
      darkenColor(hex, percent) {
        const num = parseInt(hex.replace('#', ''), 16);
        const r = Math.max(0, (num >> 16) - percent);
        const g = Math.max(0, ((num >> 8) & 0x00FF) - percent);
        const b = Math.max(0, (num & 0x0000FF) - percent);
        return `rgb(${r},${g},${b})`;
      }
      drawPath(points, color) {
        if (!points || points.length < 2) return;
        const ctx = this.ctx;
        const pathColor = color || '#FF6B35';
        ctx.save();
        ctx.strokeStyle = pathColor; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.shadowColor = pathColor; ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
        ctx.stroke();
        ctx.restore();
      }
      setSelected(cell) { this.selectedCell = cell; }
      setHintCells(cells) { this.hintCells = cells; this.hintAlpha = 0; }
      updateHintAlpha(delta) { if (this.hintCells) this.hintAlpha = Math.min(1, this.hintAlpha + delta * 2); }
      clearHint() { this.hintCells = null; this.hintAlpha = 0; }
      getCellFromPos(x, y, board) {
        const col = Math.floor((x - this.offsetX) / this.cellSize) + 1;
        const row = Math.floor((y - this.offsetY) / this.cellSize) + 1;
        if (board.shapeTemplate !== null && !board.isValidPosition(row, col)) return null;
        const cellCenterX = col * this.cellSize + this.cellSize / 2;
        const cellCenterY = row * this.cellSize + this.cellSize / 2;
        const dist = Math.sqrt((x - cellCenterX) ** 2 + (y - cellCenterY) ** 2);
        if (dist < this.cellSize * 0.55) return { r: row, c: col };
        return null;
      }
      drawParticles(particles) {
        const ctx = this.ctx;
        particles.forEach(p => {
          ctx.save();
          ctx.globalAlpha = p.alpha;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });
      }
    }

    // ============ ItemManager 类 ============
    class ItemManager {
      constructor(config) {
        this.items = {
          hint: { count: config.hints, used: 0 },
          shuffle: { count: config.shuffles, used: 0 },
          addTime: { count: config.addTimes, used: 0 },
          eliminate: { count: config.eliminates, used: 0 }
        };
      }
      canUse(type) { const item = this.items[type]; return item ? item.used < item.count : false; }
      use(type) { if (!this.canUse(type)) return false; this.items[type].used++; return true; }
      getRemaining(type) { const item = this.items[type]; return item ? Math.max(0, item.count - item.used) : 0; }
      getTimeBonus() { return TIME_BONUS; }
    }

    // ============ TimerManager 类 ============
    class TimerManager {
      constructor(onTick, onTimeout) {
        this.timeLeft = 0; this.totalTime = 0;
        this.isPaused = false; this.isRunning = false; this.intervalId = null;
        this.onTick = onTick; this.onTimeout = onTimeout;
      }
      start(totalSeconds) {
        this.stop();
        this.timeLeft = totalSeconds; this.totalTime = totalSeconds;
        this.isPaused = false; this.isRunning = true;
        this.intervalId = setInterval(() => {
          if (!this.isPaused) {
            this.timeLeft--;
            if (this.onTick) this.onTick(this.timeLeft);
            if (this.timeLeft <= 0) { this.stop(); if (this.onTimeout) this.onTimeout(); }
          }
        }, 1000);
      }
      pause() { this.isPaused = true; }
      resume() { this.isPaused = false; }
      togglePause() { this.isPaused = !this.isPaused; return this.isPaused; }
      stop() { if (this.intervalId) { clearInterval(this.intervalId); this.intervalId = null; } this.isRunning = false; this.isPaused = false; }
      addTime(seconds) { this.timeLeft += seconds; this.totalTime += seconds; }
      getTimeLeft() { return this.timeLeft; }
    }

    // ============ ScoreManager 类 ============
    class ScoreManager {
      constructor() { this.score = 0; this.combo = 0; this.maxCombo = 0; this.totalPairs = 0; this.matchedPairs = 0; }
      reset() { this.score = 0; this.combo = 0; this.maxCombo = 0; this.totalPairs = 0; this.matchedPairs = 0; }
      setTotalPairs(count) { this.totalPairs = count; }
      addMatch() {
        this.combo++; this.matchedPairs++;
        if (this.combo > this.maxCombo) this.maxCombo = this.combo;
        const total = SCORE_CONFIG.baseMatch + this.combo * SCORE_CONFIG.comboBonus;
        this.score += total;
        return { points: total, combo: this.combo };
      }
      resetCombo() { this.combo = 0; }
      addTimeBonus(timeLeft) { const bonus = Math.floor(timeLeft * SCORE_CONFIG.timeBonusMultiplier); this.score += bonus; return bonus; }
      getScore() { return this.score; }
      getCombo() { return this.combo; }
      getMaxCombo() { return this.maxCombo; }
    }

    // ============ LevelManager 类 ============
    class LevelManager {
      constructor() { this.progress = this.loadProgress(); }
      loadProgress() {
        try { const data = localStorage.getItem(STORAGE_KEYS.progress); if (data) return JSON.parse(data); } catch (e) {}
        return { easy: 1, medium: 1, hard: 1 };
      }
      saveProgress() { localStorage.setItem(STORAGE_KEYS.progress, JSON.stringify(this.progress)); }
      getUnlockedLevel(difficulty) { return this.progress[difficulty] || 1; }
      isLevelUnlocked(difficulty, level) { return level <= this.getUnlockedLevel(difficulty); }
      completeLevel(difficulty, level) {
        const nextLevel = level + 1;
        if (nextLevel <= TOTAL_LEVELS && nextLevel > this.progress[difficulty]) {
          this.progress[difficulty] = nextLevel; this.saveProgress(); return true;
        }
        return false;
      }
    }

    // ============ RankingManager 类 ============
    class RankingManager {
      constructor() { this.rankings = this.loadRankings(); }
      loadRankings() {
        try { const data = localStorage.getItem(STORAGE_KEYS.ranking); if (data) return JSON.parse(data); } catch (e) {}
        return [];
      }
      saveRankings() { localStorage.setItem(STORAGE_KEYS.ranking, JSON.stringify(this.rankings)); }
      addRecord(difficulty, level, score, combo) {
        this.rankings.push({ difficulty, level, score, combo, date: new Date().toISOString() });
        this.rankings.sort((a, b) => b.score - a.score);
        if (this.rankings.length > 50) this.rankings.length = 50;
        this.saveRankings();
      }
      getTopRecords(difficulty, count) {
        const n = count || 10;
        return this.rankings.filter(r => r.difficulty === difficulty).slice(0, n);
      }
    }

    // ============ AudioManager 类 ============
    class AudioManager {
      constructor() { this.ctx = null; this.enabled = true; this.loadSettings(); }
      loadSettings() {
        const saved = localStorage.getItem(STORAGE_KEYS.soundEnabled);
        if (saved !== null) this.enabled = saved === 'true';
      }
      saveSettings() { localStorage.setItem(STORAGE_KEYS.soundEnabled, String(this.enabled)); }
      toggle() { this.enabled = !this.enabled; this.saveSettings(); return this.enabled; }
      getContext() {
        if (!this.ctx) {
          try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return null; }
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
        return this.ctx;
      }
      playTone(freq, duration, type, volume) {
        if (!this.enabled) return;
        const ctx = this.getContext();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(volume !== undefined ? volume : 0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + duration);
      }
      playClick() { this.playTone(800, 0.08, 'sine', 0.2); }
      playMatch() {
        if (!this.enabled) return;
        const ctx = this.getContext(); if (!ctx) return;
        const now = ctx.currentTime;
        [523, 659, 784].forEach((freq, i) => {
          const osc = ctx.createOscillator(); const gain = ctx.createGain();
          osc.type = 'sine'; osc.frequency.setValueAtTime(freq, now + i * 0.06);
          gain.gain.setValueAtTime(0.25, now + i * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.15);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now + i * 0.06); osc.stop(now + i * 0.06 + 0.15);
        });
      }
      playCombo(comboCount) {
        if (!this.enabled) return;
        const ctx = this.getContext(); if (!ctx) return;
        const now = ctx.currentTime;
        const baseFreq = 400 + Math.min(comboCount, 10) * 50;
        for (let i = 0; i < Math.min(comboCount + 1, 5); i++) {
          const osc = ctx.createOscillator(); const gain = ctx.createGain();
          osc.type = 'triangle'; osc.frequency.setValueAtTime(baseFreq + i * 100, now + i * 0.05);
          gain.gain.setValueAtTime(0.2, now + i * 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.12);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now + i * 0.05); osc.stop(now + i * 0.05 + 0.12);
        }
      }
      playVictory() {
        if (!this.enabled) return;
        const ctx = this.getContext(); if (!ctx) return;
        const now = ctx.currentTime;
        [523, 659, 784, 1047].forEach((freq, i) => {
          const osc = ctx.createOscillator(); const gain = ctx.createGain();
          osc.type = 'sine'; osc.frequency.setValueAtTime(freq, now + i * 0.15);
          gain.gain.setValueAtTime(0.3, now + i * 0.15);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.15 + 0.4);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now + i * 0.15); osc.stop(now + i * 0.15 + 0.4);
        });
      }
      playDefeat() {
        if (!this.enabled) return;
        const ctx = this.getContext(); if (!ctx) return;
        const now = ctx.currentTime;
        [400, 350, 300, 200].forEach((freq, i) => {
          const osc = ctx.createOscillator(); const gain = ctx.createGain();
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(freq, now + i * 0.2);
          gain.gain.setValueAtTime(0.15, now + i * 0.2);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.2 + 0.3);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now + i * 0.2); osc.stop(now + i * 0.2 + 0.3);
        });
      }
      playItem() { this.playTone(600, 0.1, 'triangle', 0.25); setTimeout(() => this.playTone(900, 0.1, 'triangle', 0.25), 80); }
      playShuffle() {
        if (!this.enabled) return;
        const ctx = this.getContext(); if (!ctx) return;
        const now = ctx.currentTime;
        for (let i = 0; i < 5; i++) {
          const osc = ctx.createOscillator(); const gain = ctx.createGain();
          osc.type = 'square'; osc.frequency.setValueAtTime(200 + Math.random() * 600, now + i * 0.08);
          gain.gain.setValueAtTime(0.1, now + i * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.1);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + 0.1);
        }
      }
    }

    // ============ Game 主类 ============
    class Game {
      constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.renderer = new CanvasRenderer(this.canvas);
        this.scoreManager = new ScoreManager();
        this.timer = null;
        this.itemManager = null;
        this.board = null;
        this.pathFinder = null;
        this.difficulty = 'easy';
        this.level = 1;
        this.selectedCell = null;
        this.isProcessing = false;
        this.isGameActive = false;
        this.particles = [];
        this.currentPath = null;
        this.difficultyConfig = null;
        this.hintTimeout = null;
        this.audioManager = new AudioManager();
        this.levelManager = new LevelManager();
        this.rankingManager = new RankingManager();
        this.bindEvents();
        this.showScreen('menu');
        this.updateMenuUI();
      }

      bindEvents() {
        this.canvas.addEventListener('click', (e) => this.handleCanvasClick(e));
        this.canvas.addEventListener('touchstart', (e) => {
          e.preventDefault();
          const touch = e.touches[0];
          const rect = this.canvas.getBoundingClientRect();
          const x = touch.clientX - rect.left;
          const y = touch.clientY - rect.top;
          this.handleCanvasClick({ offsetX: x, offsetY: y });
        });
        document.querySelector('.difficulty-card[data-difficulty="easy"]').addEventListener('click', () => this.selectDifficulty('easy'));
        document.querySelector('.difficulty-card[data-difficulty="medium"]').addEventListener('click', () => this.selectDifficulty('medium'));
        document.querySelector('.difficulty-card[data-difficulty="hard"]').addEventListener('click', () => this.selectDifficulty('hard'));
        document.querySelectorAll('.level-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const level = parseInt(btn.dataset.level);
            if (this.levelManager.isLevelUnlocked(this.difficulty, level)) this.startGame(level);
          });
        });
        document.getElementById('btnLeaderboard').addEventListener('click', () => this.showLeaderboard());
        document.getElementById('btnSoundToggle').addEventListener('click', () => this.toggleSound());
        document.getElementById('btnCloseLeaderboard').addEventListener('click', () => this.showScreen('menu'));
        document.getElementById('btnPause').addEventListener('click', () => this.togglePause());
        document.getElementById('btnBack').addEventListener('click', () => this.quitGame());
        document.getElementById('btnResume').addEventListener('click', () => this.togglePause());
        document.getElementById('btnQuit').addEventListener('click', () => this.quitGame());
        document.getElementById('btnRestart').addEventListener('click', () => this.startGame(this.level));
        document.getElementById('btnMenu').addEventListener('click', () => this.quitGame());
        document.getElementById('btnNextLevel').addEventListener('click', () => this.nextLevel());
        document.querySelectorAll('.item-btn').forEach(btn => {
          btn.addEventListener('click', () => { this.useItem(btn.dataset.item); });
        });
        document.querySelectorAll('.lb-tab').forEach(tab => {
          tab.addEventListener('click', () => {
            document.querySelectorAll('.lb-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            this.renderLeaderboardTable(tab.dataset.difficulty);
          });
        });
      }

      selectDifficulty(difficulty) {
        this.difficulty = difficulty;
        document.querySelectorAll('.difficulty-card').forEach(c => c.classList.remove('active'));
        const card = document.querySelector('.difficulty-card[data-difficulty="' + difficulty + '"]');
        if (card) card.classList.add('active');
        this.updateLevelButtons();
      }

      updateLevelButtons() {
        const unlocked = this.levelManager.getUnlockedLevel(this.difficulty);
        document.querySelectorAll('.level-btn').forEach(btn => {
          const level = parseInt(btn.dataset.level);
          btn.classList.remove('locked', 'unlocked');
          if (level <= unlocked) btn.classList.add('unlocked');
          else btn.classList.add('locked');
        });
      }

      updateMenuUI() {
        document.querySelector('.difficulty-card[data-difficulty="easy"]').classList.add('active');
        this.updateLevelButtons();
        this.updateSoundButton();
      }

      updateSoundButton() { document.getElementById('btnSoundToggle').textContent = this.audioManager.enabled ? '🔊' : '🔇'; }
      toggleSound() { const e = this.audioManager.toggle(); this.updateSoundButton(); if (e) this.audioManager.playClick(); }
      showScreen(screen) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        const el = document.getElementById('screen-' + screen);
        if (el) el.classList.add('active');
        if (screen === 'menu') this.updateMenuUI();
      }

      showLeaderboard() {
        this.showScreen('leaderboard');
        document.querySelectorAll('.lb-tab').forEach(t => t.classList.remove('active'));
        const activeTab = document.querySelector('.lb-tab[data-difficulty="' + this.difficulty + '"]');
        if (activeTab) activeTab.classList.add('active');
        this.renderLeaderboardTable(this.difficulty);
      }

      renderLeaderboardTable(difficulty) {
        const tbody = document.getElementById('lbBody');
        const records = this.rankingManager.getTopRecords(difficulty, 10);
        if (records.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:30px;color:#999;">暂无记录</td></tr>';
          return;
        }
        tbody.innerHTML = records.map((r, i) => {
          const rankIcon = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
          const date = new Date(r.date).toLocaleDateString('zh-CN');
          return '<tr><td>' + rankIcon + '</td><td>' + getDifficultyName(r.difficulty) + '</td><td>第' + r.level + '关</td><td>' + r.score + '</td><td>' + date + '</td></tr>';
        }).join('');
      }

      startGame(level) {
        this.level = level;
        this.difficultyConfig = DIFFICULTY_CONFIG[this.difficulty];
        const levelCfg = LEVEL_CONFIG[level] || LEVEL_CONFIG[1];
        const shapeType = levelCfg.shape || 'rect';
        const rows = Math.min(levelCfg.rows, this.difficultyConfig.rows + 2);
        const cols = Math.min(levelCfg.cols, this.difficultyConfig.cols + 2);
        const fruitCount = Math.min(this.difficultyConfig.fruitCount + Math.floor((level - 1) / 2), FRUITS.length);
        this.isGameActive = true;
        this.selectedCell = null;
        this.isProcessing = false;
        this.particles = [];
        this.currentPath = null;
        this.board = new Board(rows, cols, fruitCount, shapeType);
        this.board.init();
        this.pathFinder = new PathFinder(this.board);
        for (let i = 0; i < 10; i++) {
          this.board.shuffleBoard();
          if (this.pathFinder.hasValidMove()) break;
        }
        this.scoreManager.reset();
        let validPos = 0;
        for (let r = 1; r <= rows; r++) for (let c = 1; c <= cols; c++) if (this.board.isValidPosition(r, c)) validPos++;
        this.scoreManager.setTotalPairs(Math.floor(validPos / 2));
        this.itemManager = new ItemManager({ hints: this.difficultyConfig.hints, shuffles: this.difficultyConfig.shuffles, addTimes: this.difficultyConfig.addTimes, eliminates: this.difficultyConfig.eliminates });
        this.renderer.resize(this.board.rows, this.board.cols);
        this.renderer.drawBoard(this.board);
        this.renderer.setSelected(null);
        this.renderer.clearHint();
        this.updateGameUI();
        document.getElementById('gameLevel').textContent = levelCfg.name || ('第' + level + '关');
        const self = this;
        this.timer = new TimerManager((t) => self.onTimerTick(t), () => self.onTimeUp());
        this.timer.start(this.difficultyConfig.timeLimit);
        this.showScreen('game');
        document.getElementById('gameOverOverlay').classList.remove('active');
        document.getElementById('pauseOverlay').classList.remove('active');
        this.audioManager.playClick();
        this.startGameLoop();
      }

      startGameLoop() {
        const loop = () => {
          if (!this.isGameActive) return;
          this.updateParticles();
          this.renderer.drawBoard(this.board);
          this.renderer.drawParticles(this.particles);
          if (this.currentPath) this.renderer.drawPath(this.currentPath, '#FF6B35');
          this.renderer.updateHintAlpha(0.016);
          requestAnimationFrame(loop);
        };
        requestAnimationFrame(loop);
      }

      onTimerTick(timeLeft) {
        this.updateTimerDisplay(timeLeft);
        const timerEl = document.getElementById('gameTime');
        if (timeLeft <= 30) timerEl.classList.add('warning');
      }

      updateTimerDisplay(timeLeft) {
        const timerEl = document.getElementById('gameTime');
        timerEl.textContent = formatTime(timeLeft);
        timerEl.classList.toggle('warning', timeLeft <= 30);
      }

      onTimeUp() {
        this.isGameActive = false;
        this.isProcessing = true;
        this.audioManager.playDefeat();
        this.showGameOver(false);
      }

      handleCanvasClick(e) {
        if (!this.isGameActive || this.isProcessing) return;
        const rect = this.canvas.getBoundingClientRect();
        const scaleX = this.canvas.width / rect.width;
        const scaleY = this.canvas.height / rect.height;
        const x = (e.offsetX || (e.clientX - rect.left)) * scaleX;
        const y = (e.offsetY || (e.clientY - rect.top)) * scaleY;
        const cell = this.renderer.getCellFromPos(x, y, this.board);
        if (!cell) return;
        if (!this.board.isInside(cell.r, cell.c)) return;
        if (this.board.isEmpty(cell.r, cell.c)) return;
        this.audioManager.playClick();
        if (!this.selectedCell) { this.selectedCell = cell; this.renderer.setSelected(cell); return; }
        if (this.selectedCell.r === cell.r && this.selectedCell.c === cell.c) {
          this.selectedCell = null; this.renderer.setSelected(null); return;
        }
        const result = this.pathFinder.canConnect(this.selectedCell.r, this.selectedCell.c, cell.r, cell.c);
        if (result) this.handleMatch(this.selectedCell, cell, result);
        else { this.scoreManager.resetCombo(); this.updateComboDisplay(); this.selectedCell = cell; this.renderer.setSelected(cell); }
      }

      handleMatch(cell1, cell2, result) {
        this.isProcessing = true;
        this.renderer.clearHint();
        clearTimeout(this.hintTimeout);
        const matchResult = this.scoreManager.addMatch();
        this.updateScoreDisplay();
        this.updateComboDisplay();
        this.board.removePair(cell1.r, cell1.c, cell2.r, cell2.c);
        this.renderer.setSelected(null);
        this.selectedCell = null;
        const cellSize = this.renderer.cellSize;
        const offsetX = this.renderer.offsetX;
        const offsetY = this.renderer.offsetY;
        this.currentPath = result.path.map(p => ({ x: p.c * cellSize + offsetX, y: p.r * cellSize + offsetY }));
        if (matchResult.combo > 1) this.audioManager.playCombo(matchResult.combo);
        else this.audioManager.playMatch();
        this.showGreatJob();
        this.spawnParticles(cell1, this.board.getCell(cell1.r, cell1.c) || 1, cellSize, offsetX, offsetY);
        this.spawnParticles(cell2, this.board.getCell(cell2.r, cell2.c) || 1, cellSize, offsetX, offsetY);
        const self = this;
        setTimeout(() => {
          self.currentPath = null;
          self.board.applyGravity();
          if (!self.pathFinder.hasValidMove()) {
            for (let i = 0; i < 5; i++) { self.board.shuffleBoard(); if (self.pathFinder.hasValidMove()) break; }
          }
          self.isProcessing = false;
          self.checkGameStatus();
        }, 300);
      }

      spawnParticles(cell, fruitType, cellSize, offsetX, offsetY) {
        const cx = cell.c * cellSize + offsetX + cellSize / 2;
        const cy = cell.r * cellSize + offsetY + cellSize / 2;
        const color = this.board.getFruitColor(fruitType);
        for (let i = 0; i < 12; i++) {
          const angle = (Math.PI * 2 * i) / 12;
          const speed = 2 + Math.random() * 3;
          this.particles.push({ x: cx, y: cy, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, size: 3 + Math.random() * 4, color: color, alpha: 1, life: 1 });
        }
      }

      updateParticles() {
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.x += p.vx; p.y += p.vy; p.life -= 0.03; p.alpha = p.life; p.size *= 0.98;
          if (p.life <= 0) this.particles.splice(i, 1);
        }
      }

      checkGameStatus() {
        if (this.board.getRemainingCount() === 0) { this.onLevelComplete(); return; }
        if (!this.pathFinder.hasValidMove()) {
          for (let i = 0; i < 5; i++) { this.board.shuffleBoard(); if (this.pathFinder.hasValidMove()) break; }
          this.audioManager.playShuffle();
        }
      }

      onLevelComplete() {
        this.isGameActive = false;
        this.timer.stop();
        const timeBonus = this.scoreManager.addTimeBonus(this.timer.getTimeLeft());
        this.updateScoreDisplay();
        this.audioManager.playVictory();
        const isNewUnlock = this.levelManager.completeLevel(this.difficulty, this.level);
        this.rankingManager.addRecord(this.difficulty, this.level, this.scoreManager.getScore(), this.scoreManager.getMaxCombo());
        this.showGameOver(true, timeBonus, isNewUnlock);
      }

      showGameOver(isWin, timeBonus, isNewUnlock) {
        const overlay = document.getElementById('gameOverOverlay');
        const title = document.getElementById('gameOverTitle');
        const message = document.getElementById('gameOverMessage');
        const btnNext = document.getElementById('btnNextLevel');
        const btnRetry = document.getElementById('btnRetry');
        overlay.classList.add('active');
        if (isWin) {
          title.textContent = '🎉 恭喜通关！'; title.style.color = '#FF6B35';
          message.innerHTML = '时间奖励: +' + timeBonus + ' 分<br>总分: ' + this.scoreManager.getScore() + ' 分<br>最大连击: ' + this.scoreManager.getMaxCombo() + ' 连';
          if (isNewUnlock) message.innerHTML += '<br>🔓 新关卡已解锁！';
          btnNext.style.display = this.level < TOTAL_LEVELS ? 'inline-block' : 'none';
          btnRetry.style.display = 'none';
        } else {
          title.textContent = '⏰ 时间到！'; title.style.color = '#EF476F';
          message.innerHTML = '最终得分: ' + this.scoreManager.getScore() + ' 分<br>已消除: ' + this.scoreManager.matchedPairs + ' 对<br>最大连击: ' + this.scoreManager.getMaxCombo() + ' 连';
          btnNext.style.display = 'none';
          btnRetry.style.display = 'inline-block';
        }
      }

      togglePause() {
        if (!this.timer) return;
        const isPaused = this.timer.togglePause();
        const overlay = document.getElementById('pauseOverlay');
        if (isPaused) { overlay.classList.add('active'); this.isGameActive = false; }
        else { overlay.classList.remove('active'); this.isGameActive = true; this.startGameLoop(); }
      }

      quitGame() {
        this.isGameActive = false;
        if (this.timer) this.timer.stop();
        document.getElementById('pauseOverlay').classList.remove('active');
        document.getElementById('gameOverOverlay').classList.remove('active');
        this.showScreen('menu');
        this.updateMenuUI();
      }

      useItem(type) {
        if (!this.isGameActive || this.isProcessing) return;
        if (!this.itemManager.canUse(type)) return;
        if (type === 'hint') this.useHint();
        else if (type === 'shuffle') this.useShuffle();
        else if (type === 'addTime') this.useAddTime();
        else if (type === 'eliminate') this.useEliminate();
      }

      useHint() {
        const match = this.pathFinder.findAnyMatch();
        if (!match) return;
        if (!this.itemManager.use('hint')) return;
        this.audioManager.playItem();
        this.renderer.setHintCells([match.cell1, match.cell2]);
        this.renderer.updateHintAlpha(1);
        this.updateItemUI();
        clearTimeout(this.hintTimeout);
        const self = this;
        this.hintTimeout = setTimeout(() => { self.renderer.clearHint(); }, ANIMATION_DURATION.hint);
      }

      useShuffle() {
        if (!this.itemManager.use('shuffle')) return;
        this.isProcessing = true;
        for (let i = 0; i < 8; i++) this.board.shuffleBoard();
        if (!this.pathFinder.hasValidMove()) for (let i = 0; i < 10; i++) { this.board.shuffleBoard(); if (this.pathFinder.hasValidMove()) break; }
        this.audioManager.playShuffle();
        this.renderer.clearHint();
        this.selectedCell = null; this.renderer.setSelected(null);
        this.updateItemUI();
        const self = this; setTimeout(() => { self.isProcessing = false; }, 400);
      }

      showGreatJob() {
        const overlay = document.getElementById('greatJobOverlay');
        if (!overlay) return;
        overlay.classList.add('active');
        const self = this;
        setTimeout(() => { overlay.classList.remove('active'); }, 1000);
      }

      useAddTime() {
        if (!this.itemManager.use('addTime')) return;
        this.timer.addTime(this.itemManager.getTimeBonus());
        this.audioManager.playItem();
        this.updateItemUI();
        this.updateTimerDisplay(this.timer.getTimeLeft());
      }

      useEliminate() {
        const match = this.pathFinder.findAnyMatch();
        if (!match) return;
        if (!this.itemManager.use('eliminate')) return;
        this.updateItemUI();
        this.handleMatch(match.cell1, match.cell2, match);
      }

      updateGameUI() {
        document.getElementById('gameLevel').textContent = '第' + this.level + '关';
        document.getElementById('gameDifficulty').textContent = getDifficultyName(this.difficulty) + ' - ' + this.difficultyConfig.rows + 'x' + this.difficultyConfig.cols;
        document.getElementById('gameScore').textContent = '0';
        document.getElementById('gameCombo').textContent = '0';
        document.getElementById('gameTime').textContent = formatTime(this.difficultyConfig.timeLimit);
        document.getElementById('gameTime').classList.remove('warning');
        this.updateItemUI();
      }

      updateItemUI() {
        const items = ['hint', 'shuffle', 'addTime', 'eliminate'];
        items.forEach(type => {
          const btn = document.querySelector('.item-btn[data-item="' + type + '"]');
          if (!btn) return;
          const remaining = this.itemManager.getRemaining(type);
          const countEl = btn.querySelector('.item-count');
          if (countEl) countEl.textContent = remaining === Infinity ? '∞' : remaining;
          if (remaining === 0) btn.classList.add('disabled'); else btn.classList.remove('disabled');
        });
      }

      updateScoreDisplay() { document.getElementById('gameScore').textContent = this.scoreManager.getScore(); }
      updateComboDisplay() {
        const combo = this.scoreManager.getCombo();
        const comboEl = document.getElementById('gameCombo');
        comboEl.textContent = combo;
        if (combo >= 5) comboEl.classList.add('hot'); else comboEl.classList.remove('hot');
      }

      nextLevel() { if (this.level < TOTAL_LEVELS) { this.level++; this.startGame(this.level); } }
    }

    const game = new Game();
  </script>
</body>
</html>
