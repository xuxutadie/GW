<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玉桂狗连连看</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #E0F7FF 0%, #B8E8FF 50%, #87CEEB 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(135, 206, 235, 0.4);
            max-width: 800px;
            width: 100%;
        }

        .game-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .game-title {
            font-size: 2.5em;
            color: #5BA3D0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            margin-bottom: 15px;
        }

        .status-bar {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
            background: linear-gradient(135deg, #F0F9FF 0%, #D8F0FF 100%);
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1em;
            color: #4A90C2;
            font-weight: bold;
        }

        .status-icon {
            font-size: 1.5em;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 20px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, #87CEEB 0%, #5BA3D0 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(135, 206, 235, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #FFB6C1 0%, #FF91A4 100%);
            color: white;
        }

        .btn-secondary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 145, 164, 0.4);
        }

        .btn-warning {
            background: linear-gradient(135deg, #FFE699 0%, #FFD700 100%);
            color: #8B6914;
        }

        .btn-warning:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .game-board-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            overflow: visible;
        }

        .game-board {
            display: grid;
            gap: 8px;
            padding: 15px;
            background: linear-gradient(135deg, #F8FCFF 0%, #E8F4FF 100%);
            border-radius: 25px;
        }

        .cell {
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5em;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            user-select: none;
        }

        .cell:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 15px rgba(135, 206, 235, 0.3);
        }

        .cell.selected {
            background: linear-gradient(135deg, #87CEEB 0%, #5BA3D0 100%);
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(135, 206, 235, 0.6);
        }

        .cell.hint {
            background: linear-gradient(135deg, #FFE699 0%, #FFD700 100%);
            animation: hint-pulse 0.8s ease-in-out infinite;
        }

        @keyframes hint-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .cell.removing {
            animation: remove-animation 0.4s ease-out forwards;
        }

        @keyframes remove-animation {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.5; }
            100% { transform: scale(0); opacity: 0; }
        }

        .cell.empty {
            background: transparent;
            box-shadow: none;
            cursor: default;
        }

        .line-canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 10;
        }

        .difficulty-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            animation: modal-fade-in 0.3s ease;
        }

        @keyframes modal-fade-in {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-title {
            font-size: 2em;
            color: #5BA3D0;
            margin-bottom: 25px;
        }

        .modal-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .difficulty-btn {
            padding: 15px 30px;
            border: none;
            border-radius: 20px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .difficulty-btn.easy {
            background: linear-gradient(135deg, #98FB98 0%, #3CB371 100%);
            color: white;
        }

        .difficulty-btn.normal {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: white;
        }

        .difficulty-btn.hard {
            background: linear-gradient(135deg, #FFB6C1 0%, #FF6347 100%);
            color: white;
        }

        .difficulty-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .result-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .result-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            animation: modal-fade-in 0.3s ease;
        }

        .result-title {
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .result-title.victory {
            color: #3CB371;
        }

        .result-title.defeat {
            color: #FF6347;
        }

        .result-info {
            font-size: 1.2em;
            color: #4A90C2;
            margin-bottom: 25px;
            line-height: 1.8;
        }

        @media (max-width: 600px) {
            .game-container {
                padding: 20px;
            }

            .game-title {
                font-size: 1.8em;
            }

            .cell {
                width: 45px;
                height: 45px;
                font-size: 2em;
            }

            .status-bar {
                gap: 10px;
            }

            .status-item {
                font-size: 0.9em;
            }

            .btn {
                padding: 10px 18px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1 class="game-title">🐾 玉桂狗连连看 🐾</h1>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <span class="status-icon">⭐</span>
                <span>得分: <span id="score">0</span></span>
            </div>
            <div class="status-item">
                <span class="status-icon">⏱️</span>
                <span>时间: <span id="timer">300</span>秒</span>
            </div>
            <div class="status-item">
                <span class="status-icon">💡</span>
                <span>提示: <span id="hints">3</span>次</span>
            </div>
            <div class="status-item">
                <span class="status-icon">🔄</span>
                <span>重排: <span id="shuffles">2</span>次</span>
            </div>
        </div>

        <div class="button-group">
            <button class="btn btn-secondary" id="hintBtn">💡 提示</button>
            <button class="btn btn-warning" id="shuffleBtn">🔄 重排</button>
            <button class="btn btn-primary" id="restartBtn">🎮 重新开始</button>
            <button class="btn" style="background: #FFB6C1; color: white;" id="testEffectBtn">✨ 测试特效</button>
        </div>

        <div class="game-board-wrapper">
            <div class="game-board" id="gameBoard"></div>
            <canvas class="line-canvas" id="lineCanvas"></canvas>
        </div>
    </div>

    <div class="difficulty-modal" id="difficultyModal">
        <div class="modal-content">
            <h2 class="modal-title">🎮 选择难度 🎮</h2>
            <div class="modal-buttons">
                <button class="difficulty-btn easy" data-difficulty="easy">😊 简单 (6×6)</button>
                <button class="difficulty-btn normal" data-difficulty="normal">😐 普通 (8×6)</button>
                <button class="difficulty-btn hard" data-difficulty="hard">😈 困难 (10×8)</button>
            </div>
        </div>
    </div>

    <div class="result-modal" id="resultModal" style="display: none;">
        <div class="result-content">
            <h2 class="result-title" id="resultTitle"></h2>
            <div class="result-info" id="resultInfo"></div>
            <button class="btn btn-primary" id="playAgainBtn">🎮 再来一局</button>
        </div>
    </div>

    <script>
        // 自定义玉桂狗SVG - 真实的Cinnamoroll形象
        const CINNAMOROLL_SVG = `
        <svg viewBox="0 0 64 64" style="width: 45px; height: 45px;">
            <!-- 身体 - 圆滚滚的糯米团子 -->
            <ellipse cx="32" cy="48" rx="14" ry="10" fill="white" stroke="#E8E8E8" stroke-width="1"/>
            
            <!-- 大耳朵 - 向两侧平伸，用来飞行 -->
            <!-- 左耳 - 超大超长 -->
            <path d="M8 28 Q2 18 8 8 Q14 12 16 22 Q14 32 8 28" fill="white" stroke="#E8E8E8" stroke-width="1"/>
            <!-- 左耳内耳 -->
            <path d="M10 26 Q6 18 10 12 Q13 16 14 24" fill="#F0F8FF"/>
            
            <!-- 右耳 - 超大超长 -->
            <path d="M56 28 Q62 18 56 8 Q50 12 48 22 Q50 32 56 28" fill="white" stroke="#E8E8E8" stroke-width="1"/>
            <!-- 右耳内耳 -->
            <path d="M54 26 Q58 18 54 12 Q51 16 50 24" fill="#F0F8FF"/>
            
            <!-- 头部 - 圆滚滚 -->
            <ellipse cx="32" cy="30" rx="18" ry="16" fill="white" stroke="#E8E8E8" stroke-width="1"/>
            
            <!-- 眼睛 - 圆、大、清澈天蓝色，无瞳孔，无辜感 -->
            <ellipse cx="24" cy="28" rx="4.5" ry="5" fill="#87CEEB"/>
            <ellipse cx="40" cy="28" rx="4.5" ry="5" fill="#87CEEB"/>
            
            <!-- 眼睛高光，增加清澈感 -->
            <ellipse cx="23" cy="26" rx="1.5" ry="2" fill="white"/>
            <ellipse cx="39" cy="26" rx="1.5" ry="2" fill="white"/>
            
            <!-- 腮红 - 两团圆形淡粉色红晕 -->
            <circle cx="16" cy="34" r="3.5" fill="#FFB6C1" opacity="0.6"/>
            <circle cx="48" cy="34" r="3.5" fill="#FFB6C1" opacity="0.6"/>
            
            <!-- 嘴巴 - 细细的w形小嘴 -->
            <path d="M27 38 Q30 41 32 38 Q34 41 37 38" stroke="#60A5FA" stroke-width="1.2" fill="none"/>
            
            <!-- 尾巴 - 肉桂卷形状，白色带浅棕线条 -->
            <ellipse cx="48" cy="52" rx="6" ry="5" fill="white" stroke="#D2B48C" stroke-width="1.2"/>
            <ellipse cx="48" cy="52" rx="4" ry="3" fill="none" stroke="#D2B48C" stroke-width="0.8"/>
            <ellipse cx="48" cy="52" rx="2" ry="1.5" fill="none" stroke="#D2B48C" stroke-width="0.5"/>
        </svg>
        `;

        // 12种玉桂狗相关图案，第一个使用自定义SVG
        const ICONS = [
            'cinnamoroll', '🎀', '🍰', '⭐', '☁️', '❤️',
            '🌸', '🍬', '🎂', '🌟', '💎', '🎈'
        ];

        // 难度配置
        const DIFFICULTIES = {
            easy: { rows: 6, cols: 6, time: 300 },
            normal: { rows: 6, cols: 8, time: 300 },
            hard: { rows: 8, cols: 10, time: 300 }
        };

        // 游戏状态
        let gameState = {
            board: [],
            rows: 0,
            cols: 0,
            score: 0,
            timeLeft: 300,
            hints: 3,
            shuffles: 2,
            selectedCell: null,
            timerInterval: null,
            gameOver: false,
            startTime: null
        };

        // DOM元素
        const gameBoard = document.getElementById('gameBoard');
        const lineCanvas = document.getElementById('lineCanvas');
        const ctx = lineCanvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const timerDisplay = document.getElementById('timer');
        const hintsDisplay = document.getElementById('hints');
        const shufflesDisplay = document.getElementById('shuffles');
        const difficultyModal = document.getElementById('difficultyModal');
        const resultModal = document.getElementById('resultModal');
        const resultTitle = document.getElementById('resultTitle');
        const resultInfo = document.getElementById('resultInfo');

        // 初始化难度选择
        document.querySelectorAll('.difficulty-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const difficulty = btn.dataset.difficulty;
                startGame(difficulty);
            });
        });

        // 按钮事件
        document.getElementById('hintBtn').addEventListener('click', useHint);
        document.getElementById('shuffleBtn').addEventListener('click', useShuffle);
        document.getElementById('restartBtn').addEventListener('click', () => {
            resultModal.style.display = 'none';
            difficultyModal.style.display = 'flex';
        });
        document.getElementById('testEffectBtn').addEventListener('click', () => {
            console.log('点击了测试按钮！');
            showCinnamorollEffect();
        });
        document.getElementById('playAgainBtn').addEventListener('click', () => {
            resultModal.style.display = 'none';
            difficultyModal.style.display = 'flex';
        });

        // 开始游戏
        function startGame(difficulty) {
            const config = DIFFICULTIES[difficulty];
            gameState = {
                board: [],
                rows: config.rows,
                cols: config.cols,
                score: 0,
                timeLeft: config.time,
                hints: 3,
                shuffles: 2,
                selectedCell: null,
                timerInterval: null,
                gameOver: false,
                startTime: Date.now()
            };

            difficultyModal.style.display = 'none';
            resultModal.style.display = 'none';

            initBoard();
            renderBoard();
            updateDisplay();
            startTimer();
        }

        // 初始化棋盘
        function initBoard() {
            const totalCells = gameState.rows * gameState.cols;
            const pairCount = totalCells / 2;
            
            let icons = [];
            for (let i = 0; i < pairCount; i++) {
                const icon = ICONS[i % ICONS.length];
                icons.push(icon, icon);
            }

            shuffleArray(icons);

            gameState.board = [];
            for (let r = 0; r < gameState.rows; r++) {
                gameState.board[r] = [];
                for (let c = 0; c < gameState.cols; c++) {
                    gameState.board[r][c] = icons[r * gameState.cols + c];
                }
            }

            while (!hasValidMove()) {
                shuffleArray(icons);
                for (let r = 0; r < gameState.rows; r++) {
                    for (let c = 0; c < gameState.cols; c++) {
                        gameState.board[r][c] = icons[r * gameState.cols + c];
                    }
                }
            }
        }

        // 打乱数组
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // 渲染棋盘
        function renderBoard() {
            gameBoard.innerHTML = '';
            gameBoard.style.gridTemplateColumns = `repeat(${gameState.cols}, 1fr)`;

            for (let r = 0; r < gameState.rows; r++) {
                for (let c = 0; c < gameState.cols; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = r;
                    cell.dataset.col = c;

                    const icon = gameState.board[r][c];
                    if (icon) {
                        if (icon === 'cinnamoroll') {
                            cell.innerHTML = CINNAMOROLL_SVG;
                        } else {
                            cell.textContent = icon;
                        }
                        cell.addEventListener('click', () => handleCellClick(r, c));
                    } else {
                        cell.classList.add('empty');
                    }

                    gameBoard.appendChild(cell);
                }
            }

            resizeCanvas();
        }

        // 调整画布大小
        function resizeCanvas() {
            const wrapper = document.querySelector('.game-board-wrapper');
            const wrapperRect = wrapper.getBoundingClientRect();
            
            lineCanvas.width = wrapperRect.width;
            lineCanvas.height = wrapperRect.height;
            lineCanvas.style.width = wrapperRect.width + 'px';
            lineCanvas.style.height = wrapperRect.height + 'px';
            lineCanvas.style.position = 'absolute';
            lineCanvas.style.top = '0';
            lineCanvas.style.left = '0';
        }

        // 处理点击事件
        function handleCellClick(row, col) {
            if (gameState.gameOver) return;

            const icon = gameState.board[row][col];
            if (!icon) return;

            const cell = getCellElement(row, col);

            if (gameState.selectedCell) {
                const [selRow, selCol] = gameState.selectedCell;

                if (selRow === row && selCol === col) {
                    cell.classList.remove('selected');
                    gameState.selectedCell = null;
                    return;
                }

                const selIcon = gameState.board[selRow][selCol];

                if (selIcon === icon) {
                    const path = findPath(selRow, selCol, row, col);
                    if (path) {
                        drawLine(path);
                        // 立即显示玉桂狗特效
                        showCinnamorollEffect();

                        setTimeout(() => {
                            removeCells(selRow, selCol, row, col);
                        }, 500);
                    }
                }

                getCellElement(selRow, selCol).classList.remove('selected');
                gameState.selectedCell = null;
            } else {
                cell.classList.add('selected');
                gameState.selectedCell = [row, col];
            }
        }

        // 获取单元格元素
        function getCellElement(row, col) {
            return gameBoard.querySelector(`[data-row="${row}"][data-col="${col}"]`);
        }

        // 查找路径
        function findPath(r1, c1, r2, c2) {
            if (r1 === r2 && c1 === c2) return null;

            const dirs = [
                [0, 1], [1, 0], [0, -1], [-1, 0]
            ];

            const queue = [[r1, c1, -1, 0, [[r1, c1]]]];
            const visited = Array(gameState.rows + 2).fill(null).map(() => 
                Array(gameState.cols + 2).fill(false)
            );

            while (queue.length > 0) {
                const [r, c, dir, turns, path] = queue.shift();

                for (let i = 0; i < dirs.length; i++) {
                    const [dr, dc] = dirs[i];
                    let nr = r + dr;
                    let nc = c + dc;

                    while (nr >= -1 && nr <= gameState.rows && nc >= -1 && nc <= gameState.cols) {
                        if (nr === r2 && nc === c2) {
                            const newTurns = turns + (dir !== -1 && i !== dir ? 1 : 0);
                            if (newTurns <= 2) {
                                return [...path, [nr, nc]];
                            }
                        }

                        if (nr >= 0 && nr < gameState.rows && nc >= 0 && nc < gameState.cols) {
                            if (gameState.board[nr][nc]) {
                                break;
                            }
                        }

                        if (!visited[nr + 1][nc + 1]) {
                            visited[nr + 1][nc + 1] = true;
                            const newTurns = turns + (dir !== -1 && i !== dir ? 1 : 0);
                            if (newTurns <= 2) {
                                queue.push([nr, nc, i, newTurns, [...path, [nr, nc]]]);
                            }
                        }

                        nr += dr;
                        nc += dc;
                    }
                }
            }

            return null;
        }

        // 绘制连线
        function drawLine(path) {
            // 简单直接：把Canvas设为超大，定位到wrapper的左上角
            const canvasSize = 5000;
            lineCanvas.style.width = canvasSize + 'px';
            lineCanvas.style.height = canvasSize + 'px';
            lineCanvas.width = canvasSize;
            lineCanvas.height = canvasSize;
            lineCanvas.style.left = '0px';
            lineCanvas.style.top = '0px';
            lineCanvas.style.position = 'absolute';
            lineCanvas.style.pointerEvents = 'none';
            lineCanvas.style.zIndex = '100';
            
            // 清除画布
            ctx.clearRect(0, 0, lineCanvas.width, lineCanvas.height);

            // 设置蓝色线条
            ctx.strokeStyle = '#5BA3D0';
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowColor = '#5BA3D0';
            ctx.shadowBlur = 10;

            // 计算相对wrapper的坐标
            const wrapperRect = document.querySelector('.game-board-wrapper').getBoundingClientRect();
            const boardRect = gameBoard.getBoundingClientRect();
            
            // 游戏板相对于wrapper的位置
            const offsetX = boardRect.left - wrapperRect.left + 15; // 15是padding
            const offsetY = boardRect.top - wrapperRect.top + 15;
            
            const cellSize = 60;
            const gap = 8;
            const totalSize = cellSize + gap;

            ctx.beginPath();
            path.forEach(([r, c], index) => {
                const x = offsetX + c * totalSize + cellSize / 2;
                const y = offsetY + r * totalSize + cellSize / 2;

                if (index === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            });
            ctx.stroke();
        }

        // 消除单元格
        function removeCells(r1, c1, r2, c2) {
            const cell1 = getCellElement(r1, c1);
            const cell2 = getCellElement(r2, c2);

            cell1.classList.add('removing');
            cell2.classList.add('removing');

            gameState.board[r1][c1] = null;
            gameState.board[r2][c2] = null;

            gameState.score += 10;
            updateDisplay();

            // 显示玉桂狗特效 - 在连线显示后立即显示
            setTimeout(() => {
                showCinnamorollEffect();
            }, 100);

            setTimeout(() => {
                // 清除连线
                ctx.clearRect(0, 0, lineCanvas.width, lineCanvas.height);
                
                cell1.classList.add('empty');
                cell1.innerHTML = '';
                cell2.classList.add('empty');
                cell2.innerHTML = '';

                checkGameStatus();
            }, 1000);
        }

        // 显示玉桂狗特效 - 晶莹剔透粉色气泡飘散 + 柔和滑音
        function showCinnamorollEffect() {
            console.log('显示晶莹剔透粉色气泡特效+柔和滑音！');
            
            // ==================== 1. 播放柔和滑音 + 爆破消散音 ====================
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) {
                    const audioCtx = new AudioCtx();
                    const now = audioCtx.currentTime;
                    
                    // ---- 第一部分：柔和滑音 ----
                    // 第一声：柔和向上滑音
                    const osc1 = audioCtx.createOscillator();
                    const gain1 = audioCtx.createGain();
                    
                    osc1.type = 'sine';
                    osc1.frequency.setValueAtTime(440, now); // A4音
                    osc1.frequency.exponentialRampToValueAtTime(880, now + 0.12); // 滑到A5
                    osc1.frequency.exponentialRampToValueAtTime(660, now + 0.3); // 再滑到E5
                    
                    // 音量包络 - 淡入淡出，非常柔和
                    gain1.gain.setValueAtTime(0, now);
                    gain1.gain.linearRampToValueAtTime(0.10, now + 0.04);
                    gain1.gain.linearRampToValueAtTime(0.06, now + 0.2);
                    gain1.gain.linearRampToValueAtTime(0.03, now + 0.4);
                    gain1.gain.linearRampToValueAtTime(0, now + 0.6);
                    
                    osc1.connect(gain1).connect(audioCtx.destination);
                    osc1.start(now);
                    osc1.stop(now + 0.6);
                    
                    // ---- 第二部分：轻快爆破消散音 - "啵啵啵啵啵" ----
                    // 5个连续的气泡爆破音，每个都比前一个略高、略短
                    const popCount = 5;
                    for (let i = 0; i < popCount; i++) {
                        const popOsc = audioCtx.createOscillator();
                        const popGain = audioCtx.createGain();
                        
                        // 每个爆破音从高频快速下降 - 像气泡"啵"的一声
                        const startTime = now + 0.08 + i * 0.09; // 每个间隔0.09秒，很快很轻快
                        const baseFreq = 1500 + i * 150; // 从1500Hz开始，每个升高150Hz
                        const endFreq = 600 + i * 100;   // 降到600附近
                        
                        // 前几个用正弦波更柔和，后几个用三角波更有爆破感
                        popOsc.type = i < 3 ? 'sine' : 'triangle';
                        
                        // 频率：快速从高频下滑 - 模拟"啵"的爆破感
                        popOsc.frequency.setValueAtTime(baseFreq, startTime);
                        popOsc.frequency.exponentialRampToValueAtTime(endFreq, startTime + 0.08);
                        
                        // 音量：快速冲击然后立即消失 - 像气泡爆破
                        popGain.gain.setValueAtTime(0, startTime);
                        popGain.gain.linearRampToValueAtTime(0.12 - i * 0.015, startTime + 0.01); // 快速冲到顶
                        popGain.gain.linearRampToValueAtTime(0.06 - i * 0.008, startTime + 0.03); // 微微保留
                        popGain.gain.linearRampToValueAtTime(0, startTime + 0.12); // 快速消失
                        
                        popOsc.connect(popGain).connect(audioCtx.destination);
                        popOsc.start(startTime);
                        popOsc.stop(startTime + 0.15);
                    }
                    
                    // ---- 第三部分：尾声 - 一个轻微的收尾音 ----
                    const tailOsc = audioCtx.createOscillator();
                    const tailGain = audioCtx.createGain();
                    
                    tailOsc.type = 'sine';
                    tailOsc.frequency.setValueAtTime(1000, now + 0.55);
                    tailOsc.frequency.exponentialRampToValueAtTime(2000, now + 0.7);
                    
                    tailGain.gain.setValueAtTime(0, now + 0.55);
                    tailGain.gain.linearRampToValueAtTime(0.05, now + 0.6);
                    tailGain.gain.linearRampToValueAtTime(0, now + 0.85);
                    
                    tailOsc.connect(tailGain).connect(audioCtx.destination);
                    tailOsc.start(now + 0.55);
                    tailOsc.stop(now + 0.85);
                    
                    // 完成后关闭音频上下文
                    setTimeout(() => {
                        try { audioCtx.close(); } catch(e) {}
                    }, 1100);
                }
            } catch (err) {
                console.log('音效播放失败:', err);
            }
            
            // ==================== 2. 显示粉色气泡动画 ====================
            // 创建特效容器
            const effectContainer = document.createElement('div');
            effectContainer.id = 'cinnamoroll-effect';
            effectContainer.style.cssText = `
                position: fixed !important;
                top: 0 !important;
                left: 0 !important;
                width: 100% !important;
                height: 100% !important;
                z-index: 99999 !important;
                pointer-events: none !important;
                overflow: hidden !important;
            `;
            
            // 生成20个晶莹剔透的粉色气泡
            const bubbleCount = 20;
            
            for (let i = 0; i < bubbleCount; i++) {
                const bubble = document.createElement('div');
                const size = 25 + Math.random() * 45; // 25-70px
                const leftPos = Math.random() * 100; // 0-100%
                const delay = Math.random() * 0.3; // 0-0.3秒延迟
                const speed = 0.9 + Math.random() * 0.3; // 略微不同的上升速度
                
                bubble.style.cssText = `
                    position: absolute;
                    bottom: -${size}px;
                    left: ${leftPos}%;
                    width: ${size}px;
                    height: ${size}px;
                    border-radius: 50%;
                    /* 晶莹剔透的粉色气泡 - 多层渐变 */
                    background: 
                        radial-gradient(circle at 30% 25%, 
                            rgba(255, 255, 255, 0.95) 0%, 
                            rgba(255, 200, 220, 0.7) 10%, 
                            rgba(255, 150, 180, 0.55) 25%, 
                            rgba(255, 182, 193, 0.4) 45%, 
                            rgba(255, 182, 193, 0.2) 70%, 
                            rgba(255, 182, 193, 0.1) 100%
                        );
                    /* 粉色发光光晕 */
                    box-shadow: 
                        0 0 20px rgba(255, 182, 193, 0.6),
                        0 0 40px rgba(255, 182, 193, 0.3),
                        0 0 60px rgba(255, 105, 180, 0.2),
                        /* 内部高光反射 */
                        inset 0 0 30px rgba(255, 255, 255, 0.5),
                        inset 3px -8px 20px rgba(255, 105, 180, 0.2),
                        inset -5px 5px 15px rgba(255, 255, 255, 0.4);
                    /* 高光点 - 模拟反光 */
                    animation: bubble-rise-${i} ${speed}s ease-out ${delay}s forwards;
                    opacity: 0;
                `;
                
                // 添加高光点 - 让气泡更真实
                const highlight1 = document.createElement('div');
                highlight1.style.cssText = `
                    position: absolute;
                    top: 12%;
                    left: 18%;
                    width: 25%;
                    height: 20%;
                    background: radial-gradient(ellipse, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0) 70%);
                    border-radius: 50%;
                    transform: rotate(-30deg);
                `;
                
                const highlight2 = document.createElement('div');
                highlight2.style.cssText = `
                    position: absolute;
                    top: 25%;
                    right: 25%;
                    width: 10%;
                    height: 10%;
                    background: radial-gradient(circle, rgba(255, 255, 255, 0.8) 0%, rgba(255, 255, 255, 0) 100%);
                    border-radius: 50%;
                `;
                
                bubble.appendChild(highlight1);
                bubble.appendChild(highlight2);
                effectContainer.appendChild(bubble);
            }
            
            document.body.appendChild(effectContainer);
            
            // 添加气泡动画样式
            let styleTag = document.getElementById('bubble-animation-style');
            if (!styleTag) {
                styleTag = document.createElement('style');
                styleTag.id = 'bubble-animation-style';
            }
            
            // 为每个气泡生成略有不同的动画，模拟自然飘动
            let keyframes = '';
            for (let i = 0; i < bubbleCount; i++) {
                const drift1 = (Math.random() * 40 - 20).toFixed(1);
                const drift2 = (Math.random() * 60 - 30).toFixed(1);
                const drift3 = (Math.random() * 80 - 40).toFixed(1);
                const scale1 = (0.95 + Math.random() * 0.1).toFixed(2);
                const scale2 = (1.0 + Math.random() * 0.1).toFixed(2);
                const scale3 = (0.3 + Math.random() * 0.1).toFixed(2);
                
                keyframes += `
                    @keyframes bubble-rise-${i} {
                        0% {
                            transform: translateY(0) translateX(0) scale(0.4);
                            opacity: 0;
                        }
                        15% {
                            opacity: 1;
                            transform: translateY(-15vh) translateX(${drift1}px) scale(${scale1});
                        }
                        50% {
                            opacity: 0.95;
                            transform: translateY(-45vh) translateX(${drift2}px) scale(${scale2});
                        }
                        100% {
                            transform: translateY(-115vh) translateX(${drift3}px) scale(${scale3});
                            opacity: 0;
                        }
                    }
                `;
            }
            
            styleTag.textContent = keyframes;
            document.head.appendChild(styleTag);
            
            console.log('晶莹剔透粉色气泡特效+柔和滑音已添加到DOM');
            
            // 1.3秒后移除特效容器
            setTimeout(() => {
                const el = document.getElementById('cinnamoroll-effect');
                if (el) el.remove();
                console.log('粉色气泡特效已移除');
            }, 1300);
        }

        // 检查游戏状态
        function checkGameStatus() {
            let allEmpty = true;
            for (let r = 0; r < gameState.rows; r++) {
                for (let c = 0; c < gameState.cols; c++) {
                    if (gameState.board[r][c]) {
                        allEmpty = false;
                        break;
                    }
                }
            }

            if (allEmpty) {
                endGame(true);
                return;
            }

            if (!hasValidMove()) {
                shuffleBoard();
            }
        }

        // 检查是否有有效移动
        function hasValidMove() {
            for (let r1 = 0; r1 < gameState.rows; r1++) {
                for (let c1 = 0; c1 < gameState.cols; c1++) {
                    const icon1 = gameState.board[r1][c1];
                    if (!icon1) continue;

                    for (let r2 = 0; r2 < gameState.rows; r2++) {
                        for (let c2 = 0; c2 < gameState.cols; c2++) {
                            if (r1 === r2 && c1 === c2) continue;
                            const icon2 = gameState.board[r2][c2];
                            if (icon1 === icon2 && findPath(r1, c1, r2, c2)) {
                                return true;
                            }
                        }
                    }
                }
            }
            return false;
        }

        // 查找可配对的提示
        function findHint() {
            for (let r1 = 0; r1 < gameState.rows; r1++) {
                for (let c1 = 0; c1 < gameState.cols; c1++) {
                    const icon1 = gameState.board[r1][c1];
                    if (!icon1) continue;

                    for (let r2 = 0; r2 < gameState.rows; r2++) {
                        for (let c2 = 0; c2 < gameState.cols; c2++) {
                            if (r1 === r2 && c1 === c2) continue;
                            const icon2 = gameState.board[r2][c2];
                            if (icon1 === icon2 && findPath(r1, c1, r2, c2)) {
                                return [[r1, c1], [r2, c2]];
                            }
                        }
                    }
                }
            }
            return null;
        }

        // 使用提示
        function useHint() {
            if (gameState.gameOver || gameState.hints <= 0) return;

            const hint = findHint();
            if (hint) {
                gameState.hints--;
                updateDisplay();

                const [[r1, c1], [r2, c2]] = hint;
                const cell1 = getCellElement(r1, c1);
                const cell2 = getCellElement(r2, c2);

                cell1.classList.add('hint');
                cell2.classList.add('hint');

                setTimeout(() => {
                    cell1.classList.remove('hint');
                    cell2.classList.remove('hint');
                }, 1500);
            }
        }

        // 使用重排
        function useShuffle() {
            if (gameState.gameOver || gameState.shuffles <= 0) return;

            gameState.shuffles--;
            updateDisplay();
            shuffleBoard();
        }

        // 重排棋盘
        function shuffleBoard() {
            let icons = [];
            for (let r = 0; r < gameState.rows; r++) {
                for (let c = 0; c < gameState.cols; c++) {
                    if (gameState.board[r][c]) {
                        icons.push(gameState.board[r][c]);
                    }
                }
            }

            shuffleArray(icons);

            let idx = 0;
            for (let r = 0; r < gameState.rows; r++) {
                for (let c = 0; c < gameState.cols; c++) {
                    if (gameState.board[r][c]) {
                        gameState.board[r][c] = icons[idx++];
                    }
                }
            }

            while (!hasValidMove()) {
                shuffleArray(icons);
                idx = 0;
                for (let r = 0; r < gameState.rows; r++) {
                    for (let c = 0; c < gameState.cols; c++) {
                        if (gameState.board[r][c]) {
                            gameState.board[r][c] = icons[idx++];
                        }
                    }
                }
            }

            renderBoard();
        }

        // 更新显示
        function updateDisplay() {
            scoreDisplay.textContent = gameState.score;
            timerDisplay.textContent = gameState.timeLeft;
            hintsDisplay.textContent = gameState.hints;
            shufflesDisplay.textContent = gameState.shuffles;

            document.getElementById('hintBtn').disabled = gameState.hints <= 0;
            document.getElementById('shuffleBtn').disabled = gameState.shuffles <= 0;
        }

        // 开始计时器
        function startTimer() {
            if (gameState.timerInterval) {
                clearInterval(gameState.timerInterval);
            }

            gameState.timerInterval = setInterval(() => {
                gameState.timeLeft--;
                updateDisplay();

                if (gameState.timeLeft <= 0) {
                    endGame(false);
                }
            }, 1000);
        }

        // 结束游戏
        function endGame(victory) {
            gameState.gameOver = true;
            clearInterval(gameState.timerInterval);

            const timeUsed = Math.floor((Date.now() - gameState.startTime) / 1000);

            resultTitle.className = 'result-title ' + (victory ? 'victory' : 'defeat');
            resultTitle.textContent = victory ? '🎉 恭喜通关！ 🎉' : '😢 时间到！';

            if (victory) {
                resultInfo.innerHTML = `
                    最终得分：${gameState.score} 分<br>
                    用时：${timeUsed} 秒
                `;
            } else {
                resultInfo.textContent = '很遗憾，时间用完了！';
            }

            resultModal.style.display = 'flex';
        }

        // 窗口大小变化时调整画布
        window.addEventListener('resize', resizeCanvas);
    </script>
</body>
</html>
