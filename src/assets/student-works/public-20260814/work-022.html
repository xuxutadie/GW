<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>地球病历本 · 行星医院 Planet Hospital</title>
  <meta name="description" content="把地球当作一位患者：挂号 → 问诊 → 检查 → 诊断 → 处方 → 手术，自然灾害科普互动网站。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='%231E88E5'/%3E%3Cpath d='M22 46q10-6 18 0t16 0t16 0' stroke='%2300E5A0' stroke-width='3' fill='none'/%3E%3Ccircle cx='40' cy='42' r='3' fill='%230A1929'/%3E%3Ccircle cx='60' cy='42' r='3' fill='%230A1929'/%3E%3Cpath d='M40 60q10 6 20 0' stroke='%230A1929' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
  <style>
    /* ============================================================
       tokens.css · 设计变量
       ============================================================ */
    :root {
      --bg: #F5F7FA;
      --bg-soft: #ECEFF5;
      --bg-paper: #FAF8F1;
      --bg-deep: #0A1929;
      --bg-deep-2: #0F2440;
      --bg-deep-3: #122E54;
      --ink: #0F172A;
      --ink-2: #1E293B;
      --ink-mute: #475569;
      --ink-soft: #64748B;
      --ink-on-deep: #E2E8F0;
      --ink-on-deep-mute: #94A3B8;
      --line: #E2E8F0;
      --line-strong: #CBD5E1;
      --primary: #1E88E5;
      --primary-700: #1565C0;
      --primary-300: #60A5FA;
      --primary-100: #DBEAFE;
      --accent: #00D9FF;
      --accent-soft: #67E8F9;
      --success: #00E5A0;
      --success-soft: #6EE7B7;
      --amber: #FFB300;
      --warning: #FF5722;
      --warning-soft: #FFAB91;
      --danger: #DC2626;
      --danger-soft: #FCA5A5;
      --c-volcano: #FF5722;
      --c-earthquake: #FFB300;
      --c-typhoon: #1E88E5;
      --c-flood: #00B8D4;
      --c-heat: #DC2626;
      --font-display: "Noto Serif SC", "Songti SC", "STSong", serif;
      --font-body: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
      --fs-12: 12px; --fs-13: 13px; --fs-14: 14px; --fs-15: 15px;
      --fs-16: 16px; --fs-18: 18px; --fs-20: 20px; --fs-24: 24px;
      --fs-28: 28px; --fs-32: 32px; --fs-40: 40px; --fs-48: 48px; --fs-64: 64px;
      --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px;
      --sp-6: 24px; --sp-7: 32px; --sp-8: 40px; --sp-9: 48px; --sp-10: 64px; --sp-11: 80px;
      --r-1: 4px; --r-2: 8px; --r-3: 12px; --r-4: 16px; --r-5: 20px; --r-6: 28px;
      --r-pill: 999px;
      --sh-1: 0 1px 2px rgba(15,23,42,.06);
      --sh-2: 0 2px 8px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
      --sh-3: 0 8px 24px rgba(15,23,42,.08), 0 2px 6px rgba(15,23,42,.04);
      --sh-4: 0 16px 48px rgba(15,23,42,.12), 0 4px 12px rgba(15,23,42,.06);
      --sh-glow: 0 0 0 1px rgba(0,217,255,.4), 0 0 24px rgba(0,217,255,.18);
      --sh-glow-warn: 0 0 0 1px rgba(255,87,34,.45), 0 0 24px rgba(255,87,34,.18);
      --container: 1200px;
      --gutter: 24px;
      --ease: cubic-bezier(.2, .7, .2, 1);
      --t-fast: 160ms;
      --t-mid: 320ms;
      --t-slow: 600ms;
      --z-header: 50;
      --z-overlay: 100;
      --z-toast: 200;
    }

    /* ============================================================
       base.css · 基础排版
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body {
      font-family: var(--font-body);
      font-size: var(--fs-15);
      line-height: 1.6;
      color: var(--ink);
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image:
        radial-gradient(circle at 1px 1px, rgba(15,23,42,.045) 1px, transparent 0),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-soft) 100%);
      background-size: 24px 24px, 100% 100%;
      background-attachment: fixed;
    }
    main { flex: 1 0 auto; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    a { color: inherit; text-decoration: none; }
    img, svg { display: block; max-width: 100%; }
    ::selection { background: var(--primary); color: #fff; }
    h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 700; color: var(--ink); line-height: 1.25; margin: 0; }
    h1 { font-size: var(--fs-40); letter-spacing: -0.01em; }
    h2 { font-size: var(--fs-28); letter-spacing: -0.01em; }
    h3 { font-size: var(--fs-20); }
    h4 { font-size: var(--fs-18); }
    p { margin: 0; }

    /* —— 顶部栏 —— */
    .topbar {
      position: sticky; top: 0; z-index: var(--z-header);
      display: flex; justify-content: space-between; align-items: center;
      gap: var(--sp-4);
      padding: var(--sp-3) var(--gutter);
      background: rgba(245, 247, 250, .85);
      backdrop-filter: saturate(140%) blur(10px);
      -webkit-backdrop-filter: saturate(140%) blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: var(--sp-3); color: var(--primary-700); }
    .brand__mark {
      width: 36px; height: 36px;
      display: grid; place-items: center;
      border-radius: 10px;
      background: var(--primary-100);
      color: var(--primary-700);
      box-shadow: inset 0 0 0 1px rgba(30,136,229,.18);
    }
    .brand__text { display: flex; flex-direction: column; line-height: 1.1; }
    .brand__text strong { font-family: var(--font-display); font-size: var(--fs-16); color: var(--ink); }
    .brand__text em { font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); font-style: normal; letter-spacing: .04em; }
    .topbar__right { display: flex; align-items: center; gap: var(--sp-3); }
    .ecg-strip { width: 160px; height: 28px; opacity: .55; }
    .ecg-strip svg { width: 100%; height: 100%; stroke: var(--primary); stroke-width: 1.4; fill: none; }
    .status-pill {
      font-family: var(--font-mono);
      font-size: var(--fs-12);
      letter-spacing: .04em;
      padding: 6px 12px;
      border: 1px solid var(--line-strong);
      border-radius: var(--r-pill);
      color: var(--ink-2);
      background: #fff;
    }
    .status-pill--link { background: var(--ink); color: #fff; border-color: var(--ink); transition: transform var(--t-fast) var(--ease); }
    .status-pill--link:hover { transform: translateY(-1px); }

    .view {
      max-width: var(--container);
      margin: 0 auto;
      padding: var(--sp-7) var(--gutter) var(--sp-10);
      animation: viewIn var(--t-mid) var(--ease) both;
    }
    .view--no-pad { padding-top: 0; }

    .footer {
      border-top: 1px solid var(--line);
      background: #fff;
    }
    .footer__inner {
      max-width: var(--container);
      margin: 0 auto;
      padding: var(--sp-5) var(--gutter);
      display: flex; justify-content: space-between; gap: var(--sp-4);
      font-size: var(--fs-12); color: var(--ink-soft);
    }
    .footer__ids { font-family: var(--font-mono); letter-spacing: .04em; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--primary-700);
    }
    .muted { color: var(--ink-soft); }
    .mono { font-family: var(--font-mono); }

    /* ============================================================
       components.css · 组件样式
       ============================================================ */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 22px;
      border-radius: var(--r-pill);
      font-weight: 500;
      font-size: var(--fs-15);
      border: 1px solid transparent;
      transition: transform var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
      white-space: nowrap;
    }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .btn:active { transform: translateY(1px); }
    .btn--primary { background: var(--primary); color: #fff; box-shadow: 0 6px 18px rgba(30,136,229,.32); }
    .btn--primary:hover { background: var(--primary-700); transform: translateY(-1px); }
    .btn--ghost { background: #fff; color: var(--ink-2); border-color: var(--line-strong); }
    .btn--ghost:hover { background: var(--bg-soft); transform: translateY(-1px); }
    .btn--danger { background: var(--warning); color: #fff; box-shadow: 0 6px 18px rgba(255,87,34,.32); }
    .btn--danger:hover { background: #E64A19; transform: translateY(-1px); }
    .btn--success { background: var(--success); color: var(--bg-deep); box-shadow: 0 6px 18px rgba(0,229,160,.32); }
    .btn--success:hover { transform: translateY(-1px); }
    .btn--sm { padding: 8px 14px; font-size: var(--fs-13); }
    .btn--lg { padding: 16px 28px; font-size: var(--fs-16); }
    .btn--block { width: 100%; }

    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--r-4);
      box-shadow: var(--sh-2);
      padding: var(--sp-6);
    }
    .card--deep {
      background: linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-deep-2) 100%);
      color: var(--ink-on-deep);
      border-color: rgba(0,217,255,.18);
      box-shadow: var(--sh-glow);
    }
    .card--deep h1, .card--deep h2, .card--deep h3 { color: #fff; }
    .card--paper {
      background:
        repeating-linear-gradient(0deg, transparent 0 27px, rgba(15,23,42,.04) 27px 28px),
        var(--bg-paper);
      color: var(--ink);
      border: 1px solid #E8DFC8;
      box-shadow: var(--sh-2);
    }

    .section { margin: var(--sp-9) 0; }
    .section__head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-4); margin-bottom: var(--sp-5); }
    .section__head h2 { display: flex; align-items: center; gap: 10px; }
    .section__head h2::before {
      content: ""; width: 6px; height: 22px; background: var(--primary); border-radius: 3px;
      box-shadow: 0 0 12px rgba(30,136,229,.45);
    }
    .section__head .meta { font-family: var(--font-mono); font-size: var(--fs-12); color: var(--ink-soft); letter-spacing: .04em; }

    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: var(--font-mono);
      font-size: 11px; letter-spacing: .08em;
      padding: 4px 10px;
      border-radius: var(--r-pill);
      border: 1px solid var(--line-strong);
      background: #fff;
      color: var(--ink-2);
      text-transform: uppercase;
    }
    .chip--warn { color: var(--warning); border-color: rgba(255,87,34,.4); background: rgba(255,87,34,.08); }
    .chip--danger { color: var(--danger); border-color: rgba(220,38,38,.4); background: rgba(220,38,38,.08); }
    .chip--success { color: #047857; border-color: rgba(0,229,160,.5); background: rgba(0,229,160,.12); }
    .chip--info { color: var(--primary-700); border-color: rgba(30,136,229,.4); background: rgba(30,136,229,.08); }

    .steps {
      display: flex; gap: var(--sp-2);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--r-pill);
      padding: 6px;
      box-shadow: var(--sh-1);
      width: fit-content;
      margin: 0 auto;
    }
    .steps__item {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 16px;
      border-radius: var(--r-pill);
      font-size: var(--fs-13);
      color: var(--ink-soft);
      cursor: pointer;
      transition: all var(--t-fast) var(--ease);
    }
    .steps__item .num {
      font-family: var(--font-mono); font-size: 11px;
      width: 22px; height: 22px; display: grid; place-items: center;
      border-radius: 50%; background: var(--bg-soft); color: var(--ink-mute);
    }
    .steps__item:hover { background: var(--bg-soft); color: var(--ink); }
    .steps__item.is-active { background: var(--ink); color: #fff; }
    .steps__item.is-active .num { background: var(--accent); color: var(--bg-deep); }
    .steps__item.is-done .num { background: var(--success); color: var(--bg-deep); }
    .steps__item.is-done .num::before { content: "✓"; }

    .cursor::after {
      content: "▍"; display: inline-block; margin-left: 2px;
      color: var(--accent); animation: blink 1s steps(2, start) infinite;
    }

    .stamp {
      display: inline-block;
      padding: 8px 18px;
      border: 2px solid var(--warning);
      color: var(--warning);
      font-family: var(--font-display);
      font-weight: 700;
      letter-spacing: .25em;
      border-radius: 6px;
      transform: rotate(-8deg);
      opacity: .9;
      text-transform: uppercase;
      font-size: var(--fs-13);
      position: relative;
      background: rgba(255,87,34,.04);
      box-shadow: inset 0 0 0 4px transparent, inset 0 0 0 5px rgba(255,87,34,.12);
    }
    .stamp--success { color: var(--success); border-color: var(--success); background: rgba(0,229,160,.06); box-shadow: inset 0 0 0 4px transparent, inset 0 0 0 5px rgba(0,229,160,.12); }
    .stamp--primary { color: var(--primary); border-color: var(--primary); background: rgba(30,136,229,.06); box-shadow: inset 0 0 0 4px transparent, inset 0 0 0 5px rgba(30,136,229,.12); }

    .rx-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-4); }
    .rx {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--r-4);
      padding: 0;
      overflow: hidden;
      transition: transform var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
    }
    .rx:hover { transform: translateY(-2px); box-shadow: var(--sh-3); }
    .rx__head {
      display: flex; align-items: center; gap: 12px;
      padding: var(--sp-4) var(--sp-5);
      background: linear-gradient(180deg, var(--bg-paper) 0%, #fff 100%);
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      user-select: none;
    }
    .rx__icon {
      width: 40px; height: 40px; border-radius: 50%;
      display: grid; place-items: center;
      background: var(--primary-100); color: var(--primary-700);
      font-size: 20px;
    }
    .rx__title { flex: 1; }
    .rx__title h4 { font-family: var(--font-display); }
    .rx__title em { font-style: normal; font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); letter-spacing: .08em; }
    .rx__caret { color: var(--ink-soft); transition: transform var(--t-fast) var(--ease); }
    .rx.is-open .rx__caret { transform: rotate(180deg); }
    .rx__body { max-height: 0; overflow: hidden; transition: max-height var(--t-mid) var(--ease); padding: 0 var(--sp-5); }
    .rx.is-open .rx__body { max-height: 600px; padding: var(--sp-4) var(--sp-5) var(--sp-5); }
    .rx__body ul { margin: 0; padding: 0; list-style: none; }
    .rx__body li {
      position: relative; padding: 8px 0 8px 22px;
      font-size: var(--fs-14); color: var(--ink-2);
      border-top: 1px dashed var(--line);
    }
    .rx__body li:first-child { border-top: none; }
    .rx__body li::before {
      content: "℞"; position: absolute; left: 0; top: 8px;
      color: var(--primary); font-weight: 700;
    }

    .timeline { position: relative; padding: 8px 0 8px 32px; }
    .timeline::before {
      content: ""; position: absolute; left: 12px; top: 0; bottom: 0;
      width: 2px; background: linear-gradient(180deg, var(--primary) 0%, var(--accent) 100%);
      border-radius: 2px;
    }
    .timeline__item { position: relative; padding-bottom: var(--sp-6); }
    .timeline__item::before {
      content: ""; position: absolute; left: -27px; top: 6px;
      width: 14px; height: 14px; border-radius: 50%;
      background: #fff; border: 3px solid var(--primary);
      box-shadow: 0 0 0 4px rgba(30,136,229,.12);
    }
    .timeline__year {
      font-family: var(--font-mono); font-size: var(--fs-13);
      color: var(--primary-700); letter-spacing: .04em; font-weight: 700;
    }
    .timeline__title { font-family: var(--font-display); font-size: var(--fs-18); margin: 2px 0 6px; }
    .timeline__meta { font-size: var(--fs-13); color: var(--ink-soft); margin-bottom: 8px; }
    .timeline__data {
      display: inline-flex; flex-wrap: wrap; gap: 8px;
      font-family: var(--font-mono); font-size: var(--fs-12);
      margin-bottom: 6px;
    }
    .timeline__data span {
      background: var(--primary-100); color: var(--primary-700);
      padding: 4px 8px; border-radius: var(--r-2);
    }
    .timeline__lesson { color: var(--ink-2); font-size: var(--fs-14); }

    .medal-overlay {
      position: fixed; inset: 0; z-index: var(--z-overlay);
      display: none; align-items: center; justify-content: center;
    }
    .medal-overlay.is-open { display: flex; }
    .medal-overlay__backdrop {
      position: absolute; inset: 0;
      background: rgba(10,25,41,.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      animation: fadeIn var(--t-mid) var(--ease);
    }
    .medal-overlay__panel {
      position: relative;
      background: linear-gradient(180deg, #fff 0%, var(--bg-paper) 100%);
      border: 1px solid rgba(0,217,255,.4);
      border-radius: var(--r-5);
      padding: var(--sp-9) var(--sp-8);
      text-align: center;
      width: min(420px, calc(100% - 32px));
      box-shadow: 0 30px 80px rgba(10,25,41,.4), 0 0 0 1px rgba(0,217,255,.2);
      animation: panelIn var(--t-slow) var(--ease) both;
    }
    .medal {
      position: relative;
      width: 120px; height: 120px;
      margin: 0 auto var(--sp-5);
      animation: medalSpin 900ms var(--ease) both;
    }
    .medal__ring {
      position: absolute; inset: 0; border-radius: 50%;
      background: conic-gradient(from 0deg, var(--accent) 0deg, var(--primary) 90deg, var(--accent) 180deg, var(--primary) 270deg, var(--accent) 360deg);
      box-shadow: 0 0 24px rgba(0,217,255,.55);
      animation: spin 4s linear infinite;
    }
    .medal__core {
      position: absolute; inset: 12px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #1E88E5 0%, #0A1929 80%);
      color: #fff; display: grid; place-items: center;
      font-size: 40px;
      box-shadow: inset 0 0 0 4px rgba(0,217,255,.35), inset 0 -8px 16px rgba(0,0,0,.4);
    }
    .medal__shine {
      position: absolute; inset: 18px; border-radius: 50%;
      background: linear-gradient(135deg, rgba(255,255,255,.5) 0%, transparent 40%);
      pointer-events: none;
    }
    .medal__title { font-family: var(--font-display); font-size: var(--fs-24); margin-bottom: 8px; }
    .medal__desc { color: var(--ink-soft); margin-bottom: var(--sp-5); }

    .certificate-host {
      position: fixed; left: -10000px; top: 0;
      width: 1120px; height: 794px;
      pointer-events: none;
    }
    .cert {
      position: relative;
      width: 1120px; height: 794px;
      background:
        radial-gradient(circle at 20% 20%, rgba(0,217,255,.08) 0, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(30,136,229,.08) 0, transparent 40%),
        linear-gradient(180deg, #fff 0%, #FAFBFD 100%);
      border: 6px double var(--primary);
      border-radius: 8px;
      padding: 56px 64px;
      color: var(--ink);
      font-family: var(--font-body);
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(10,25,41,.18);
    }
    .cert__corner { position: absolute; width: 80px; height: 80px; border: 2px solid var(--accent); }
    .cert__corner--tl { top: 18px; left: 18px; border-right: 0; border-bottom: 0; }
    .cert__corner--tr { top: 18px; right: 18px; border-left: 0; border-bottom: 0; }
    .cert__corner--bl { bottom: 18px; left: 18px; border-right: 0; border-top: 0; }
    .cert__corner--br { bottom: 18px; right: 18px; border-left: 0; border-top: 0; }
    .cert__head { display: flex; justify-content: space-between; align-items: flex-start; }
    .cert__brand { display: flex; align-items: center; gap: 12px; color: var(--primary-700); }
    .cert__brand h3 { font-size: var(--fs-20); }
    .cert__id { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); }
    .cert__title { text-align: center; margin-top: 24px; }
    .cert__title small { font-family: var(--font-mono); font-size: 12px; letter-spacing: .4em; color: var(--ink-soft); }
    .cert__title h1 { font-size: 56px; margin-top: 6px; letter-spacing: .04em; }
    .cert__title em { display: block; font-style: normal; font-family: var(--font-mono); font-size: 13px; color: var(--primary-700); margin-top: 6px; letter-spacing: .12em; }
    .cert__body { text-align: center; margin: 28px 0 12px; }
    .cert__body p { font-size: var(--fs-18); color: var(--ink-2); }
    .cert__name { font-family: var(--font-display); font-size: 48px; color: var(--primary-700); margin: 12px 0 6px; letter-spacing: .04em; border-bottom: 2px solid var(--line); display: inline-block; padding: 0 32px 8px; }
    .cert__rank { font-family: var(--font-display); font-size: 28px; color: var(--warning); margin-top: 8px; }
    .cert__stats { display: flex; justify-content: center; gap: 32px; margin: 18px 0 8px; font-family: var(--font-mono); }
    .cert__stats div { padding: 10px 18px; background: #fff; border: 1px solid var(--line); border-radius: 6px; }
    .cert__stats strong { display: block; font-size: 22px; color: var(--primary-700); }
    .cert__stats span { font-size: 11px; color: var(--ink-soft); letter-spacing: .12em; }
    .cert__footer { position: absolute; left: 64px; right: 64px; bottom: 56px; display: flex; justify-content: space-between; align-items: flex-end; }
    .cert__sign { text-align: center; font-family: var(--font-display); }
    .cert__sign .name { font-size: 22px; color: var(--ink); border-top: 1px solid var(--line); padding-top: 6px; min-width: 200px; }
    .cert__sign small { display: block; font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); letter-spacing: .12em; margin-top: 2px; }
    .cert__seal { width: 110px; height: 110px; border: 3px double var(--warning); border-radius: 50%; display: grid; place-items: center; color: var(--warning); font-family: var(--font-display); text-align: center; transform: rotate(-6deg); background: rgba(255,87,34,.04); }
    .cert__seal strong { display: block; font-size: 18px; }
    .cert__seal small { font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em; }
    .cert__date { font-family: var(--font-mono); font-size: 13px; color: var(--ink-mute); letter-spacing: .12em; }

    .radar { width: 100%; max-width: 360px; aspect-ratio: 1; margin: 0 auto; }

    .hall {
      display: grid; grid-template-columns: 1fr 360px; gap: var(--sp-7);
    }
    .hall__main {
      position: relative;
      background:
        radial-gradient(circle at 50% 40%, rgba(0,217,255,.05) 0%, transparent 60%),
        repeating-linear-gradient(0deg, transparent 0 39px, rgba(15,23,42,.04) 39px 40px),
        #fff;
      border: 1px solid var(--line);
      border-radius: var(--r-5);
      box-shadow: var(--sh-3);
      padding: var(--sp-6);
      min-height: 560px;
      overflow: hidden;
    }
    .hall__main::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(180deg, transparent 0, rgba(0,217,255,.04) 100%);
    }
    .hall__head { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--sp-4); }
    .hall__head h2 { font-size: var(--fs-20); }
    .hall__live { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 11px; color: var(--success); letter-spacing: .12em; }
    .hall__live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 0 rgba(0,229,160,.6); animation: livePulse 1.6s var(--ease) infinite; }

    .earth-stage { position: relative; height: 460px; display: grid; place-items: center; }
    .earth-svg { width: 360px; height: 360px; }
    .earth-svg .breath { transform-origin: 50% 50%; animation: breath 3.2s var(--ease) infinite; }
    .earth-svg .hotspot { cursor: pointer; }
    .earth-svg .hotspot__pulse { transform-origin: center; transform-box: fill-box; animation: hotspotPulse 2.2s var(--ease) infinite; }
    .earth-svg .hotspot__core { transition: transform var(--t-fast) var(--ease); }
    .earth-svg .hotspot:hover .hotspot__core { transform: scale(1.15); }
    .earth-svg .hotspot__label {
      font-family: var(--font-mono);
      font-size: 10px; fill: var(--ink);
      letter-spacing: .08em; text-anchor: middle;
      pointer-events: none; opacity: 0;
      transition: opacity var(--t-fast) var(--ease);
    }
    .earth-svg .hotspot:hover .hotspot__label { opacity: 1; }

    .hall__legend {
      position: absolute; left: var(--sp-6); bottom: var(--sp-6);
      display: flex; flex-direction: column; gap: 8px;
      font-family: var(--font-mono); font-size: 11px;
      color: var(--ink-mute); letter-spacing: .08em;
    }
    .hall__legend .row { display: flex; align-items: center; gap: 8px; }
    .hall__legend .dot { width: 8px; height: 8px; border-radius: 50%; }

    .hall__ticker {
      position: absolute; right: var(--sp-6); top: var(--sp-6);
      width: 200px; max-height: 200px; overflow: hidden;
      background: var(--bg-deep); color: var(--ink-on-deep);
      border-radius: var(--r-3); padding: 10px 12px;
      font-family: var(--font-mono); font-size: 11px;
      border: 1px solid rgba(0,217,255,.25);
      box-shadow: var(--sh-glow);
    }
    .hall__ticker h5 { margin: 0 0 6px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; color: var(--accent); }
    .hall__ticker ul { list-style: none; margin: 0; padding: 0; }
    .hall__ticker li { padding: 3px 0; border-top: 1px dashed rgba(0,217,255,.18); display: flex; justify-content: space-between; gap: 8px; }
    .hall__ticker li:first-child { border-top: none; }
    .hall__ticker .tag { color: var(--accent-soft); }
    .hall__ticker .num { color: #fff; }

    .hall__side { display: flex; flex-direction: column; gap: var(--sp-4); }
    .patient-card {
      background: #fff; border: 1px solid var(--line);
      border-radius: var(--r-4); padding: var(--sp-5);
      box-shadow: var(--sh-2);
      position: relative; overflow: hidden;
    }
    .patient-card::before {
      content: ""; position: absolute; top: 0; right: 0;
      width: 100px; height: 100px;
      background: radial-gradient(circle, var(--primary-100) 0, transparent 60%);
    }
    .patient-card h3 { font-size: var(--fs-18); }
    .patient-card dl { margin: var(--sp-3) 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
    .patient-card dt { font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); letter-spacing: .08em; }
    .patient-card dd { margin: 0; font-weight: 500; color: var(--ink); }
    .patient-card__barcode {
      margin-top: var(--sp-4);
      display: flex; align-items: end; gap: 2px;
      height: 28px;
      background-image: repeating-linear-gradient(90deg, var(--ink) 0 1px, transparent 1px 3px, var(--ink) 3px 4px, transparent 4px 7px, var(--ink) 7px 9px, transparent 9px 11px, var(--ink) 11px 12px, transparent 12px 16px);
    }
    .patient-card__barcode small { display: block; font-family: var(--font-mono); font-size: 10px; color: var(--ink-soft); margin-top: 4px; letter-spacing: .12em; }

    .visits { background: #fff; border: 1px solid var(--line); border-radius: var(--r-4); padding: var(--sp-5); box-shadow: var(--sh-2); }
    .visits h4 { display: flex; align-items: center; justify-content: space-between; font-size: var(--fs-15); font-family: var(--font-body); font-weight: 700; }
    .visits__list { margin-top: var(--sp-3); display: grid; gap: 8px; }
    .visits__item { display: flex; align-items: center; gap: 10px; font-size: var(--fs-13); }
    .visits__item .swatch { width: 8px; height: 8px; border-radius: 50%; background: var(--line-strong); }
    .visits__item.is-on .swatch { background: var(--success); box-shadow: 0 0 8px var(--success-soft); }
    .visits__item .name { flex: 1; color: var(--ink-mute); }
    .visits__item.is-on .name { color: var(--ink); }
    .visits__item .badge { font-family: var(--font-mono); font-size: 10px; color: var(--ink-soft); letter-spacing: .08em; }

    .clinic { display: flex; flex-direction: column; gap: var(--sp-7); }
    .clinic__hero {
      display: grid; grid-template-columns: 200px 1fr; gap: var(--sp-6);
      align-items: center;
      background: linear-gradient(135deg, #fff 0%, var(--bg-paper) 100%);
      border: 1px solid var(--line); border-radius: var(--r-4);
      padding: var(--sp-6);
      box-shadow: var(--sh-2);
    }
    .clinic__hero .avatar { width: 160px; height: 160px; }
    .clinic__hero h1 { font-size: var(--fs-32); }
    .clinic__hero .eyebrow { margin-bottom: 6px; display: block; }
    .clinic__hero .meta { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }

    .bubble {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--r-4);
      border-top-left-radius: 0;
      padding: var(--sp-5) var(--sp-6);
      position: relative;
      box-shadow: var(--sh-2);
      font-size: var(--fs-16);
      color: var(--ink-2);
      min-height: 84px;
    }

    .exam-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: var(--sp-5); align-items: stretch; }
    .exam-card { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
    .exam-card__head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px;
      background: rgba(0,217,255,.06);
      border-bottom: 1px solid rgba(0,217,255,.2);
      color: var(--accent);
      font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em;
    }
    .exam-card__head .blip { display: inline-flex; align-items: center; gap: 6px; }
    .exam-card__head .blip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .exam-card__body { padding: var(--sp-5); flex: 1; display: flex; flex-direction: column; gap: 12px; color: var(--ink-on-deep); }
    .exam-card__body h4 { color: #fff; font-size: var(--fs-16); }
    .exam-card__body p { color: var(--ink-on-deep-mute); font-size: var(--fs-14); }
    .exam-card__body .legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-family: var(--font-mono); font-size: 11px; color: var(--ink-on-deep); }
    .exam-card__body .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .exam-card__body .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

    .diagram { width: 100%; aspect-ratio: 16 / 9; border-radius: var(--r-3); background: var(--bg-deep-3); border: 1px dashed rgba(0,217,255,.2); padding: var(--sp-3); display: flex; align-items: center; justify-content: center; }
    .diagram svg { width: 100%; height: 100%; }

    .diagnosis-doc {
      position: relative;
      padding: var(--sp-7);
      background:
        repeating-linear-gradient(0deg, transparent 0 27px, rgba(15,23,42,.04) 27px 28px),
        var(--bg-paper);
      color: var(--ink);
      border: 1px solid #E8DFC8;
      border-radius: var(--r-4);
      box-shadow: var(--sh-2);
      font-family: var(--font-body);
    }
    .diagnosis-doc h3 { font-family: var(--font-display); font-size: var(--fs-24); border-bottom: 1px solid #C9BFA6; padding-bottom: 8px; }
    .diagnosis-doc dl { margin: var(--sp-4) 0; display: grid; grid-template-columns: 100px 1fr; gap: 8px 16px; font-size: var(--fs-14); }
    .diagnosis-doc dt { font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); letter-spacing: .08em; align-self: center; }
    .diagnosis-doc dd { margin: 0; }
    .diagnosis-doc .stamp { position: absolute; right: 28px; bottom: 28px; }
    .diagnosis-doc .doc-no { position: absolute; right: 28px; top: 28px; font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); letter-spacing: .12em; }

    .surgery { display: flex; flex-direction: column; gap: var(--sp-6); }
    .surgery__top {
      display: grid; grid-template-columns: 1fr 220px; gap: var(--sp-5);
      align-items: center;
    }
    .surgery__brief { padding: var(--sp-5); }
    .surgery__brief h2 { font-size: var(--fs-24); margin-bottom: 6px; }
    .surgery__brief p { color: var(--ink-2); font-size: var(--fs-14); }
    .surgery__timer {
      background: var(--bg-deep); color: #fff;
      border-radius: var(--r-3); padding: var(--sp-5);
      text-align: center;
      border: 1px solid rgba(0,217,255,.25);
      box-shadow: var(--sh-glow);
    }
    .surgery__timer small { font-family: var(--font-mono); font-size: 11px; letter-spacing: .18em; color: var(--accent); }
    .surgery__timer .num {
      font-family: var(--font-mono); font-weight: 700;
      font-size: 56px; line-height: 1; margin-top: 6px;
      color: #fff; transition: color var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
      display: inline-block;
    }
    .surgery__timer.is-warn .num { color: var(--amber); }
    .surgery__timer.is-danger .num { color: var(--warning); animation: scalePulse 1s infinite; }
    .surgery__bar { height: 6px; background: rgba(255,255,255,.1); border-radius: 3px; margin-top: 10px; overflow: hidden; }
    .surgery__bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--accent) 0%, var(--success) 100%); transition: width 100ms linear; }

    .surgery__stage {
      position: relative;
      background: linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-deep-2) 100%);
      color: var(--ink-on-deep);
      border: 1px solid rgba(0,217,255,.18);
      border-radius: var(--r-4);
      padding: var(--sp-7);
      min-height: 280px;
      display: grid; place-items: center;
      box-shadow: var(--sh-glow);
      overflow: hidden;
    }
    .surgery__stage .stage-svg { width: min(520px, 100%); }
    .surgery__stage.is-success { box-shadow: 0 0 0 2px var(--success), 0 0 60px rgba(0,229,160,.4); }
    .surgery__stage.is-fail { animation: shakeX .5s var(--ease); }
    .surgery__overlay {
      position: absolute; inset: 0;
      display: grid; place-items: center;
      background: rgba(10,25,41,.78);
      color: #fff; text-align: center;
      padding: var(--sp-6);
      opacity: 0; pointer-events: none;
      transition: opacity var(--t-mid) var(--ease);
    }
    .surgery__stage.is-success .surgery__overlay, .surgery__stage.is-fail .surgery__overlay { opacity: 1; pointer-events: auto; }
    .surgery__overlay h3 { color: #fff; font-size: var(--fs-24); margin-bottom: 6px; }
    .surgery__overlay p { color: var(--ink-on-deep-mute); margin-bottom: var(--sp-4); }

    .surgery__tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-4); }
    .tool {
      background: #fff; border: 1px solid var(--line);
      border-radius: var(--r-4); padding: var(--sp-5);
      text-align: center;
      transition: transform var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
      cursor: pointer;
    }
    .tool:hover:not(:disabled) { transform: translateY(-3px); border-color: var(--primary); box-shadow: var(--sh-3); }
    .tool:disabled { cursor: not-allowed; opacity: .6; }
    .tool__icon { font-size: 36px; margin-bottom: 8px; }
    .tool h4 { font-family: var(--font-display); font-size: var(--fs-18); margin-bottom: 4px; }
    .tool p { color: var(--ink-soft); font-size: var(--fs-13); }
    .tool.is-correct { border-color: var(--success); background: rgba(0,229,160,.08); box-shadow: 0 0 0 2px var(--success); }
    .tool.is-wrong { border-color: var(--warning); background: rgba(255,87,34,.08); box-shadow: 0 0 0 2px var(--warning); animation: shakeX .4s var(--ease); }

    .report { display: flex; flex-direction: column; gap: var(--sp-7); }
    .report__hero { display: grid; grid-template-columns: 1.2fr .8fr; gap: var(--sp-6); align-items: stretch; }
    .report__hero .left, .report__hero .right { background: #fff; border: 1px solid var(--line); border-radius: var(--r-4); padding: var(--sp-6); box-shadow: var(--sh-2); }
    .report__hero h2 { font-size: var(--fs-24); margin-bottom: 6px; }
    .report__hero .summary { color: var(--ink-2); font-size: var(--fs-14); margin: var(--sp-3) 0; }
    .report__progress { display: flex; align-items: end; gap: var(--sp-3); margin: var(--sp-4) 0; }
    .report__progress .num { font-family: var(--font-mono); font-size: 56px; font-weight: 700; color: var(--primary-700); line-height: 1; }
    .report__progress small { font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); letter-spacing: .12em; }
    .report__bar { height: 8px; background: var(--bg-soft); border-radius: 4px; overflow: hidden; }
    .report__bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%); transition: width .8s var(--ease); }
    .report__medals { display: flex; gap: 6px; margin-top: 12px; }
    .report__medals i { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, var(--accent) 0%, var(--primary) 100%); color: var(--bg-deep); font-size: 14px; box-shadow: 0 0 12px rgba(0,217,255,.45); }
    .report__medals i.empty { background: var(--bg-soft); color: var(--ink-soft); box-shadow: none; }

    .report__right { display: flex; flex-direction: column; gap: 12px; }
    .report__right h3 { font-size: var(--fs-18); }
    .report__right .rank-line { display: flex; align-items: center; gap: 10px; }
    .report__right .rank-line .v { font-family: var(--font-display); font-size: var(--fs-24); color: var(--warning); }

    .report__grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--sp-5); }
    .report__chart { background: #fff; border: 1px solid var(--line); border-radius: var(--r-4); padding: var(--sp-5); box-shadow: var(--sh-2); }
    .report__chart h3 { margin-bottom: 6px; font-size: var(--fs-18); }
    .report__chart .sub { color: var(--ink-soft); font-size: var(--fs-13); margin-bottom: var(--sp-3); }

    .cert-form { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; margin-top: var(--sp-4); }
    .cert-form label { font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); letter-spacing: .12em; }
    .cert-form input {
      width: 100%; padding: 10px 14px; font-size: var(--fs-15);
      border: 1px solid var(--line-strong); border-radius: var(--r-3);
      font-family: var(--font-body);
    }
    .cert-form input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

    /* ============================================================
       animations.css · 关键帧动画
       ============================================================ */
    @keyframes viewIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes panelIn { from { opacity: 0; transform: scale(.92) translateY(12px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    @keyframes breath { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.025); } }
    @keyframes hotspotPulse { 0%, 100% { opacity: .55; transform: scale(1); } 50% { opacity: 0; transform: scale(2.4); } }
    @keyframes blink { to { visibility: hidden; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes livePulse { 0% { box-shadow: 0 0 0 0 rgba(0,229,160,.5); } 70% { box-shadow: 0 0 0 10px rgba(0,229,160,0); } 100% { box-shadow: 0 0 0 0 rgba(0,229,160,0); } }
    @keyframes shakeX { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
    @keyframes scalePulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    @keyframes medalSpin { 0% { transform: rotate(-180deg) scale(0); } 60% { transform: rotate(20deg) scale(1.08); } 100% { transform: rotate(0) scale(1); } }
    @keyframes typingReveal { from { width: 0; } to { width: 100%; } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes tickerScroll { from { transform: translateY(0); } to { transform: translateY(-50%); } }
    @keyframes scenarioQuake { 0%, 100% { transform: translate(0, 0); } 20% { transform: translate(-3px, 1px); } 40% { transform: translate(3px, -1px); } 60% { transform: translate(-2px, 2px); } 80% { transform: translate(2px, -2px); } }
    @keyframes waveDrift { 0% { transform: translateX(0); } 100% { transform: translateX(-40px); } }
    @keyframes lavaRise { 0%, 100% { transform: translateY(0); opacity: .8; } 50% { transform: translateY(-6px); opacity: 1; } }
    @keyframes flicker { 0%, 100% { opacity: .8; } 50% { opacity: 1; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .fadeUp { animation: fadeUp var(--t-mid) var(--ease) both; }
    .float { animation: float 3s var(--ease) infinite; }
    .flicker { animation: flicker 1.4s var(--ease) infinite; }

    /* ============================================================
       responsive.css · 响应式
       ============================================================ */
    @media (max-width: 1023px) {
      .hall { grid-template-columns: 1fr; }
      .hall__ticker { position: static; width: auto; max-height: none; margin-top: var(--sp-4); }
      .earth-stage { height: 380px; }
      .earth-svg { width: 300px; height: 300px; }
      .clinic__hero { grid-template-columns: 120px 1fr; }
      .clinic__hero .avatar { width: 100px; height: 100px; }
      .exam-grid { grid-template-columns: 1fr; }
      .rx-grid { grid-template-columns: 1fr 1fr; }
      .report__hero { grid-template-columns: 1fr; }
      .report__grid { grid-template-columns: 1fr; }
      .surgery__top { grid-template-columns: 1fr; }
      .surgery__tools { grid-template-columns: 1fr; }
    }
    @media (max-width: 767px) {
      :root {
        --gutter: 16px;

     ============================================================ */
  (function () {
    const KEY = 'earth_medical_state_v1';
    const initial = { visited: [], meds: [], surgeryLog: [], certificateName: '' };
    const state = load();
    function load() {
      try {
        const raw = localStorage.getItem(KEY);
        if (!raw) return { ...initial };
        return { ...initial, ...JSON.parse(raw) };
      } catch { return { ...initial }; }
    }
    function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} }
    const Store = {
      get state() { return state; },
      subscribe(fn) {
        this._subs = this._subs || new Set();
        this._subs.add(fn);
        return () => this._subs.delete(fn);
      },
      _emit() { (this._subs || []).forEach(fn => { try { fn(state); } catch {} }); },
      visitClinic(id) {
        if (!state.visited.includes(id)) { state.visited.push(id); save(); this._emit(); }
      },
      recordSurgery(id, success) {
        const exists = state.surgeryLog.find(s => s.id === id);
        if (!exists) {
          state.surgeryLog.push({ id, success, ts: Date.now() });
          if (success) state.meds.push(id);
          save(); this._emit();
        }
      },
      reset() { Object.assign(state, initial); save(); this._emit(); },
      setCertificateName(name) { state.certificateName = (name || '').slice(0, 16); save(); },
      get medalCount() { return state.meds.length; },
      get progress() { return state.visited.length / window.DISASTERS.length; },
      get rank() {
        const m = this.medalCount, v = state.visited.length;
        if (v >= 5 && m >= 3) return { title: '主任医师', short: 'AR', desc: '您已走完所有诊室，地球医院的「年度最佳医生」。' };
        if (m >= 3)         return { title: '主治医师', short: 'AT', desc: '已熟练完成多台手术，可以独立坐诊。' };
        if (m >= 1 || v >= 3) return { title: '住院医生', short: 'R2', desc: '基础扎实，正在积累临床经验。' };
        return { title: '见习医生', short: 'R1', desc: '欢迎来到行星医院，让我们从「挂号」开始。' };
      },
      get mostIgnored() {
        const visitedSet = new Set(state.visited);
        const missing = window.DISASTERS.filter(d => !visitedSet.has(d.id));
        return missing[0] || null;
      }
    };
    window.Store = Store;
  })();

  (function () {
    function typeText(el, text, speed = 40) {
      return new Promise(resolve => {
        el.classList.add('cursor');
        el.textContent = '';
        let i = 0;
        const tick = () => {
          if (i >= text.length) { el.classList.remove('cursor'); return resolve(); }
          el.textContent += text[i++];
          setTimeout(tick, speed);
        };
        tick();
      });
    }
    async function typeSequence(targets, gap = 350) {
      for (const { el, text, speed } of targets) {
        await typeText(el, text, speed || 40);
        await wait(gap);
      }
    }
    function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
    function h(tag, attrs = {}, children = []) {
      const el = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (k === 'class') el.className = v;
        else if (k === 'html') el.innerHTML = v;
        else if (k === 'text') el.textContent = v;
        else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
        else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
        else if (k === 'dataset' && typeof v === 'object') Object.assign(el.dataset, v);
        else if (v !== false && v != null) el.setAttribute(k, v);
      }
      (Array.isArray(children) ? children : [children]).forEach(c => {
        if (c == null || c === false) return;
        el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
      });
      return el;
    }
    function nowStr() {
      const d = new Date();
      const p = n => String(n).padStart(2, '0');
      return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    }
    function shake(el) { el.classList.remove('shake-x'); void el.offsetWidth; el.classList.add('shake-x'); }
    function debounce(fn, ms = 200) {
      let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
    }
    function fadeInView(view) { view.classList.remove('view--in'); void view.offsetWidth; view.classList.add('view--in'); }
    function nfmt(n) { return n.toLocaleString('zh-CN'); }
    function dateStr(d = new Date()) {
      return `${d.getFullYear()} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日`;
    }
    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    }
    window.U = { typeText, typeSequence, wait, h, nowStr, shake, debounce, fadeInView, nfmt, dateStr, escapeHtml };
  })();

    function startCountdown(view, s) {
      const total = s.countdown;
      let left = total;
      const numEl = view.querySelector('#timerNum');
      const barEl = view.querySelector('#timerBar');
      const timerEl = view.querySelector('#timer');
      const stageEl = view.querySelector('#stage');
      const toolsEl = view.querySelector('#tools');
      const overlayEl = view.querySelector('#overlay');
      const overlayTitle = view.querySelector('#overlayTitle');
      const overlayDesc = view.querySelector('#overlayDesc');

      function tick() {
        numEl.textContent = String(left);
        barEl.style.width = (left / total * 100) + '%';
        timerEl.classList.toggle('is-warn', left <= total * 0.5);
        timerEl.classList.toggle('is-danger', left <= 3);
        if (left <= 0) {
          clearInterval(timerHandle); timerHandle = null;
          finish(false);
          return;
        }
        left -= 1;
      }
      tick();
      timerHandle = setInterval(tick, 1000);

      toolsEl.querySelectorAll('.tool').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.dataset.idx);
          const correct = idx === s.correctIndex;
          toolsEl.querySelectorAll('.tool').forEach(b => b.disabled = true);
          btn.classList.add(correct ? 'is-correct' : 'is-wrong');
          if (!correct) toolsEl.querySelector('.tool[data-idx="' + s.correctIndex + '"]').classList.add('is-correct');
          finish(correct);
        });
      });

      function finish(success) {
        clearInterval(timerHandle); timerHandle = null;
        stageEl.classList.add(success ? 'is-success' : 'is-fail');
        overlayTitle.textContent = success ? '✅ 手术成功' : '❌ 手术失败';
        overlayDesc.textContent = success ? s.success : s.fail;
        overlayEl.querySelector('#retry').onclick = () => {
          stageEl.classList.remove('is-success', 'is-fail');
          toolsEl.querySelectorAll('.tool').forEach(b => {
            b.classList.remove('is-correct', 'is-wrong');
            b.disabled = false;
          });
          startCountdown(view, s);
        };
        window.Store.recordSurgery(s.id, success);
        if (success) showMedal();
      }
    }

    function showMedal() {
      const overlay = document.getElementById('medalOverlay');
      overlay.classList.add('is-open');
      overlay.setAttribute('aria-hidden', 'false');
      const close = () => {
        overlay.classList.remove('is-open');
        overlay.setAttribute('aria-hidden', 'true');
        overlay.removeEventListener('click', onBg);
        overlay.querySelector('[data-medal-close]').removeEventListener('click', close);
      };
      const onBg = (e) => { if (e.target.classList.contains('medal-overlay__backdrop')) close(); };
      overlay.addEventListener('click', onBg);
      overlay.querySelector('[data-medal-close]').addEventListener('click', close);
    }

    window.SurgeryView = { render };
  })();

    function radarSvg() {
      const N = window.DISASTERS.length;

      const visited = new Set(window.Store.state.visited);

      });
      const points = window.DISASTERS.map((d, i) => {
        const a = angle(i);
        const score = med.has(d.surgery && d.surgery.id) ? 1 : (visited.has(d.id) ? 0.5 : 0);
        const r = R * Math.max(0.05, score);
        return `${(cx + r * Math.cos(a)).toFixed(1)},${(cy + r * Math.sin(a)).toFixed(1)}`;
      });
      const data = `<polygon points="${points.join(' ')}" fill="rgba(30,136,229,.22)" stroke="#1E88E5" stroke-width="2"/>`;

        const a = angle(i);

      }).join('');
      return `<svg viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%">${grid}${axes}${data}${dots}${labels}</svg>`;

    // 将证书 SVG 转为 PNG 并下载（无外部依赖）
    async function saveCertificate() {
      const svg = buildCertificateSvg();
      const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const name = window.Store.state.certificateName || '未署名';
      try {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = () => reject(new Error('证书图片加载失败'));
          img.src = url;
        });
        const canvas = document.createElement('canvas');
        canvas.width = 1120 * 2;
        canvas.height = 794 * 2;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const png = canvas.toDataURL('image/png');
        const a = document.createElement('a');
        a.href = png;
        a.download = `地球医生证书_${name}_${Date.now()}.png`;
        document.body.appendChild(a);
        a.click();
        a.remove();
      } catch (e) {
        alert('证书生成失败：' + (e && e.message ? e.message : e));
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    window.ReportView = { render };
  })();

  /* ============================================================
     router.js · 极简 hash 路由
     ============================================================ */
  (function () {
    const routes = [
      { pattern: /^\/?$/,                          view: (view) => window.HallView.render(view) },
      { pattern: /^\/hall$/,                       view: (view) => window.HallView.render(view) },
      { pattern: /^\/clinic\/([a-z]+)$/,           view: (view, m) => window.ClinicView.render(view, m[1]) },
      { pattern: /^\/surgery\/([a-z]+)$/,          view: (view, m) => window.SurgeryView.render(view, m[1]) },
      { pattern: /^\/report$/,                     view: (view) => window.ReportView.render(view) }
    ];
    function dispatch() {
      const view = document.getElementById('view');
      if (!view) return;
      const hash = location.hash.replace(/^#/, '') || '/';
      for (const r of routes) {
        const m = hash.match(r.pattern);
        if (m) {
          try { r.view(view, m); }
          catch (e) { console.error(e); view.innerHTML = '<p class="muted">页面渲染失败，请刷新重试。</p>'; }
          view.style.animation = 'none'; void view.offsetWidth;
          view.style.animation = '';
          return;
        }
      }
      location.hash = '#/hall';
    }
    window.addEventListener('hashchange', dispatch);
    window.Router = { dispatch };
  })();

  /* ============================================================
     app.js · 启动入口
     ============================================================ */
  (function () {
    document.addEventListener('DOMContentLoaded', () => {
      if (!location.hash) location.hash = '#/hall';
      else window.Router.dispatch();
    });
  })();
