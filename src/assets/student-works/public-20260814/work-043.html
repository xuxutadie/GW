        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            animation: bounceIn 0.8s ease-out;
        }

        h1 {
            color: white;
            font-size: 2.5rem;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.2);
            margin-bottom: 10px;
        }

        .subtitle {
            color: rgba(255,255,255,0.9);
            font-size: 1.2rem;
        }

        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .control-item {
            background: white;
            padding: 15px 25px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            color: #555;
        }

        .control-item span {
            font-weight: bold;
            color: #667eea;
            font-size: 1.3rem;
        }

        .restart-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 15px 35px;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(240, 147, 251, 0.4);
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .restart-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(240, 147, 251, 0.5);
        }

        .restart-btn:active {
            transform: translateY(0);
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            max-width: 900px;
            width: 100%;
        }

        .card {
            aspect-ratio: 1;
            position: relative;
            cursor: pointer;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            padding: 8px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            transition: all 0.2s ease;
            word-break: break-word;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .card.hidden {
            visibility: hidden;
        }

        .card.selected {
            box-shadow: 0 0 0 4px #f5576c;
            transform: scale(1.05);
        }

        .card.english {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            color: #333;
        }

        .card.chinese {
            background: linear-gradient(135deg, #d299c2 0%, #fef9d7 100%);
            color: #333;
        }

        .win-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .win-modal.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .win-content {
            background: white;
            padding: 50px;
            border-radius: 30px;
            text-align: center;
            animation: scaleIn 0.5s ease;
            max-width: 400px;
            width: 90%;
        }

        .win-content h2 {
            font-size: 2.5rem;
            color: #667eea;
            margin-bottom: 20px;
        }

        .win-emoji {
            font-size: 5rem;
            margin-bottom: 20px;
        }

        .win-stats {
            font-size: 1.3rem;
            color: #555;
            margin-bottom: 30px;
            line-height: 1.8;
        }

        .win-stats span {
            color: #f5576c;
            font-weight: bold;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes scaleIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        @media (max-width: 800px) {
            .game-board {
                grid-template-columns: repeat(5, 1fr);
                gap: 8px;
            }
            .card {
                font-size: 1rem;
                padding: 6px;
            }
        }

        @media (max-width: 500px) {
            h1 {
                font-size: 1.8rem;
            }
            .game-board {
                grid-template-columns: repeat(5, 1fr);
                gap: 6px;
            }
            .card {
                font-size: 0.85rem;
                padding: 4px;
            }
            .controls {
                gap: 10px;
            }
            .control-item {
                padding: 10px 15px;
                font-size: 1rem;
            }
        }
    </style>
</head>

        const CARDS_PER_LEVEL = 15;
        const TOTAL_LEVELS = 100;
        let currentLevel = 1;
        let currentWordPairs = [];

        let gameState = {
            cards: [],
            selectedCards: [],
            matchedPairs: 0,
            moves: 0,
            timer: null,
            seconds: 0,
            isProcessing: false
        };

        // 保存游戏进度
        function saveProgress() {
            const progress = {
                level: currentLevel
            };
            localStorage.setItem('wordMatchGame', JSON.stringify(progress));
        }

        // 加载游戏进度
        function loadProgress() {
            const saved = localStorage.getItem('wordMatchGame');
            if (saved) {
                const progress = JSON.parse(saved);
                currentLevel = progress.level || 1;
            }
        }

        function shuffle(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        // 根据关卡生成种子
        function getSeededRandom(seed) {
            const x = Math.sin(seed) * 10000;
            return x - Math.floor(x);
        }

        // 根据关卡选择单词
        function getWordsForLevel(level) {
            const seed = level * 12345;
            const selectedIndices = [];
            const used = new Set();
            
            for (let i = 0; i < CARDS_PER_LEVEL; i++) {
                let index;
                let attempts = 0;
                do {
                    const randomVal = getSeededRandom(seed + i + attempts * 100);
                    index = Math.floor(randomVal * allWordPairs.length);
                    attempts++;
                } while (used.has(index) && attempts < 1000);
                
                used.add(index);
                selectedIndices.push(index);
            }
            
            return selectedIndices.map(index => allWordPairs[index]);
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }

        function updateTimer() {
            document.getElementById('timer').textContent = formatTime(gameState.seconds);
        }

        function updateMoves() {
            document.getElementById('moves').textContent = gameState.moves;
        }

        function updateLevel() {
            document.getElementById('level').textContent = currentLevel;
        }

        function startTimer() {
            if (gameState.timer) return;
            gameState.timer = setInterval(() => {
                gameState.seconds++;
                updateTimer();
            }, 1000);
        }

        function stopTimer() {
            if (gameState.timer) {
                clearInterval(gameState.timer);
                gameState.timer = null;
            }
        }

        function createCards() {
            const cards = [];
            currentWordPairs.forEach((pair, index) => {
                cards.push({
                    id: `english-${index}`,
                    pairId: index,
                    text: pair.english,
                    type: 'english'
                });
                cards.push({
                    id: `chinese-${index}`,
                    pairId: index,
                    text: pair.chinese,
                    type: 'chinese'
                });
            });
            return shuffle(cards);
        }

        function renderBoard() {
            const board = document.getElementById('gameBoard');
            board.innerHTML = '';
            
            gameState.cards.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = `card ${card.type}`;
                cardEl.dataset.index = index;
                cardEl.dataset.pairId = card.pairId;
                cardEl.textContent = card.text;
                cardEl.addEventListener('click', () => selectCard(index));
                board.appendChild(cardEl);
            });
        }

        function selectCard(index) {
            if (gameState.isProcessing) return;
            
            const cardEls = document.querySelectorAll('.card');
            const cardEl = cardEls[index];
            
            if (cardEl.classList.contains('selected') || cardEl.classList.contains('hidden')) {
                return;
            }

            if (!gameState.timer) {
                startTimer();
            }

            cardEl.classList.add('selected');
            gameState.selectedCards.push(index);

            if (gameState.selectedCards.length === 2) {
                gameState.moves++;
                updateMoves();
                checkMatch();
            }
        }

        function checkMatch() {
            gameState.isProcessing = true;
            const cardEls = document.querySelectorAll('.card');
            const [index1, index2] = gameState.selectedCards;
            const card1 = gameState.cards[index1];
            const card2 = gameState.cards[index2];

            if (card1.pairId === card2.pairId) {
                setTimeout(() => {
                    cardEls[index1].classList.add('hidden');
                    cardEls[index2].classList.add('hidden');
                    cardEls[index1].classList.remove('selected');
                    cardEls[index2].classList.remove('selected');
                    gameState.matchedPairs++;
                    gameState.selectedCards = [];
                    gameState.isProcessing = false;

                    if (gameState.matchedPairs === currentWordPairs.length) {
                        setTimeout(showWinModal, 300);
                    }
                }, 300);
            } else {
                setTimeout(() => {
                    cardEls[index1].classList.remove('selected');
                    cardEls[index2].classList.remove('selected');
                    gameState.selectedCards = [];
                    gameState.isProcessing = false;
                }, 800);
            }
        }

        function showWinModal() {
            stopTimer();
            if (currentLevel >= TOTAL_LEVELS) {
                document.getElementById('winTitle').textContent = `🎉 恭喜通关全部100关！`;
                document.querySelector('.win-emoji').textContent = '🏆🎊🏆';
            } else {
                document.getElementById('winTitle').textContent = `第 ${currentLevel} 关完成！`;
                document.querySelector('.win-emoji').textContent = '🎉🌟🎉';
            }
            document.getElementById('finalTime').textContent = formatTime(gameState.seconds);
            document.getElementById('finalMoves').textContent = gameState.moves;
            document.getElementById('winModal').classList.add('show');
        }

        function nextLevel() {
            document.getElementById('winModal').classList.remove('show');
            if (currentLevel < TOTAL_LEVELS) {
                currentLevel++;
                saveProgress();
            }
            initGame();
        }

        function resetGame() {
            currentLevel = 1;
            saveProgress();
            initGame();
        }

        function initGame() {
            stopTimer();
            currentWordPairs = getWordsForLevel(currentLevel);
            gameState = {
                cards: createCards(),
                selectedCards: [],
                matchedPairs: 0,
                moves: 0,
                timer: null,
                seconds: 0,
                isProcessing: false
            };
            updateTimer();
            updateMoves();
            updateLevel();
            renderBoard();
        }

        loadProgress();
