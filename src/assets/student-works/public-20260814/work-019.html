<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全科普答题挑战赛</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #333;
            overflow-x: hidden;
        }

        /* 粒子背景 */
        .particles { position: fixed; width: 100%; height: 100%; overflow: hidden; pointer-events: none; z-index: 0; }
        .particle { position: absolute; width: 4px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 50%; animation: float 20s infinite; }
        @keyframes float { 0%,100%{transform:translateY(100vh) rotate(0deg);opacity:0;} 10%{opacity:1;} 90%{opacity:1;} 100%{transform:translateY(-10vh) rotate(720deg);opacity:0;} }

        .container { max-width: 800px; margin: 0 auto; padding: 20px; position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }

        .card { background: white; border-radius: 24px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); animation: fadeInUp 0.6s ease; }
        @keyframes fadeInUp { from{opacity:0;transform:translateY(30px);} to{opacity:1;transform:translateY(0);} }

        /* 首页 */
        .home-screen { text-align: center; }
        .home-icon { font-size: 80px; margin-bottom: 20px; animation: bounce 2s infinite; }
        @keyframes bounce { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-15px);} }
        .home-title { font-size: 36px; color: #1a1a2e; margin-bottom: 12px; font-weight: 800; }
        .home-subtitle { font-size: 18px; color: #666; margin-bottom: 30px; }
        .home-info { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 30px 0; }
        .info-item { background: linear-gradient(145deg, #f5f7fa, #ffffff); border-radius: 16px; padding: 20px; border: 2px solid #e8ecf1; }
        .info-num { font-size: 32px; font-weight: bold; color: #e74c3c; }
        .info-label { font-size: 14px; color: #888; margin-top: 4px; }

        /* 主题标签 */
        .topic-tags { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 20px 0; }
        .topic-tag { padding: 8px 20px; border-radius: 20px; font-size: 14px; font-weight: bold; color: white; }
        .tag-earthquake { background: #e74c3c; }
        .tag-fire { background: #f39c12; }
        .tag-flood { background: #3498db; }
        .tag-traffic { background: #9b59b6; }

        .btn-primary { display: inline-block; background: linear-gradient(135deg, #e74c3c, #c0392b); color: white; padding: 16px 48px; border-radius: 50px; font-size: 20px; font-weight: bold; border: none; cursor: pointer; transition: all 0.3s; margin-top: 20px; box-shadow: 0 10px 30px rgba(231,76,60,0.4); }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(231,76,60,0.5); }
        .btn-primary:active { transform: translateY(0); }

        /* 答题页面 */
        .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; gap: 12px; }
        .quiz-progress { flex: 1; margin-right: 16px; }
        .progress-bar { height: 10px; background: #e8ecf1; border-radius: 5px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #e74c3c, #f39c12); border-radius: 5px; transition: width 0.5s ease; }
        .progress-text { font-size: 14px; color: #888; margin-top: 6px; }

        .header-right { display: flex; gap: 10px; align-items: center; }
        .quiz-timer { background: linear-gradient(135deg, #3498db, #2980b9); color: white; padding: 10px 20px; border-radius: 20px; font-weight: bold; font-size: 16px; display: flex; align-items: center; gap: 6px; }
        .quiz-timer.warning { background: linear-gradient(135deg, #e74c3c, #c0392b); animation: pulse-timer 1s infinite; }
        @keyframes pulse-timer { 0%,100%{transform:scale(1);} 50%{transform:scale(1.05);} }
        .quiz-score { background: linear-gradient(135deg, #e74c3c, #f39c12); color: white; padding: 10px 20px; border-radius: 20px; font-weight: bold; font-size: 16px; }

        /* 主题标签（答题中） */
        .question-topic { display: inline-block; padding: 4px 14px; border-radius: 16px; font-size: 12px; font-weight: bold; color: white; margin-bottom: 12px; margin-left: 8px; vertical-align: middle; }

        .question-box { background: linear-gradient(145deg, #f8f9fa, #ffffff); border-radius: 20px; padding: 30px; margin-bottom: 24px; border: 2px solid #e8ecf1; }
        .question-num { display: inline-block; background: #e74c3c; color: white; padding: 6px 16px; border-radius: 20px; font-size: 14px; font-weight: bold; margin-bottom: 16px; }
        .question-text { font-size: 22px; color: #1a1a2e; line-height: 1.6; font-weight: 600; }

        .options-list { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { background: white; border: 2px solid #e8ecf1; border-radius: 16px; padding: 18px 24px; font-size: 16px; cursor: pointer; transition: all 0.3s; text-align: left; display: flex; align-items: center; gap: 12px; }
        .option-btn:hover { border-color: #e74c3c; background: #fff5f5; transform: translateX(5px); }
        .option-btn.correct { border-color: #27ae60; background: #e8f8f0; color: #27ae60; }
        .option-btn.wrong { border-color: #e74c3c; background: #fff5f5; color: #e74c3c; }
        .option-btn.disabled { pointer-events: none; }
        .option-letter { width: 36px; height: 36px; background: #f0f2f5; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; }
        .option-btn.correct .option-letter { background: #27ae60; color: white; }
        .option-btn.wrong .option-letter { background: #e74c3c; color: white; }

        /* 解析区域 */
        .explain-box { background: linear-gradient(145deg, #e8f4f8, #f0f8ff); border-radius: 16px; padding: 24px; margin-top: 20px; border-left: 4px solid #3498db; display: none; }
        .explain-box.show { display: block; animation: fadeInUp 0.4s ease; }
        .explain-title { font-size: 18px; font-weight: bold; color: #2980b9; margin-bottom: 10px; }
        .explain-text { color: #555; line-height: 1.8; font-size: 15px; }
        .next-btn { background: linear-gradient(135deg, #3498db, #2980b9); color: white; padding: 14px 36px; border-radius: 30px; font-size: 16px; font-weight: bold; border: none; cursor: pointer; margin-top: 20px; float: right; transition: all 0.3s; }
        .next-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(52,152,219,0.4); }

        /* 烟花画布 */
        #fireworks-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; display: none; }

        /* 结果页面 */
        .result-screen { text-align: center; }
        .result-emoji { font-size: 80px; margin-bottom: 20px; }
        .result-title { font-size: 32px; color: #1a1a2e; margin-bottom: 10px; font-weight: 800; }
        .result-score { font-size: 72px; font-weight: bold; background: linear-gradient(135deg, #e74c3c, #f39c12); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 20px 0; }

        .result-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 24px 0; }
        .stat-item { background: linear-gradient(145deg, #f5f7fa, #ffffff); border-radius: 16px; padding: 16px; border: 2px solid #e8ecf1; }
        .stat-num { font-size: 28px; font-weight: bold; color: #e74c3c; }
        .stat-label { font-size: 13px; color: #888; margin-top: 4px; }

        .result-rank { background: linear-gradient(145deg, #f5f7fa, #ffffff); border-radius: 20px; padding: 30px; margin: 30px 0; border: 2px solid #e8ecf1; }
        .rank-title { font-size: 20px; color: #1a1a2e; margin-bottom: 20px; font-weight: bold; }
        .rank-list { text-align: left; }
        .rank-item { display: flex; align-items: center; padding: 14px 16px; border-radius: 12px; margin-bottom: 8px; transition: all 0.3s; }
        .rank-item:hover { background: #f5f7fa; }
        .rank-item.you { background: linear-gradient(90deg, #fff5f5, #ffffff); border: 2px solid #e74c3c; }
        .rank-num { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 16px; flex-shrink: 0; }
        .rank-num.gold { background: #ffd700; color: #333; }
        .rank-num.silver { background: #c0c0c0; color: #333; }
        .rank-num.bronze { background: #cd7f32; color: white; }
        .rank-num.normal { background: #f0f2f5; color: #666; }
        .rank-name { flex: 1; font-size: 16px; }
        .rank-score { font-weight: bold; color: #e74c3c; font-size: 18px; }

        .btn-group { display: flex; gap: 16px; justify-content: center; margin-top: 30px; flex-wrap: wrap; }
        .btn-secondary { background: white; color: #e74c3c; padding: 14px 36px; border-radius: 50px; font-size: 16px; font-weight: bold; border: 2px solid #e74c3c; cursor: pointer; transition: all 0.3s; }
        .btn-secondary:hover { background: #fff5f5; transform: translateY(-2px); }

        @media (max-width: 600px) {
            .card { padding: 24px; }
            .home-title { font-size: 26px; }
            .home-info { grid-template-columns: 1fr; }
            .question-text { font-size: 18px; }
            .result-score { font-size: 56px; }
            .btn-group { flex-direction: column; }
            .btn-primary, .btn-secondary { width: 100%; }
            .quiz-header { flex-direction: column; align-items: stretch; }
            .header-right { justify-content: space-between; }
            .result-stats { grid-template-columns: 1fr; }
        }

        .screen { display: none; }
        .screen.active { display: block; }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    <canvas id="fireworks-canvas"></canvas>

    <div class="container">
        <!-- 首页 -->
        <div class="screen active" id="homeScreen">
            <div class="card home-screen">
                <div class="home-icon">🛡️</div>
                <h1 class="home-title">安全科普答题挑战赛</h1>
                <p class="home-subtitle">参加全国青少年安全与应急科普创新大赛<br>测试你的安全知识储备</p>
                <div class="topic-tags">
                    <span class="topic-tag tag-earthquake">🌋 地震安全</span>
                    <span class="topic-tag tag-fire">🔥 火灾逃生</span>
                    <span class="topic-tag tag-flood">🌊 洪水防范</span>
                    <span class="topic-tag tag-traffic">🚦 交通安全</span>
                </div>
                <div class="home-info">
                    <div class="info-item"><div class="info-num">20</div><div class="info-label">道题目</div></div>
                    <div class="info-item"><div class="info-num">200</div><div class="info-label">满分挑战</div></div>
                    <div class="info-item"><div class="info-num">⏱️</div><div class="info-label">计时挑战</div></div>
                </div>
                <button class="btn-primary" onclick="startQuiz()">开始挑战</button>
            </div>
        </div>

        <!-- 答题页面 -->
        <div class="screen" id="quizScreen">
            <div class="card">
                <div class="quiz-header">
                    <div class="quiz-progress">
                        <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width: 0%"></div></div>
                        <div class="progress-text">第 <span id="currentQ">1</span> / <span id="totalQ">20</span> 题</div>
                    </div>
                    <div class="header-right">
                        <div class="quiz-timer" id="quizTimer">⏱️ <span id="timerDisplay">00:00</span></div>
                        <div class="quiz-score">得分: <span id="currentScore">0</span></div>
                    </div>
                </div>

                <div class="question-box">
                    <div>
                        <span class="question-num" id="questionNum">第 1 题</span>
                        <span class="question-topic" id="questionTopic"></span>
                    </div>
                    <div class="question-text" id="questionText">题目加载中...</div>
                </div>

                <div class="options-list" id="optionsList"></div>

                <div class="explain-box" id="explainBox">
                    <div class="explain-title">📖 答案解析</div>
                    <div class="explain-text" id="explainText"></div>
                    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">下一题 →</button>
                    <div style="clear: both;"></div>
                </div>
            </div>
        </div>

        <!-- 结果页面 -->
        <div class="screen" id="resultScreen">
            <div class="card result-screen">
                <div class="result-emoji" id="resultEmoji">🎉</div>
                <h2 class="result-title" id="resultTitle">挑战完成！</h2>
                <div class="result-score" id="finalScore">0</div>
                <p id="resultMsg" style="color: #666; font-size: 18px;">继续加油！</p>

                <div class="result-stats">
                    <div class="stat-item"><div class="stat-num" id="statCorrect">0</div><div class="stat-label">答对题数</div></div>
                    <div class="stat-item"><div class="stat-num" id="statWrong">0</div><div class="stat-label">答错题数</div></div>
                    <div class="stat-item"><div class="stat-num" id="statTime">00:00</div><div class="stat-label">总用时</div></div>
                </div>

                <div class="result-rank">
                    <div class="rank-title">🏆 排行榜</div>
                    <div class="rank-list" id="rankList"></div>
                </div>

                <div class="btn-group">
                    <button class="btn-primary" onclick="restartQuiz()">再挑战一次</button>
                    <button class="btn-secondary" onclick="showHome()">返回首页</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 题目数据 - 20道题，涵盖4个主题
        const questions = [
            // 地震安全（5题）
            {
                question: "地震发生时，如果你正在教室里上课，应该怎么做？",
                options: ["立刻跑出教室", "躲在课桌下面，保护头部", "站在窗户边看情况", "大声呼救等待救援"],
                correct: 1, topic: "earthquake",
                explain: "地震发生时，'伏地、遮挡、手抓牢'是国际上通用的避震原则。在教室里应迅速躲在课桌等坚固家具下方，用书包或双手保护头部，等主震过后再有秩序撤离。"
            },
            {
                question: "以下哪个地方是地震时最安全的躲避位置？",
                options: ["电梯里", "窗户旁边", "卫生间等小开间", "阳台"],
                correct: 2, topic: "earthquake",
                explain: "卫生间等小开间因为空间小、墙体多、有水源，相对稳固，是室内较安全的躲避位置。而电梯、窗户、阳台在地震中都非常危险。"
            },
            {
                question: "地震预警和地震预报是一回事吗？",
                options: ["是的，完全一样", "不是，预警是地震发生后发出的", "不是，预报更准", "不确定"],
                correct: 1, topic: "earthquake",
                explain: "地震预警和地震预报完全不同。地震预警是在地震发生后，利用电波比地震波快的原理，提前几秒到几十秒发出警报；而地震预报是在地震发生前预测，目前科学技术还很难准确预报。"
            },
            {
                question: "如果你被困在废墟下，以下哪种做法是正确的？",
                options: ["不停地大声呼救，耗尽体力", "保存体力，听到有人经过时呼救", "用力推开身上的重物", "点燃火柴照明"],
                correct: 1, topic: "earthquake",
                explain: "被困废墟下要保存体力，不要盲目呼喊。可以间断性地敲击管道或墙壁发出声响，听到有人经过时再大声呼救。点燃火柴可能引发火灾或耗尽氧气。"
            },
            {
                question: "地震时在高楼内，以下哪个做法是错误的？",
                options: ["躲在坚固的桌子下", "远离玻璃窗", "乘坐电梯快速下楼", "用枕头保护头部"],
                correct: 2, topic: "earthquake",
                explain: "地震时绝对不要乘坐电梯！地震可能导致停电或电梯故障，使人被困在电梯内。应躲在坚固家具下或墙角，远离玻璃和窗户。"
            },
            // 火灾逃生（5题）
            {
                question: "发生火灾时，应该怎样逃生？",
                options: ["乘电梯快速下楼", "用湿毛巾捂住口鼻，弯腰低姿前行", "带上贵重物品再跑", "往楼上跑躲避"],
                correct: 1, topic: "fire",
                explain: "火灾逃生时要弯腰低姿前行，因为热烟气往上飘，贴近地面的空气较清新。逃生时千万不能乘坐电梯，以防停电被困。也不要贪恋财物，延误逃生时机。"
            },
            {
                question: "如果身上着火了，应该怎么做？",
                options: ["快速奔跑呼救", "就地打滚压灭火苗", "用手拍打", "脱掉所有衣服"],
                correct: 1, topic: "fire",
                explain: "身上着火时千万不能奔跑，因为跑动会带风让火烧得更旺。正确做法是就地打滚，用身体压灭火苗，或者用厚衣物覆盖着火处使其缺氧熄灭。"
            },
            {
                question: "火场中如果门把手发烫，说明什么？",
                options: ["门外有火灾，不能开门", "可以开门查看", "门在散热，很安全", "需要用水浇门"],
                correct: 0, topic: "fire",
                explain: "门把手发烫说明门外已经有火灾，此时绝对不能开门。应用湿毛巾或衣物堵住门缝，防止烟气进入，并在窗口发出求救信号等待救援。"
            },
            {
                question: "使用灭火器灭火时，应该对准火焰的哪个部位？",
                options: ["火焰最上方", "火焰根部", "火焰中间", "随意喷射"],
                correct: 1, topic: "fire",
                explain: "使用灭火器要对准火焰根部（即可燃物表面），这样才能有效覆盖火源、阻断燃烧。对准火焰上方喷射只是吹散火焰，无法灭火。"
            },
            {
                question: "家庭预防火灾，以下哪个做法是错误的？",
                options: ["定期检查电线线路", "在沙发上抽烟", "安装烟雾报警器", "厨房配备灭火器"],
                correct: 1, topic: "fire",
                explain: "在沙发上抽烟非常危险，烟头可能掉入沙发缝隙引燃火灾。沙发等家具多为易燃材料，一旦着火蔓延迅速。应到固定区域抽烟并确保烟头完全熄灭。"
            },
            // 洪水防范（5题）
            {
                question: "收到洪水预警后，以下哪个做法是正确的？",
                options: ["去河边看洪水", "转移到地势较高的地方", "留在地下室等待", "开车穿过积水路段"],
                correct: 1, topic: "flood",
                explain: "收到洪水预警后应迅速转移到地势较高的地方。不要去河边观看洪水，不要躲在地下室（容易被淹），更不要开车穿过积水路段（30厘米深的水就能冲走汽车）。"
            },
            {
                question: "洪水来临时，来不及转移怎么办？",
                options: ["爬上屋顶或高处等待救援", "跳入水中游泳逃生", "躲在衣柜里", "抱住树木不动"],
                correct: 0, topic: "flood",
                explain: "来不及转移时应迅速爬上屋顶或高处等待救援。千万不要游泳逃生，洪水中可能有暗流、杂物，非常危险。也不要躲在封闭空间如衣柜里。"
            },
            {
                question: "开车遇到积水路段，应该怎么做？",
                options: ["加速冲过去", "下车查看水深后再决定", "立刻掉头绕行", "跟着前车走"],
                correct: 2, topic: "flood",
                explain: "遇到积水路段应立刻掉头绕行。仅30厘米深的积水就能使汽车浮起，60厘米深的急流可以冲走大部分车辆。不要冒险涉水，安全第一。"
            },
            {
                question: "洪水过后，以下哪个做法是正确的？",
                options: ["立即喝自来水解渴", "返回家中清理", "等官方确认安全后再返回", "下水捞鱼"],
                correct: 2, topic: "flood",
                explain: "洪水过后要等官方确认安全才能返回家中。洪水可能损坏了水电设施、留下有害物质，自来水也可能被污染。不要喝未经处理的水，更不要下水捞鱼。"
            },
            {
                question: "山区暴雨后可能引发的次生灾害是？",
                options: ["地震", "泥石流和山体滑坡", "台风", "海啸"],
                correct: 1, topic: "flood",
                explain: "山区暴雨后容易引发泥石流和山体滑坡。暴雨使山体土壤饱和松动，在重力作用下形成泥石流。山区居民在暴雨天气要特别注意防范，必要时提前转移。"
            },
            // 交通安全（5题）
            {
                question: "骑自行车上路，必须年满多少岁？",
                options: ["10岁", "12岁", "14岁", "16岁"],
                correct: 1, topic: "traffic",
                explain: "根据《道路交通安全法》，驾驶自行车、三轮车上路必须年满12周岁。未满12岁的儿童在马路上骑车属于违法行为，因为他们的身体协调能力和判断力还不够成熟。"
            },
            {
                question: "乘坐汽车时，以下哪个做法是正确的？",
                options: ["坐在前排不系安全带", "后排也要系好安全带", "把头伸出窗外看风景", "在车内打闹"],
                correct: 1, topic: "traffic",
                explain: "无论前排还是后排，乘车都必须系好安全带。研究显示，系安全带可以减少50%以上的乘车伤亡。不系安全带在急刹车或碰撞时会被甩出车外，非常危险。"
            },
            {
                question: "过马路时，绿灯亮了，你应该怎么做？",
                options: ["直接走过去，不用看车", "先左看再右看，确认安全再走", "边走边看手机", "跑着过马路"],
                correct: 1, topic: "traffic",
                explain: "即使绿灯亮了，也要先左看再右看确认安全后再走。因为可能有闯红灯的车辆或转弯车辆。过马路时不能看手机，更不能奔跑，以免摔倒或躲闪不及。"
            },
            {
                question: "在没有人行道的路上行走，应该靠哪边走？",
                options: ["靠右走", "靠左走（面向来车）", "走马路中间", "随便走"],
                correct: 1, topic: "traffic",
                explain: "在没有人行道的道路上行走时，应靠左走（即面向来车方向），这样可以看清驶来的车辆，及时避让。这是交通安全的基本常识。"
            },
            {
                question: "骑电动车时，以下哪个做法是正确的？",
                options: ["不戴头盔", "佩戴安全头盔并扣好系带", "一边骑车一边打电话", "载人追逐打闹"],
                correct: 1, topic: "traffic",
                explain: "骑电动车必须佩戴安全头盔并扣好系带。头部是人体最脆弱的部位，佩戴头盔可以在事故中减少70%的头部伤害。骑车时不能打电话或打闹，要保持专注。"
            }
        ];

        const topicConfig = {
            earthquake: { name: "地震安全", color: "#e74c3c", emoji: "🌋" },
            fire: { name: "火灾逃生", color: "#f39c12", emoji: "🔥" },
            flood: { name: "洪水防范", color: "#3498db", emoji: "🌊" },
            traffic: { name: "交通安全", color: "#9b59b6", emoji: "🚦" }
        };

        // 模拟排行榜数据
        const mockRankings = [
            { name: "安全小卫士", score: 200 },
            { name: "应急小达人", score: 180 },
            { name: "防灾小专家", score: 160 },
            { name: "科普小能手", score: 140 },
            { name: "学习小标兵", score: 120 }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;
        let correctCount = 0;
        let wrongCount = 0;
        let timerInterval = null;
        let startTime = 0;
        let totalTime = 0;

        // 创建粒子背景
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 25; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDelay = Math.random() * 20 + 's';
                p.style.animationDuration = (15 + Math.random() * 10) + 's';
                container.appendChild(p);
            }
        }
        createParticles();

        // 显示指定屏幕
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // 计时器
        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 100);
        }

        function updateTimer() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = String(Math.floor(elapsed / 60)).padStart(2, '0');
            const seconds = String(elapsed % 60).padStart(2, '0');
            document.getElementById('timerDisplay').textContent = `${minutes}:${seconds}`;
            
            // 超过5分钟变红色警告
            const timerEl = document.getElementById('quizTimer');
            if (elapsed > 300) {
                timerEl.classList.add('warning');
            }
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                totalTime = Math.floor((Date.now() - startTime) / 1000);
                timerInterval = null;
            }
        }

        // 开始答题
        function startQuiz() {
            currentQuestion = 0;
            score = 0;
            correctCount = 0;
            wrongCount = 0;
            document.getElementById('currentScore').textContent = '0';
            document.getElementById('quizTimer').classList.remove('warning');
            showScreen('quizScreen');
            startTimer();
            loadQuestion();
        }

        // 加载题目
        function loadQuestion() {
            answered = false;
            const q = questions[currentQuestion];
            
            document.getElementById('questionNum').textContent = `第 ${currentQuestion + 1} 题`;
            document.getElementById('questionText').textContent = q.question;
            document.getElementById('currentQ').textContent = currentQuestion + 1;
            document.getElementById('totalQ').textContent = questions.length;
            
            // 显示主题标签
            const topicEl = document.getElementById('questionTopic');
            const config = topicConfig[q.topic];
            topicEl.textContent = `${config.emoji} ${config.name}`;
            topicEl.style.background = config.color;
            
            // 更新进度条
            const progress = ((currentQuestion) / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            
            // 生成选项
            const optionsHtml = q.options.map((opt, idx) => `
                <button class="option-btn" onclick="selectOption(${idx})" data-idx="${idx}">
                    <div class="option-letter">${String.fromCharCode(65 + idx)}</div>
                    <span>${opt}</span>
                </button>
            `).join('');
            document.getElementById('optionsList').innerHTML = optionsHtml;
            
            // 隐藏解析
            document.getElementById('explainBox').classList.remove('show');

            // 最后一题改按钮文字
            if (currentQuestion === questions.length - 1) {
                document.getElementById('nextBtn').textContent = '查看结果 →';
            } else {
                document.getElementById('nextBtn').textContent = '下一题 →';
            }
        }

        // 选择答案
        function selectOption(idx) {
            if (answered) return;
            answered = true;
            
            const q = questions[currentQuestion];
            const buttons = document.querySelectorAll('.option-btn');
            
            buttons.forEach(btn => {
                btn.classList.add('disabled');
                const btnIdx = parseInt(btn.dataset.idx);
                if (btnIdx === q.correct) {
                    btn.classList.add('correct');
                } else if (btnIdx === idx && btnIdx !== q.correct) {
                    btn.classList.add('wrong');
                }
            });
            
            if (idx === q.correct) {
                score += 10;
                correctCount++;
                document.getElementById('currentScore').textContent = score;
                // 答对了放烟花！
                launchFireworks();
            } else {
                wrongCount++;
            }
            
            // 显示解析
            document.getElementById('explainText').textContent = q.explain;
            document.getElementById('explainBox').classList.add('show');
            
            // 更新进度条
            const progress = ((currentQuestion + 1) / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        // 下一题
        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= questions.length) {
                showResult();
            } else {
                loadQuestion();
            }
        }

        // 显示结果
        function showResult() {
            stopTimer();
            showScreen('resultScreen');
            document.getElementById('finalScore').textContent = score;
            
            // 统计数据
            document.getElementById('statCorrect').textContent = correctCount;
            document.getElementById('statWrong').textContent = wrongCount;
            const minutes = String(Math.floor(totalTime / 60)).padStart(2, '0');
            const seconds = String(totalTime % 60).padStart(2, '0');
            document.getElementById('statTime').textContent = `${minutes}:${seconds}`;
            
            // 根据得分显示不同文案
            let emoji, title, msg;
            if (score === 200) {
                emoji = '🏆';
                title = '满分！安全小卫士！';
                msg = '太棒了！你的安全知识非常扎实！';
                launchFireworks();
            } else if (score >= 160) {
                emoji = '🎉';
                title = '优秀！应急小达人！';
                msg = '表现很棒！继续学习，向满分冲刺！';
            } else if (score >= 120) {
                emoji = '👍';
                title = '不错！继续加油！';
                msg = '掌握了基本知识，再看看解析巩固一下~';
            } else {
                emoji = '💪';
                title = '再接再厉！';
                msg = '多学习安全知识，保护自己也能帮助他人！';
            }
            
            document.getElementById('resultEmoji').textContent = emoji;
            document.getElementById('resultTitle').textContent = title;
            document.getElementById('resultMsg').textContent = msg;
            
            // 生成排行榜
            const allRankings = [...mockRankings, { name: '我', score: score, isYou: true }];
            allRankings.sort((a, b) => b.score - a.score);
            
            const rankHtml = allRankings.slice(0, 6).map((item, idx) => {
                let numClass = 'normal';
                if (idx === 0) numClass = 'gold';
                else if (idx === 1) numClass = 'silver';
                else if (idx === 2) numClass = 'bronze';
                
                const youClass = item.isYou ? 'you' : '';
                const nameText = item.isYou ? '我（你）' : item.name;
                
                return `
                    <div class="rank-item ${youClass}">
                        <div class="rank-num ${numClass}">${idx + 1}</div>
                        <div class="rank-name">${nameText}</div>
                        <div class="rank-score">${item.score}分</div>
                    </div>
                `;
            }).join('');
            
            document.getElementById('rankList').innerHTML = rankHtml;
        }

        // 重新开始
        function restartQuiz() {
            startQuiz();
        }

        // 返回首页
        function showHome() {
            stopTimer();
            showScreen('homeScreen');
        }

        // ========== 烟花动画 ==========
        const canvas = document.getElementById('fireworks-canvas');
        const ctx = canvas.getContext('2d');
        let fireworks = [];
        let fireworkAnimId = null;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Firework {
            constructor(x, y, targetY, color) {
                this.x = x;
                this.y = y;
                this.targetY = targetY;
                this.color = color;
                this.particles = [];
                this.exploded = false;
                this.speed = -8;
            }

            update() {
                if (!this.exploded) {
                    this.y += this.speed;
                    this.speed += 0.15;
                    if (this.y <= this.targetY || this.speed >= 0) {
                        this.explode();
                    }
                } else {
                    this.particles.forEach(p => {
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.08;
                        p.alpha -= 0.012;
                        p.vx *= 0.99;
                    });
                    this.particles = this.particles.filter(p => p.alpha > 0);
                }
            }

            explode() {
                this.exploded = true;
                const count = 60 + Math.floor(Math.random() * 40);
                for (let i = 0; i < count; i++) {
                    const angle = (Math.PI * 2 * i) / count;
                    const speed = 2 + Math.random() * 4;
                    this.particles.push({
                        x: this.x,
                        y: this.y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        alpha: 1,
                        size: 2 + Math.random() * 2
                    });
                }
            }

            draw() {
                if (!this.exploded) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                    
                    // 拖尾
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.x, this.y - this.speed * 3);
                    ctx.strokeStyle = this.color + '55';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                } else {
                    this.particles.forEach(p => {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fillStyle = this.color + Math.floor(p.alpha * 255).toString(16).padStart(2, '0');
                        ctx.fill();
                    });
                }
            }

            isDone() {
                return this.exploded && this.particles.length === 0;
            }
        }

        function launchFireworks() {
            canvas.style.display = 'block';
            const colors = ['#e74c3c', '#f39c12', '#27ae60', '#3498db', '#9b59b6', '#e91e63', '#ffeb3b'];
            
            // 发射3-5个烟花
            const count = 3 + Math.floor(Math.random() * 3);
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const x = Math.random() * canvas.width;
                    const targetY = canvas.height * 0.15 + Math.random() * canvas.height * 0.3;
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    fireworks.push(new Firework(x, canvas.height, targetY, color));
                }, i * 300);
            }

            if (!fireworkAnimId) {
                animateFireworks();
            }
        }

        function animateFireworks() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            fireworks.forEach(fw => {
                fw.update();
                fw.draw();
            });

            fireworks = fireworks.filter(fw => !fw.isDone());

            if (fireworks.length > 0) {
                fireworkAnimId = requestAnimationFrame(animateFireworks);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                canvas.style.display = 'none';
                fireworkAnimId = null;
            }
        }
    </script>
</body>
</html>
