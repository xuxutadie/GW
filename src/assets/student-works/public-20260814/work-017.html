    <style>
        /* CSS变量定义 */
        :root {

        /* 全局样式 */

        /* 地震背景层 */

            background-position: center;
            background-repeat: no-repeat;
        }

        .earthquake-bg::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

        /* 装饰元素 */

            left: 0;

        .option-button {

        .option-button.wrong {

        /* ==================== 反馈弹窗样式 ==================== */

            from {

                transform: translateY(20px);
            }
            to {

                transform: translateY(0);
            }
        }

        .feedback-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .feedback-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;

        }

        .feedback-icon.correct {
            background: var(--success-green);
        }

        .feedback-icon.wrong {
            background: var(--error-red);
        }

        .feedback-title {
            font-size: 20px;
            font-weight: 600;
        }

        .feedback-title.correct {
            color: var(--success-green);
        }

        .feedback-title.wrong {

        .feedback-answer {

<body>
    <!-- 地震背景层 -->
    <div class="earthquake-bg"></div>

    <!-- 装饰元素 -->
    <div class="decorations">
        <div class="decoration decoration-circle decoration-left" style="width: 8px; height: 8px; top: 10%;"></div>
        <div class="decoration decoration-circle decoration-left" style="width: 6px; height: 6px; top: 35%;"></div>
        <div class="decoration decoration-circle decoration-left" style="width: 4px; height: 4px; top: 60%;"></div>
        <div class="decoration decoration-icon decoration-left" style="top: 20%; font-size: 3px;">⚡</div>
        <div class="decoration decoration-icon decoration-left" style="top: 50%; font-size: 2px;">🛡️</div>
        <div class="decoration decoration-icon decoration-left" style="top: 80%; font-size: 2px;">📚</div>
        
        <div class="decoration decoration-circle decoration-right" style="width: 7px; height: 7px; top: 15%;"></div>
        <div class="decoration decoration-circle decoration-right" style="width: 5px; height: 5px; top: 45%;"></div>
        <div class="decoration decoration-circle decoration-right" style="width: 3px; height: 3px; top: 70%;"></div>
        <div class="decoration decoration-icon decoration-right" style="top: 25%; font-size: 2px;">🔔</div>
        <div class="decoration decoration-icon decoration-right" style="top: 55%; font-size: 2px;">🚨</div>
        <div class="decoration decoration-icon decoration-right" style="top: 85%; font-size: 2px;">🏠</div>
    </div>

    <div class="container">
        <!-- 首页/欢迎页 -->
        <div id="welcome-page" class="page active">
            <div class="welcome-header">
                <h1 class="welcome-title">地震了怎么做</h1>
                <p class="welcome-subtitle">学习地震自救知识，提升安全意识</p>
            </div>
            <div class="welcome-content">
                <p class="welcome-description">
                    题库共100道题目，每次随机抽取10道作答。<br>
                    涵盖地震前准备、地震中避险、地震后自救三大模块。<br>
                    每题答完立即反馈正确与否，并提供详细知识点解析。
                </p>
                <div class="module-tags">
                    <div class="module-tag">
                        <span class="module-tag-number">33</span>
                        <span>地震前准备</span>
                    </div>
                    <div class="module-tag">
                        <span class="module-tag-number">34</span>
                        <span>地震中避险</span>
                    </div>
                    <div class="module-tag">
                        <span class="module-tag-number">33</span>
                        <span>地震后自救</span>
                    </div>
                </div>
                <button class="start-button" onclick="startQuiz()">开始答题</button>
            </div>
        </div>

        <!-- 答题页 -->
        <div id="quiz-page" class="page">
            <div class="quiz-header">
                <div class="progress-container">
                    <div class="progress-text">
                        <span id="progress-question">第 1 题 / 共 12 题</span>
                        <span id="progress-score">当前得分：0 分</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
                    </div>
                </div>
            </div>
            <div class="quiz-content">
                <div class="module-title">
                    <div class="module-name" id="module-name">地震前准备</div>
                    <div class="module-progress" id="module-progress">第 1 题 / 共 4 题</div>
                </div>
                <div class="question-card">
                    <div class="question-number" id="question-number">题目 1</div>
                    <div class="question-text" id="question-text"></div>
                    <div class="options-container" id="options-container"></div>
                </div>
                <div class="quiz-actions">
                    <button class="action-button secondary" id="prev-button" onclick="prevQuestion()">上一题</button>
                    <button class="action-button secondary" id="skip-button" onclick="skipQuestion()">跳过此题</button>
                </div>
            </div>
        </div>

        <!-- 反馈弹窗 -->
        <div class="feedback-overlay" id="feedback-overlay">
            <div class="feedback-card">
                <div class="feedback-header">
                    <div class="feedback-icon" id="feedback-icon">✓</div>
                    <div class="feedback-title" id="feedback-title">回答正确</div>
                </div>
                <div class="feedback-answer" id="feedback-answer"></div>
                <div class="feedback-explanation" id="feedback-explanation"></div>
                <button class="feedback-button" id="feedback-button" onclick="continueQuiz()">继续下一题</button>
            </div>
        </div>

        <!-- 结果页 -->
        <div id="result-page" class="page">
            <div class="result-header">
                <div class="result-score-container">
                    <div class="result-score" id="result-score">0</div>
                    <div class="result-score-label">总分</div>
                </div>
                <div class="result-grade" id="result-grade">评级</div>
            </div>
            <div class="result-content">
                <div class="result-stats">
                    <div class="stat-item">
                        <div class="stat-value" id="stat-correct">0</div>
                        <div class="stat-label">正确题数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="stat-wrong">0</div>
                        <div class="stat-label">错误题数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="stat-skipped">0</div>
                        <div class="stat-label">跳过题数</div>
                    </div>
                </div>
                <div class="wrong-questions-title" id="wrong-title">错题回顾</div>
                <div class="wrong-questions-list" id="wrong-list"></div>
                <button class="restart-button" onclick="restartQuiz()">重新答题</button>
            </div>
        </div>
    </div>

    <script src="./地震了怎么做 - 地震安全互动问答_files/questions.js.下载"></script>
    <script>
        // ==================== 应用状态 ====================
        const appState = {
            currentPage: 'welcome',
            currentQuestionIndex: 0,
            score: 0,
            answers: [],
            wrongAnswers: [],
            skippedQuestions: [],
            answeredQuestions: [],
            currentQuestions: []
        };

        // ==================== 核心函数 ====================

        // 显示指定页面
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            appState.currentPage = pageId.replace('-page', '');
        }

        // 随机抽取题目
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // 开始答题
        function startQuiz() {
            showPage('quiz-page');
            appState.currentQuestionIndex = 0;
            appState.score = 0;
            appState.answers = [];
            appState.wrongAnswers = [];
            appState.skippedQuestions = [];
            appState.answeredQuestions = [];
            // 从100道题中随机抽取10道
            appState.currentQuestions = shuffleArray(questions).slice(0, 10);
            renderQuestion();
        }

        // 渲染当前题目
        function renderQuestion() {
            const question = appState.currentQuestions[appState.currentQuestionIndex];
            const totalQuestions = appState.currentQuestions.length;
            
            // 更新进度
            const progressPercent = ((appState.currentQuestionIndex) / totalQuestions) * 100;
            document.getElementById('progress-fill').style.width = progressPercent + '%';
            document.getElementById('progress-question').textContent = `第 ${appState.currentQuestionIndex + 1} 题 / 共 ${totalQuestions} 题`;
            document.getElementById('progress-score').textContent = `当前得分：${appState.score} 分`;

            // 更新模块信息
            document.getElementById('module-name').textContent = question.moduleName;
            const moduleQuestions = appState.currentQuestions.filter(q => q.module === question.module);
            const moduleIndex = moduleQuestions.findIndex(q => q.id === question.id) + 1;
            document.getElementById('module-progress').textContent = `第 ${moduleIndex} 题 / 共 ${moduleQuestions.length} 题`;

            // 更新题目内容
            document.getElementById('question-number').textContent = `题目 ${question.id}`;
            document.getElementById('question-text').textContent = question.question;

            // 渲染选项
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            question.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'option-button';
                button.textContent = `${['A', 'B', 'C', 'D'][index]}. ${option}`;
                button.onclick = () => selectOption(index);
                
                // 如果已经作答，显示之前的选择
                if (appState.answeredQuestions.includes(question.id)) {
                    const previousAnswer = appState.answers.find(a => a.questionId === question.id);
                    if (previousAnswer) {
                        button.classList.add('disabled');
                        if (index === previousAnswer.selectedOption) {
                            button.classList.add(previousAnswer.isCorrect ? 'correct' : 'wrong');
                        }
                        if (index === question.correctAnswer && !previousAnswer.isCorrect) {
                            button.classList.add('correct');
                        }
                    }
                }
                
                optionsContainer.appendChild(button);
            });

            // 更新按钮状态
            document.getElementById('prev-button').classList.toggle('disabled', appState.currentQuestionIndex === 0);
            document.getElementById('skip-button').classList.toggle('disabled', appState.answeredQuestions.includes(question.id));
        }

        // 选择选项
        function selectOption(selectedIndex) {
            const question = appState.currentQuestions[appState.currentQuestionIndex];
            
            // 如果已经作答，不允许再次选择
            if (appState.answeredQuestions.includes(question.id)) {
                return;
            }

            const isCorrect = selectedIndex === question.correctAnswer;
            
            // 记录答案
            appState.answers.push({
                questionId: question.id,
                selectedOption: selectedIndex,
                isCorrect: isCorrect
            });
            
            appState.answeredQuestions.push(question.id);
            
            // 更新分数（每题10分）
            if (isCorrect) {
                appState.score += 10;
            } else {
                appState.wrongAnswers.push({
                    question: question,
                    selectedOption: selectedIndex
                });
            }

            // 更新进度显示
            document.getElementById('progress-score').textContent = `当前得分：${appState.score} 分`;

            // 显示反馈
            showFeedback(isCorrect, question, selectedIndex);
        }

        // 显示反馈弹窗
        function showFeedback(isCorrect, question, selectedIndex) {
            const overlay = document.getElementById('feedback-overlay');
            const icon = document.getElementById('feedback-icon');
            const title = document.getElementById('feedback-title');
            const answerDiv = document.getElementById('feedback-answer');
            const explanation = document.getElementById('feedback-explanation');
            const button = document.getElementById('feedback-button');

            if (isCorrect) {
                icon.textContent = '✓';
                icon.className = 'feedback-icon correct';
                title.textContent = '回答正确';
                title.className = 'feedback-title correct';
                answerDiv.textContent = `你选择了：${['A', 'B', 'C', 'D'][selectedIndex]}. ${question.options[selectedIndex]}`;
                answerDiv.style.background = 'rgba(0, 184, 42, 0.08)';
            } else {
                icon.textContent = '✗';
                icon.className = 'feedback-icon wrong';
                title.textContent = '回答错误';
                title.className = 'feedback-title wrong';
                answerDiv.innerHTML = `
                    你选择了：${['A', 'B', 'C', 'D'][selectedIndex]}. ${question.options[selectedIndex]}<br>
                    <strong style="color: var(--success-green);">正确答案：${['A', 'B', 'C', 'D'][question.correctAnswer]}. ${question.options[question.correctAnswer]}</strong>
                `;
                answerDiv.style.background = 'rgba(245, 63, 63, 0.08)';
            }

            explanation.textContent = `💡 知识点解析：${question.explanation}`;

            // 更新按钮文字
            if (appState.currentQuestionIndex === appState.currentQuestions.length - 1) {
                button.textContent = '查看结果';
            } else {
                button.textContent = '继续下一题';
            }

            overlay.classList.add('active');
        }

        // 继续答题
        function continueQuiz() {
            document.getElementById('feedback-overlay').classList.remove('active');
            
            if (appState.currentQuestionIndex === appState.currentQuestions.length - 1) {
                showResult();
            } else {
                appState.currentQuestionIndex++;
                renderQuestion();
            }
        }

        // 上一题
        function prevQuestion() {
            if (appState.currentQuestionIndex > 0) {
                appState.currentQuestionIndex--;
                renderQuestion();
            }
        }

        // 跳过题目
        function skipQuestion() {
            const question = appState.currentQuestions[appState.currentQuestionIndex];
            
            if (!appState.answeredQuestions.includes(question.id)) {
                appState.skippedQuestions.push(question.id);
            }
            
            if (appState.currentQuestionIndex === appState.currentQuestions.length - 1) {
                showResult();
            } else {
                appState.currentQuestionIndex++;
                renderQuestion();
            }
        }

        // 显示结果
        function showResult() {
            showPage('result-page');

            // 计算统计
            const correctCount = appState.answers.filter(a => a.isCorrect).length;
            const wrongCount = appState.wrongAnswers.length;
            const skippedCount = appState.skippedQuestions.filter(id => !appState.answeredQuestions.includes(id)).length;

            // 显示分数
            document.getElementById('result-score').textContent = appState.score;
            document.getElementById('stat-correct').textContent = correctCount;
            document.getElementById('stat-wrong').textContent = wrongCount;
            document.getElementById('stat-skipped').textContent = skippedCount;

            // 评级
            let grade = '';
            let gradeColor = '';
            if (appState.score >= 90) {
                grade = '优秀';
                gradeColor = 'background: rgba(0, 184, 42, 0.3);';
            } else if (appState.score >= 70) {
                grade = '良好';
                gradeColor = 'background: rgba(22, 93, 255, 0.3);';
            } else if (appState.score >= 60) {
                grade = '及格';
                gradeColor = 'background: rgba(255, 125, 0, 0.3);';
            } else {
                grade = '需加强';
                gradeColor = 'background: rgba(245, 63, 63, 0.3);';
            }
            document.getElementById('result-grade').textContent = grade;
            document.getElementById('result-grade').style.cssText = gradeColor;

            // 错题列表
            const wrongList = document.getElementById('wrong-list');
            const wrongTitle = document.getElementById('wrong-title');
            
            if (appState.wrongAnswers.length === 0) {
                wrongTitle.textContent = '恭喜你！全部答对';
                wrongList.innerHTML = '<div class="no-wrong-message">🎉 你的地震安全意识非常棒！继续保持，定期复习巩固知识。</div>';
            } else {
                wrongTitle.textContent = '错题回顾';
                wrongList.innerHTML = appState.wrongAnswers.map(item => `
                    <div class="wrong-question-item">
                        <div class="wrong-question-text">❓ ${item.question.question}</div>
                        <div class="wrong-question-answer">✅ 正确答案：${['A', 'B', 'C', 'D'][item.question.correctAnswer]}. ${item.question.options[item.question.correctAnswer]}</div>
                        <div class="wrong-question-explanation">💡 ${item.question.explanation}</div>
                    </div>
                `).join('');
            }
        }

        // 重新答题
        function restartQuiz() {
            appState.currentQuestionIndex = 0;
            appState.score = 0;
            appState.answers = [];
            appState.wrongAnswers = [];
            appState.skippedQuestions = [];
            appState.answeredQuestions = [];
            showPage('welcome-page');
        }

        // ==================== 初始化 ====================
        // 页面加载时显示首页
        showPage('welcome-page');
    </script>

</body></html>
