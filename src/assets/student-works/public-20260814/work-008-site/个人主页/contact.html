  <!-- Contact Section -->
  <section class="contact">
    <div class="container">
      <div class="section-header reveal">
        <h1 class="section-title">联系</h1>
        <p class="section-subtitle">期待与你的交流</p>
      </div>
      <div class="contact-wrapper">
        <!-- Contact Info -->
        <div class="contact-info reveal">
          <div class="info-block">
            <h3>联系方式</h3>
            <div class="info-item">
              <span class="info-label">邮箱</span>
              <a href="mailto:hello@moyunxuan.com">hello@moyunxuan.com</a>
            </div>
            <div class="info-item">
              <span class="info-label">微信</span>
              <span>moyunxuan_design</span>
            </div>
            <div class="info-item">
              <span class="info-label">所在地</span>
              <span>浙江杭州</span>
            </div>
          </div>

          <div class="info-block">
            <h3>社交媒体</h3>
            <div class="social-links">
              <a href="#" class="social-link" aria-label="微博">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20.6 11.8c.7-.1 1.3-.4 1.8-.9.5-.5.8-1.1.9-1.8.1-.7-.1-1.4-.5-2-.4-.6-1-1-1.7-1.2-.2 0-.4-.1-.6-.1h-.2c-.5 0-1 .1-1.5.3-.4.2-.8.5-1.1.8-.3.4-.5.8-.6 1.3-.1.5 0 1 .2 1.4.2.5.6.9 1 1.2.4.3.9.4 1.4.4.2 0 .5 0 .7-.1.1 0 .2 0 .2-.1z"/>
                  <path d="M16.8 16.5c-.3.4-.7.7-1.2.9-.5.2-1 .3-1.5.3-.6 0-1.1-.1-1.6-.4-.5-.3-.9-.6-1.2-1.1-.3-.4-.5-.9-.6-1.5-.1-.5 0-1.1.2-1.6.2-.5.6-1 1-1.3.5-.3 1-.5 1.6-.5.6 0 1.1.1 1.6.4.5.3.9.6 1.2 1.1.3.5.5 1 .5 1.6 0 .6-.1 1.1-.4 1.6-.2.2-.4.4-.6.5z"/>
                  <path d="M12 18.5c-1.2.5-2.6.7-4 .5-1.4-.2-2.6-.7-3.5-1.5-.9-.8-1.4-1.8-1.5-3-.1-1.2.3-2.4 1.1-3.4.8-1 1.9-1.7 3.3-2.1 1.4-.4 2.8-.4 4.2 0"/>
                </svg>
                <span>微博</span>
              </a>
              <a href="#" class="social-link" aria-label="GitHub">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 00-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0020 4.77 5.07 5.07 0 0019.91 1S18.73.65 16 2.48a13.38 13.38 0 00-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 005 4.77a5.44 5.44 0 00-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 009 18.13V22"/>
                </svg>
                <span>GitHub</span>
              </a>
              <a href="#" class="social-link" aria-label="Dribbble">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"/>
                  <path d="M8.56 2.75c4.37 6.03 6.02 9.42 8.03 17.72m2.54-15.38c-3.72 4.35-8.94 5.66-16.88 5.85m19.5 1.9c-3.5-.93-6.63-.82-8.94 0-2.58.92-5.01 2.86-7.44 6.32"/>
                </svg>
                <span>Dribbble</span>
              </a>
            </div>
          </div>
        </div>

        <!-- Contact Form -->
        <div class="contact-form-wrapper reveal">
          <form class="contact-form" action="mailto:hello@moyunxuan.com" method="post" enctype="text/plain">
            <div class="form-group">
              <label for="name">称呼</label>
              <input type="text" id="name" name="name" placeholder="如何称呼您" required>
            </div>
            <div class="form-group">
              <label for="email">邮箱</label>
              <input type="email" id="email" name="email" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
              <label for="subject">主题</label>
              <input type="text" id="subject" name="subject" placeholder="咨询主题" required>
            </div>
            <div class="form-group">
              <label for="message">内容</label>
              <textarea id="message" name="message" rows="6" placeholder="写下您想说的话..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">发送邮件</button>
          </form>
        </div>
      </div>
    </div>
  </section>
