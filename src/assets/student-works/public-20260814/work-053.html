                                    <div className="bg-white/60 p-4 rounded-lg border border-white">
                                        <div className="text-xs text-gray-600 font-bold">距离</div>
                                        <div className="text-xl md:text-2xl font-bold text-purple-600">{Math.floor(distance)} 光年</div>
                                    </div>
                                </div>
                            </div>

                            <button 
                            onClick={() => { audio.init(); restartGame(); }}
                            className="px-8 md:px-12 py-4 md:py-5 bg-cyan-600 text-white font-black text-lg md:text-xl rounded hover:bg-cyan-500 transition-all shadow-xl tracking-widest"
                            >
                                重新开始
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className={containerClass}>
                    <div className="flex justify-between items-start w-full">
                        <div className="flex flex-col bg-black/40 p-2 md:p-4 rounded-xl backdrop-blur-sm border border-white/10">
                            <div className="text-xs md:text-sm text-cyan-200 font-bold mb-1">分数</div>
                            <div className="text-2xl md:text-4xl font-bold text-white font-cyber">
                                {score.toLocaleString()}
                            </div>
                        </div>
                        
                        <div className="flex space-x-1 md:space-x-2 bg-black/40 p-2 rounded-full backdrop-blur-sm">
                            {[...Array(maxLives)].map((_, i) => (
                                <Heart 
                                    key={i} 
                                    className={`w-6 h-6 md:w-8 md:h-8 ${i < lives ? 'text-red-500 fill-red-500' : 'text-gray-500 fill-gray-500'} drop-shadow-sm`} 
                                />
                            ))}
                        </div>
                    </div>
                    
                    <div className="absolute top-5 left-1/2 transform -translate-x-1/2 text-sm md:text-lg text-white font-bold tracking-wider font-mono bg-blue-600/80 px-4 py-1 rounded-full shadow-lg border border-white/20 z-50">
                        第 {level} 关 <span className="text-blue-200 text-xs md:text-sm">/ 3</span>
                    </div>

                    {isImmortalityActive && (
                        <div className="absolute top-24 left-1/2 transform -translate-x-1/2 text-yellow-500 font-black text-xl md:text-2xl animate-pulse flex items-center bg-white/80 px-4 py-2 rounded-lg shadow-lg">
                            <Shield className="mr-2 fill-yellow-500" /> 无敌护盾
                        </div>
                    )}

                    <div className="absolute top-16 md:top-24 left-1/2 transform -translate-x-1/2 flex space-x-2 md:space-x-3">
                        {target.map((char, idx) => {
                            const isCollected = collectedLetters.includes(idx);
                            const color = GEMINI_COLORS[idx];

                            return (
                                <div 
                                    key={idx}
                                    style={{
                                        borderColor: isCollected ? color : 'rgba(100, 116, 139, 0.5)',
                                        backgroundColor: isCollected ? color : 'rgba(255, 255, 255, 0.6)',
                                        color: isCollected ? '#fff' : 'rgba(0, 0, 0, 0.4)',
                                        boxShadow: isCollected ? `0 0 15px ${color}` : 'none',
                                    }}
                                    className={`w-8 h-10 md:w-10 md:h-12 flex items-center justify-center border-2 font-black text-lg md:text-xl font-cyber rounded-lg transform transition-all duration-300 shadow-md`}
                                >
                                    {char}
                                </div>
                            );
                        })}
                    </div>

                    <div className="w-full flex justify-end items-end">
                        <div className="flex items-center space-x-2 text-blue-900 bg-white/60 px-3 py-1 rounded-full shadow-sm backdrop-blur-sm">
                            <Zap className="w-4 h-4 md:w-6 md:h-6 animate-pulse text-yellow-500 fill-yellow-500" />
                            <span className="font-mono text-base md:text-xl font-bold">速度 {Math.round((speed / RUN_SPEED_BASE) * 100)}%</span>
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // MAIN APP (from App.tsx)
        // ==========================================

        const CameraController = () => {
            const { camera, size } = useThree();
            const { laneCount } = useStore();
            
            useFrame((state, delta) => {
                const aspect = size.width / size.height;
                const isMobile = aspect < 1.2; 

                const heightFactor = isMobile ? 2.0 : 0.5;
                const distFactor = isMobile ? 4.5 : 1.0;

                const extraLanes = Math.max(0, laneCount - 3);

                const targetY = 5.5 + (extraLanes * heightFactor);
                const targetZ = 8.0 + (extraLanes * distFactor);

                const targetPos = new THREE.Vector3(0, targetY, targetZ);
                
                camera.position.lerp(targetPos, delta * 2.0);
                camera.lookAt(0, 0, -30); 
            });
            
            return null;
        };

        function Scene() {
            return (
                <>
                    <Environment />
                    <group>
                        <group userData={{ isPlayer: true }} name="PlayerGroup">
                            <Player />
                        </group>
                        <LevelManager />
                    </group>
                    <Effects />
                </>
            );
        }

        function App() {
            return (
                <div className="relative w-full h-screen bg-[#87CEEB] overflow-hidden select-none">
                <HUD />
                <Canvas
                    shadows
                    dpr={[1, 1.5]} 
                    gl={{ antialias: true, stencil: false, depth: true, powerPreference: "high-performance" }}
                    camera={{ position: [0, 5.5, 8], fov: 60 }}
                >
                    <CameraController />
                    <Suspense fallback={null}>
                        <Scene />
                    </Suspense>
                </Canvas>
                </div>
            );
        }

        // ==========================================
        // RENDER (from index.tsx)
        // ==========================================

        const rootElement = document.getElementById('root');
        if (!rootElement) {
            throw new Error("Could not find root element to mount to");
        }

        const root = createRoot(rootElement);
        root.render(
            <React.StrictMode>
                <App />
            </React.StrictMode>
        );
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
