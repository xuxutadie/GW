<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自然灾害应急场景模拟系统</title>
<style>
/* ===== CSS变量 ===== */
:root {
  --safe-green:#38a169;
  --danger-red:#e53e3e;
  --warn-yellow:#ecc94b;
  --primary-blue:#1a365d;
  --bg-white:#ffffff;
  --text-dark:#1a202c;
  --text-gray:#4a5568;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  background:#f7fafc;
  height:100%;
  overflow:hidden;
  user-select:none;
}

/* ===== 分区标题通用样式 ===== */
.zone-label {
  background:var(--bg-white);
  border-bottom:3px solid var(--primary-blue);
  padding:8px 16px;
  font-size:17px;
  font-weight:900;
  color:var(--primary-blue);
  letter-spacing:1px;
}

/* ===== 1. 顶部导航区 ===== */
.nav-zone {
  background:var(--primary-blue);
  display:flex;
  flex-direction:column;
  flex-shrink:0;
}
.nav-buttons {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  padding:10px 16px;
  justify-content:center;
}
.nav-btn {
  padding:10px 18px;
  border:none;
  border-radius:8px;
  background:rgba(255,255,255,0.15);
  color:#fff;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  transition:all .2s;
}
.nav-btn:hover { background:var(--safe-green); transform:translateY(-2px); }
.nav-btn.active { background:var(--safe-green); box-shadow:0 0 0 3px rgba(56,161,105,.4); }

/* ===== 主内容区（中+右） ===== */
.main-wrap { flex:1; display:flex; overflow:hidden; }

/* ===== 2. 中部主交互区 ===== */
.scene-zone {
  flex:1;
  display:flex;
  flex-direction:column;
  background:#edf2f7;
  border-right:3px solid #e2e8f0;
  overflow:hidden;
}
.scene-body {
  flex:1;
  padding:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:auto;
}
#sceneCanvas {
  width:100%;
  height:100%;
  max-height:520px;
  background:#fff;
  border-radius:8px;
  border:2px solid #e2e8f0;
}
.scene-footer {
  padding:10px 16px;
  background:#fff;
  border-top:2px solid #e2e8f0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
}
.step-text { font-size:15px; color:var(--text-dark); font-weight:700; }
.step-text .num { color:var(--warn-yellow); background:var(--primary-blue); padding:2px 8px; border-radius:4px; margin:0 4px; }
.ctrl-btn {
  padding:8px 20px;
  border:none;
  border-radius:6px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  transition:all .2s;
}
.btn-back { background:var(--warn-yellow); color:var(--text-dark); }
.btn-back:hover { background:#d69e2e; }
.btn-reset { background:#4a5568; color:#fff; }
.btn-reset:hover { background:#718096; }
.btn-hint { background:var(--safe-green); color:#fff; }
.btn-hint:hover { background:#2f855a; }
.arrow-btn {
  width:40px;
  height:40px;
  border:none;
  border-radius:8px;
  background:#1a365d;
  color:#fff;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
  transition:all .15s;
}
.arrow-btn:hover { background:#2c5282; transform:scale(1.1); }
.arrow-btn:active { transform:scale(0.95); }
.btn-hint:hover { background:#2f855a; }

/* ===== 3. 右侧侧边区 ===== */
.sidebar-zone {
  width:300px;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  background:#fff;
  overflow:hidden;
}
.sidebar-body {
  flex:1;
  padding:12px;
  overflow-y:auto;
}
.tip-card {
  background:#f7fafc;
  border-left:4px solid var(--safe-green);
  border-radius:6px;
  padding:10px 12px;
  margin-bottom:10px;
}
.tip-title { font-size:14px; font-weight:800; color:var(--primary-blue); margin-bottom:4px; }
.tip-content { font-size:13px; color:var(--text-gray); line-height:1.6; }

/* ===== 4. 底部说明区 ===== */
.guide-zone {
  background:var(--bg-white);
  border-top:3px solid var(--primary-blue);
  flex-shrink:0;
}
.guide-body {
  padding:10px 16px;
  font-size:13px;
  color:var(--text-gray);
  line-height:1.8;
}
.guide-body strong { color:var(--primary-blue); }

/* ===== 弹窗 ===== */
.modal-overlay {
  position:fixed; inset:0;
  background:rgba(0,0,0,.65);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}
.modal-overlay.active { display:flex; }
.modal-box {
  background:#fff;
  border-radius:16px;
  padding:28px 32px;
  max-width:480px;
  width:90%;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
  animation:pop .3s ease;
}
@keyframes pop { from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }
.modal-box .tag {
  display:inline-block;
  padding:6px 18px;
  border-radius:20px;
  font-size:18px;
  font-weight:900;
  color:#fff;
  margin-bottom:12px;
}
.modal-box.success .tag { background:var(--safe-green); }
.modal-box.error .tag { background:var(--danger-red); }
.modal-box h3 { font-size:20px; font-weight:800; margin-bottom:8px; }
.modal-box.success h3 { color:var(--safe-green); }
.modal-box.error h3 { color:var(--danger-red); }
.modal-box p { font-size:15px; color:var(--text-gray); line-height:1.7; margin-bottom:20px; }
.modal-btn {
  padding:12px 40px;
  border:none;
  border-radius:8px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  color:#fff;
}

/* ===== SVG 文字标注样式 ===== */
.safe-label { fill:var(--safe-green); font-size:14px; font-weight:900; pointer-events:none; }
.danger-label { fill:var(--danger-red); font-size:14px; font-weight:900; pointer-events:none; }
.item-label { fill:#4a5568; font-size:11px; font-weight:700; pointer-events:none; }
.char-label { fill:var(--primary-blue); font-size:11px; font-weight:700; pointer-events:none; }

/* ===== 动画 ===== */
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
@keyframes swing { 0%,100%{transform:rotate(-6deg)} 50%{transform:rotate(6deg)} }
@keyframes flow { 0%{transform:translateX(0)} 100%{transform:translateX(18px)} }
@keyframes flash { 0%,100%{opacity:0} 50%{opacity:1} }
@keyframes smokeRise { 0%{opacity:.8;transform:translateY(0)scale(1)} 100%{opacity:0;transform:translateY(-80px)scale(1.8)} }
@keyframes firePulse { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(1.25)} }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

.a-shake { animation:shake .4s infinite; }
.a-swing { animation:swing 1.2s infinite ease-in-out; transform-origin:top center; }
.a-flow { animation:flow 2.5s infinite linear; }
.a-flash { animation:flash .8s infinite; }
.a-smoke { animation:smokeRise 3s infinite ease-out; }
.a-fire { animation:firePulse .35s infinite alternate; }
.a-float { animation:float 2.2s infinite ease-in-out; }

.safe-zone { fill:rgba(56,161,105,.22); stroke:var(--safe-green); stroke-width:2.5; stroke-dasharray:6,4; }
.danger-zone { fill:rgba(229,62,62,.22); stroke:var(--danger-red); stroke-width:2.5; stroke-dasharray:6,4; }
.safe-solid { fill:rgba(56,161,105,.35); stroke:var(--safe-green); stroke-width:2; }
.danger-solid { fill:rgba(229,62,62,.35); stroke:var(--danger-red); stroke-width:2; }
.interactive { cursor:pointer; }
.interactive:hover { filter:brightness(1.2); stroke-width:4; }

/* ===== 响应式 ===== */
@media (max-width:768px) {
  .main-wrap { flex-direction:column; }
  .sidebar-zone { width:100%; height:220px; border-left:none; border-top:3px solid #e2e8f0; }
  .nav-buttons { justify-content:center; }
  .scene-footer { flex-direction:column; text-align:center; }
}

[data-char] { cursor:grab; }
[data-char]:hover { filter:brightness(1.1); }
[data-char]:active { cursor:grabbing; }
</style>
</head>
<body style="display:flex;flex-direction:column;height:100vh;">

<!-- ===== 1. 顶部导航区 ===== -->
<div class="nav-zone">
  <div class="zone-label">【顶部导航区｜灾害场景选择】</div>
  <div class="nav-buttons">
    <button class="nav-btn active" onclick="switchScene('earthquake',this)">🏠 地震模拟</button>
    <button class="nav-btn" onclick="switchScene('floodTyphoon',this)">🌊 洪水台风模拟</button>
    <button class="nav-btn" onclick="switchScene('fire',this)">🔥 火灾逃生模拟</button>
    <button class="nav-btn" onclick="switchScene('landslide',this)">⛰️ 泥石流滑坡模拟</button>
    <button class="nav-btn" onclick="switchScene('lightning',this)">⚡ 雷电避险模拟</button>
    <button class="nav-btn" onclick="switchScene('heatCold',this)">🌡️ 高温寒潮模拟</button>
  </div>
</div>

<!-- ===== 中+右 主内容 ===== -->
<div class="main-wrap">

  <!-- 2. 中部主交互区 -->
  <div class="scene-zone">
    <div class="zone-label">【中部主交互区｜灾难虚拟推演沙盘】</div>
    <div class="scene-body">
      <svg id="sceneCanvas" viewBox="0 0 840 520" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div class="scene-footer">
      <div class="step-text" id="stepDisplay">步骤 <span class="num">1</span> / <span class="num" id="totalStep">5</span> ：<span id="stepDesc">加载中…</span></div>
      <div style="display:flex;align-items:center;gap:8px;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
          <button class="arrow-btn" onclick="moveChar(0,-30)" title="向上移动">↑</button>
          <div style="display:flex;gap:2px;">
            <button class="arrow-btn" onclick="moveChar(-30,0)" title="向左移动">←</button>
            <button class="arrow-btn" onclick="moveChar(0,30)" title="向下移动">↓</button>
            <button class="arrow-btn" onclick="moveChar(30,0)" title="向右移动">→</button>
          </div>
        </div>
        <span style="font-size:12px;color:#4a5568;font-weight:700;margin-right:4px;">移动小人</span>
        <button class="ctrl-btn btn-back" onclick="prevStep()">⏮ 上一步</button>
        <button class="ctrl-btn btn-reset" onclick="resetScene()">🔄 重置场景</button>
        <button class="ctrl-btn btn-hint" onclick="showHint()">💡 提示</button>
      </div>
    </div>
  </div>

  <!-- 3. 右侧侧边区 -->
  <div class="sidebar-zone">
    <div class="zone-label">【右侧侧边区｜科普知识点提示板】</div>
    <div class="sidebar-body" id="tipsPanel"></div>
  </div>

</div>

<!-- ===== 4. 底部说明区 ===== -->
<div class="guide-zone">
  <div class="zone-label">【底部说明区｜作品操作指引】</div>
  <div class="guide-body">
    <strong>操作步骤：</strong>① 点击顶部按钮切换不同灾害模拟沙盘；② 在沙盘画布中点击<strong style="color:var(--safe-green)">绿色安全区</strong>或<strong style="color:var(--danger-red)">红色危险区</strong>以及标注的交互道具进行选择；③ 选错会弹出红色警示说明风险后果，选对弹出绿色提示并进入下一步；④ 推演完可点击「重置场景」重新演练，点击「上一步」回退操作。
  </div>
</div>

<!-- ===== 弹窗 ===== -->
<div class="modal-overlay" id="modal">
  <div class="modal-box" id="modalBox">
    <div class="tag" id="modalTag">标签</div>
    <h3 id="modalTitle">标题</h3>
    <p id="modalText">内容说明</p>
    <button class="modal-btn" id="modalBtn" onclick="closeModal()">确定</button>
  </div>
</div>

// ============================================================
//  状态管理
// ============================================================
let currentScene = 'earthquake';
let currentStep  = 0;
let stepHistory  = [];

function init() {
  renderScene();
  cacheZones();
  renderTips();
  updateStepBar();
}

function switchScene(id, btn) {
  currentScene = id;
  currentStep  = 0;
  stepHistory  = [];
  lastHitZoneId = null;
  zoneCache = null;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  renderScene();
  cacheZones();
  renderTips();
  updateStepBar();
}

function updateStepBar() {
  const scene = SCENES[currentScene];
  const step  = scene.steps[currentStep];
  document.getElementById('stepDisplay').innerHTML =
    '步骤 <span class="num">' + (currentStep+1) + '</span> / <span class="num">' + scene.steps.length + '</span> ：' +
    '<span id="stepDesc">' + step.desc + '</span>';
}

function renderTips() {
  const panel = document.getElementById('tipsPanel');
  const tips  = SCENES[currentScene].tips;
  panel.innerHTML = tips.map(t =>
    '<div class="tip-card">' +
      '<div class="tip-title">📌 ' + t.title + '</div>' +
      '<div class="tip-content">' + t.content + '</div>' +
    '</div>'
  ).join('');
}

// ============================================================
//  场景渲染（6套沙盘）
// ============================================================
function renderScene() {
  const svg = document.getElementById('sceneCanvas');
  svg.innerHTML = '';
  switch(currentScene) {
    case 'earthquake':    renderEarthquake(svg); break;
    case 'floodTyphoon':  renderFloodTyphoon(svg); break;
    case 'fire':          renderFire(svg); break;
    case 'landslide':     renderLandslide(svg); break;
    case 'lightning':     renderLightning(svg); break;
    case 'heatCold':      renderHeatCold(svg); break;
  }
}

    <text x="675" y="305" class="item-label">室内保暖房屋（隔绝寒风）</text>

    <!-- 厚外套 -->
    <rect x="480" y="410" width="55" height="15" fill="#805ad5" rx="3" class="interactive" data-opt="coat"/>
    <text x="480" y="440" class="item-label">厚外套（保暖物资）</text>

    <!-- 防滑垫 -->
    <rect x="670" y="410" width="55" height="15" fill="#48bb78" rx="3" class="interactive" data-opt="coat"/>
    <text x="665" y="440" class="item-label">防滑垫（防滑物资）</text>

    <!-- 人物 -->
    <g data-char="1" transform="translate(570,330)">
      <circle cx="10" cy="8" r="8" fill="#fbd38d"/>
      <rect x="5" y="16" width="10" height="20" fill="#4299e1" rx="2"/>
      <rect x="3" y="36" width="5" height="12" fill="#2d3748" rx="1"/>
      <rect x="12" y="36" width="5" height="12" fill="#2d3748" rx="1"/>
    </g>
    <text x="555" y="365" class="char-label">人物（需防寒防滑）</text>
  `;
}

// ============================================================
//  交互逻辑 - 使用事件代理，解决SVG元素被遮挡点不动的问题
// ============================================================

let isDragging = false;
let dragChar = null;
let dragOffset = { x: 0, y: 0 };

// 在SVG上使用事件代理，点击任何元素都向上查找带data-opt的祖先
function setupSVGClick() {
  const svg = document.getElementById('sceneCanvas');
  
  svg.addEventListener('mousedown', function(e) {
    let target = e.target;
    while (target && target !== svg) {
      if (target.hasAttribute && target.hasAttribute('data-char')) {
        startDrag(target, e);
        return;
      }
      target = target.parentElement;
    }
    
    let optEl = e.target.closest('[data-opt]');
    if (optEl) {
      handleOption(optEl.getAttribute('data-opt'));
    }
  });
  
  svg.addEventListener('mousemove', function(e) {
    if (isDragging && dragChar) {
      doDrag(e);
    }
  });
  
  svg.addEventListener('mouseup', function(e) {
    if (isDragging && dragChar) {
      endDrag(e);
    }
  });
  
  svg.addEventListener('mouseleave', function() {
    if (isDragging && dragChar) {
      endDrag();
    }
  });
  
  svg.addEventListener('touchstart', function(e) {
    let touch = e.touches[0];
    let target = touch.target;
    while (target && target !== svg) {
      if (target.hasAttribute && target.hasAttribute('data-char')) {
        startDrag(target, touch);
        e.preventDefault();
        return;
      }
      target = target.parentElement;
    }
  });
  
  svg.addEventListener('touchmove', function(e) {
    if (isDragging && dragChar) {
      let touch = e.touches[0];
      doDrag(touch);
      e.preventDefault();
    }
  });
  
  svg.addEventListener('touchend', function(e) {
    if (isDragging && dragChar) {
      endDrag();
    }
  });
}

function startDrag(el, e) {
  dragChar = el;
  isDragging = true;
  
  const svg = document.getElementById('sceneCanvas');
  const rect = svg.getBoundingClientRect();
  const scaleX = svg.viewBox.baseVal.width / rect.width;
  const scaleY = svg.viewBox.baseVal.height / rect.height;
  
  const mouseX = (e.clientX - rect.left) * scaleX;
  const mouseY = (e.clientY - rect.top) * scaleY;
  
  const transform = el.getAttribute('transform');
  const match = transform && transform.match(/translate\(([^,]+),([^)]+)\)/);
  const charX = match ? parseFloat(match[1]) : 0;
  const charY = match ? parseFloat(match[2]) : 0;
  
  dragOffset.x = mouseX - charX;
  dragOffset.y = mouseY - charY;
  
  el.style.cursor = 'grabbing';
  el.style.opacity = '0.7';
}

function doDrag(e) {
  const svg = document.getElementById('sceneCanvas');
  const rect = svg.getBoundingClientRect();
  const scaleX = svg.viewBox.baseVal.width / rect.width;
  const scaleY = svg.viewBox.baseVal.height / rect.height;
  
  const mouseX = (e.clientX - rect.left) * scaleX;
  const mouseY = (e.clientY - rect.top) * scaleY;
  
  const newX = mouseX - dragOffset.x;
  const newY = mouseY - dragOffset.y;
  
  dragChar.setAttribute('transform', `translate(${newX},${newY})`);
}

function endDrag(e) {
  isDragging = false;
  dragChar.style.cursor = 'grab';
  dragChar.style.opacity = '1';
  
  const transform = dragChar.getAttribute('transform');
  const match = transform && transform.match(/translate\(([^,]+),([^)]+)\)/);
  const charX = match ? parseFloat(match[1]) + 15 : 0;
  const charY = match ? parseFloat(match[2]) + 20 : 0;
  
  const svg = document.getElementById('sceneCanvas');
  const zones = svg.querySelectorAll('[data-opt]');
  
  let hitZone = null;
  for (let zone of zones) {
    const zoneRect = zone.getBBox();
    if (charX >= zoneRect.x && charX <= zoneRect.x + zoneRect.width &&
        charY >= zoneRect.y && charY <= zoneRect.y + zoneRect.height) {
      hitZone = zone;
      break;
    }
  }
  
  if (hitZone) {
    handleOption(hitZone.getAttribute('data-opt'));
  }
  
  dragChar = null;
}

function moveChar(dx, dy) {
  const svg = document.getElementById('sceneCanvas');
  const charEl = svg.querySelector('[data-char]');
  if (!charEl) return;
  
  const transform = charEl.getAttribute('transform');
  const match = transform && transform.match(/translate\(([^,]+),([^)]+)\)/);
  let x = match ? parseFloat(match[1]) : 0;
  let y = match ? parseFloat(match[2]) : 0;
  
  x += dx;
  y += dy;
  
  x = Math.max(20, Math.min(800, x));
  y = Math.max(20, Math.min(480, y));
  
  charEl.setAttribute('transform', `translate(${x},${y})`);
  
  checkHitZone(x + 10, y + 15);
}

let lastHitZoneId = null;
let zoneCache = null;

function cacheZones() {
  const svg = document.getElementById('sceneCanvas');
  const zones = svg.querySelectorAll('[data-opt]');
  zoneCache = [];
  zones.forEach(zone => {
    const bbox = zone.getBBox();
    zoneCache.push({
      id: zone.getAttribute('data-opt'),
      x: bbox.x,
      y: bbox.y,
      width: bbox.width,
      height: bbox.height
    });
  });
}

function checkHitZone(charX, charY) {
  if (!zoneCache) cacheZones();
  
  let currentHit = null;
  for (let zone of zoneCache) {
    if (charX >= zone.x && charX <= zone.x + zone.width &&
        charY >= zone.y && charY <= zone.y + zone.height) {
      currentHit = zone.id;
      break;
    }
  }
  
  if (currentHit && currentHit !== lastHitZoneId) {
    lastHitZoneId = currentHit;
    handleOption(currentHit);
  } else if (!currentHit) {
    lastHitZoneId = null;
  }
}

document.addEventListener('keydown', function(e) {
  switch(e.key) {
    case 'ArrowUp':
    case 'w':
    case 'W':
      e.preventDefault();
      moveChar(0, -30);
      break;
    case 'ArrowDown':
    case 's':
    case 'S':
      e.preventDefault();
      moveChar(0, 30);
      break;
    case 'ArrowLeft':
    case 'a':
    case 'A':
      e.preventDefault();
      moveChar(-30, 0);
      break;
    case 'ArrowRight':
    case 'd':
    case 'D':
      e.preventDefault();
      moveChar(30, 0);
      break;
  }
});

function handleOption(optionId) {
  const scene = SCENES[currentScene];
  const step  = scene.steps[currentStep];
  const opt   = step.options.find(o => o.id === optionId);
  
  if (!opt) {
    showModal('error', '当前步骤暂不需要此操作，请按照下方步骤提示操作。');
    return;
  }

  if (opt.correct) {
    showModal('success', '【正确操作】' + opt.feedback.replace('【正确操作】',''));
    stepHistory.push(currentStep);
    if (opt.next >= 0 && opt.next < scene.steps.length) {
      currentStep = opt.next;
      updateStepBar();
    }
  } else {
    showModal('error', '【错误操作】' + opt.feedback.replace('【错误操作】',''));
  }
}

function showModal(type, text) {
  const modal = document.getElementById('modal');
  const box   = document.getElementById('modalBox');
  const tag   = document.getElementById('modalTag');
  const title = document.getElementById('modalTitle');
  const body  = document.getElementById('modalText');
  const btn   = document.getElementById('modalBtn');

  box.className = 'modal-box ' + type;
  if (type === 'success') {
    tag.textContent = '✅ 正确操作';
    title.textContent = '操作正确，进入下一步';
    btn.style.background = '#38a169';
  } else {
    tag.textContent = '❌ 错误操作';
    title.textContent = '危险！请重新选择';
    btn.style.background = '#e53e3e';
  }
  body.textContent = text;
  modal.classList.add('active');
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

function prevStep() {
  if (stepHistory.length > 0) {
    currentStep = stepHistory.pop();
    lastHitZoneId = null;
    zoneCache = null;
    updateStepBar();
    renderScene();
    cacheZones();
  }
}

function resetScene() {
  currentStep = 0;
  stepHistory = [];
  lastHitZoneId = null;
  updateStepBar();
  renderScene();
}

function showHint() {
  const scene = SCENES[currentScene];
  const step  = scene.steps[currentStep];
  const correct = step.options.find(o => o.correct);
  if (correct) {
    showModal('success', '💡 提示：请选择 "' + correct.text + '"');
  }
}

window.onload = function() {
  setupSVGClick();
  init();
};
</script>
