            border: 1px solid rgba(160,180,200,0.3);
            box-shadow: inset 0 0 8px rgba(100,150,200,0.1);
        }
        .cover-test-tube::after {
            content: ''; position: absolute; bottom: 2px; left: 2px;
            width: 8px; height: 18px;
            background: linear-gradient(180deg, rgba(80,160,80,0.4) 0%, rgba(60,120,60,0.25) 100%);
            border-radius: 0 0 4px 4px;
        }

        /* 古老羊皮地图 */
        .cover-old-map {
            position: absolute; z-index: 7; pointer-events: none;
        }
        .cover-old-map-1 { bottom: 20%; left: 14%; transform: rotate(-15deg); }
        .cover-old-map-2 { bottom: 18%; right: 14%; transform: rotate(10deg); }
        .cover-old-map::before {
            content: ''; position: absolute;
            width: 65px; height: 50px;
            background: linear-gradient(145deg, rgba(200,180,140,0.45) 0%, rgba(180,160,120,0.3) 50%, rgba(160,140,100,0.2) 100%);
            border-radius: 3px;
            border: 1px solid rgba(160,140,100,0.3);
            box-shadow: 0 2px 6px rgba(0,0,0,0.2), inset 0 0 10px rgba(0,0,0,0.1);
        }
        .cover-old-map::after {
            content: ''; position: absolute; top: 4px; left: 4px; right: 4px; bottom: 4px;
            background:
                linear-gradient(0deg, transparent 0px, rgba(140,120,80,0.15) 1px, transparent 2px, transparent 10px),
                linear-gradient(90deg, transparent 0px, rgba(140,120,80,0.1) 1px, transparent 2px, transparent 12px);
            border: 1px solid rgba(140,120,80,0.15);
        }

        /* 锈蚀铁钥匙 */
        .cover-rusty-key {
            position: absolute; z-index: 7; pointer-events: none;
            bottom: 14%; left: 50%; transform: translateX(-50%);
            width: 40px; height: 55px;
        }
        .cover-rusty-key::before {
            content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 18px; height: 18px;
            border: 3px solid rgba(160,140,100,0.5);
            border-radius: 50%;
            box-shadow: inset 0 0 4px rgba(0,0,0,0.3);
        }
        .cover-rusty-key::after {
            content: ''; position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
            width: 4px; height: 35px;
            background: linear-gradient(180deg, rgba(160,140,100,0.5) 0%, rgba(120,100,70,0.3) 100%);
            border-radius: 0 0 1px 1px;
            box-shadow: 8px 20px 0 2px rgba(160,140,100,0.3), 8px 28px 0 2px rgba(160,140,100,0.2);
        }

        /* 蜡烛残骸 */
        .cover-candle-stub {
            position: absolute; z-index: 7; pointer-events: none; opacity: 0.55;
        }
        .cover-candle-stub-1 { bottom: 35%; left: 30%; }
        .cover-candle-stub-2 { bottom: 38%; right: 30%; }
        .cover-candle-stub-3 { bottom: 30%; left: 45%; }
        .cover-candle-stub::before {
            content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 8px; height: 18px;
            background: linear-gradient(180deg, #d4c8b0 0%, #b8a890 100%);
            border-radius: 2px 2px 1px 1px;
        }
        .cover-candle-stub::after {
            content: ''; position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
            width: 2px; height: 4px;
            background: #3a2a1a; border-radius: 1px;
        }

        /* 水滴/潮湿效果 */
        .cover-drip {
            position: absolute; z-index: 6; pointer-events: none;
            width: 5px; border-radius: 0 0 5px 5px;
            background: linear-gradient(180deg, rgba(120,160,200,0.45) 0%, rgba(120,160,200,0.08) 100%);
            animation: dripFall 4s ease-in infinite;
            box-shadow: 0 0 3px rgba(120,160,200,0.25);
        }
        .cover-drip-1 { top: 0; left: 20%; height: 40px; animation-delay: 0s; }
        .cover-drip-2 { top: 0; left: 45%; height: 35px; animation-delay: 1.5s; }
        .cover-drip-3 { top: 0; right: 30%; height: 45px; animation-delay: 3s; }
        .cover-drip-4 { top: 0; right: 55%; height: 30px; animation-delay: 2s; }
        @keyframes dripFall {
            0% { opacity: 0; transform: translateY(-10px); }
            20% { opacity: 0.5; }
            80% { opacity: 0.3; }
            100% { opacity: 0; transform: translateY(80px); }
        }

        /* 裂缝纹理 */
        .cover-crack {
            position: absolute; z-index: 5; pointer-events: none;
            background: linear-gradient(170deg, rgba(30,20,12,0.4) 0%, transparent 100%);
        }
        .cover-crack-1 { top: 10%; left: 0; width: 80px; height: 3px; transform: rotate(25deg); }
        .cover-crack-2 { bottom: 20%; right: 0; width: 60px; height: 2px; transform: rotate(-20deg); }
        .cover-crack-3 { top: 50%; left: 0; width: 50px; height: 2px; transform: rotate(35deg); }
        .cover-crack-4 { top: 30%; right: 0; width: 70px; height: 3px; transform: rotate(-15deg); }

        /* 灰尘粒子层 */
        .cover-dust {
            position: absolute; z-index: 6; pointer-events: none;
            width: 100%; height: 100%;
            background:
                radial-gradient(1px 1px at 10% 20%, rgba(200,180,160,0.15) 0%, transparent 100%),
                radial-gradient(1px 1px at 25% 45%, rgba(200,180,160,0.1) 0%, transparent 100%),
                radial-gradient(1px 1px at 40% 15%, rgba(200,180,160,0.12) 0%, transparent 100%),
                radial-gradient(1px 1px at 55% 60%, rgba(200,180,160,0.08) 0%, transparent 100%),
                radial-gradient(1px 1px at 70% 30%, rgba(200,180,160,0.1) 0%, transparent 100%),
                radial-gradient(1px 1px at 85% 55%, rgba(200,180,160,0.12) 0%, transparent 100%),
                radial-gradient(1px 1px at 15% 75%, rgba(200,180,160,0.08) 0%, transparent 100%),
                radial-gradient(1px 1px at 60% 80%, rgba(200,180,160,0.1) 0%, transparent 100%),
                radial-gradient(1px 1px at 90% 10%, rgba(200,180,160,0.12) 0%, transparent 100%),
                radial-gradient(1px 1px at 35% 90%, rgba(200,180,160,0.08) 0%, transparent 100%);
            animation: dustDrift 20s linear infinite;
        }
        @keyframes dustDrift {
            0% { transform: translate(0, 0); }
            50% { transform: translate(5px, 3px); }
            100% { transform: translate(0, 0); }
        }

        /* 铁栏杆 */
        .cover-iron-bars {
            position: absolute; z-index: 5; pointer-events: none; opacity: 0.35;
        }
        .cover-iron-bars-left { left: 0; top: 10%; width: 35px; height: 50%; }
        .cover-iron-bars-right { right: 0; top: 10%; width: 35px; height: 50%; }
        .cover-iron-bars::before {
            content: ''; position: absolute; inset: 0;
            background: repeating-linear-gradient(90deg,
                rgba(100,85,68,0.9) 0px, rgba(80,65,48,0.7) 5px,
                transparent 5px, transparent 12px
            );
            border-right: 2px solid rgba(100,85,68,0.4);
        }

        /* cover torch click effect */
        .cover-torch {
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .cover-torch:active .torch-flame {
            transform: scale(1.4);
            transition: transform 0.15s ease;
        }
        .cover-torch .torch-flame {
            transition: transform 0.3s ease;
        }
        /* cover mouse light effect layer */
        .cover-mouse-light {
            position: absolute; inset: 0;
            z-index: 4; pointer-events: none;
            transition: background 0.3s ease;
        }
        /* floating particles */
        .cover-particle {
            position: absolute;
            width: 3px; height: 3px;
            background: radial-gradient(circle, rgba(200,167,117,0.8) 0%, rgba(200,167,117,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
            animation: particleFloat linear infinite;
        }
        @keyframes particleFloat {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(40px); opacity: 0; }
        }
        /* timer/steps bar in game page */
        .game-stats {
            display: flex; gap: 20px; justify-content: center;
            margin-bottom: 12px; width: 100%; max-width: 700px; padding: 0 10px;
        }
        .game-stat-item {
            background: linear-gradient(145deg, #2a1f16 0%, #241a12 100%);
            border: 1px solid var(--stitch);
            border-radius: 8px;
            padding: 6px 16px;
            font-size: 0.85em;
            color: var(--gold-foil);
            display: flex; align-items: center; gap: 6px;
            box-shadow: inset 0 0 0 1px var(--stitch), 0 2px 6px rgba(0,0,0,0.3);
        }
        .game-stat-item .stat-icon { font-size: 1em; }
        .game-stat-item .stat-value { font-family: 'Cinzel', serif; font-weight: bold; }
        /* progress bar in level select */
        .progress-bar-container {
            max-width: 900px; width: 100%; padding: 0 10px; margin-bottom: 20px;
        }
        .progress-bar-outer {
            background: linear-gradient(145deg, #2a1f16 0%, #241a12 100%);
            border: 1px solid var(--stitch);
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
            box-shadow: inset 0 0 0 1px var(--stitch), 0 2px 6px rgba(0,0,0,0.3);
            position: relative;
        }
        .progress-bar-inner {
            height: 100%;
            background: linear-gradient(90deg, var(--gold-foil) 0%, #d4b888 50%, var(--gold-foil) 100%);
            border-radius: 10px;
            transition: width 0.5s ease;
            box-shadow: 0 0 10px rgba(200,167,117,0.3);
        }
        .progress-bar-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 0.7em; color: var(--cashmere); text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            font-family: 'Cinzel', serif;
        }
        /* settings button */
        .settings-btn {
            position: fixed; top: 16px; right: 16px;
            background: rgba(50,39,30,0.7);
            color: var(--cashmere-dim);
            border: 1px solid var(--stitch);
            padding: 8px 12px; border-radius: 6px;
            cursor: pointer; font-size: 1.2em;
            transition: all 0.3s;
            z-index: 500;
        }
        .settings-btn:hover { background: rgba(50,39,30,0.9); color: var(--cashmere); border-color: var(--stitch-light); }
        /* star display in level cards */
        .level-stars-earned { font-size: 0.75em; color: var(--gold-foil); }
        /* victory stars display */
        .victory-stars { font-size: 2.5em; margin: 12px 0; }
        .victory-stats { color: var(--cashmere-dim); font-size: 0.9em; margin-bottom: 16px; }
        /* scene icons */
        .scene-icon { margin-right: 6px; }

</head>

// ==================== Toast提示系统 ====================
let toastTimer = null;
function showToast(msg, duration = 2500) {
    const t = document.getElementById('toast');

    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), duration);

// ==================== 弹窗系统 ====================
function showModal(html) {

function hideModal() {

// ==================== 视图切换 ====================
function showView(viewName) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-' + viewName).classList.add('active');
    // 隐藏封面页（进入游戏视图时）
    const cover = document.getElementById('cover-page');
    if (cover && viewName !== 'cover') {
        cover.style.display = 'none';
    }
    // 显示/隐藏古墓装饰层
    const tombDecor = document.getElementById('tomb-decor-layer');
    if (tombDecor) {
        tombDecor.style.display = (viewName === 'cover') ? 'none' : 'block';
        // 生成浮尘粒子（只生成一次）
        if (viewName !== 'cover' && !document.querySelector('.tomb-dust-particle')) {
            const dustContainer = document.getElementById('tomb-dust-container');
            if (dustContainer) {
                for (let i = 0; i < 15; i++) {
                    const p = document.createElement('div');
                    p.className = 'tomb-dust-particle';
                    p.style.left = Math.random() * 100 + '%';
                    p.style.top = (60 + Math.random() * 40) + '%';
                    p.style.animationDuration = (12 + Math.random() * 20) + 's';
                    p.style.animationDelay = (Math.random() * 15) + 's';
                    p.style.width = (1 + Math.random() * 2) + 'px';
                    p.style.height = p.style.width;
                    dustContainer.appendChild(p);
                }
            }
        }
    }
    hideModal();
    if (viewName === 'select') {
        // 停止计时器
        if (state.timerInterval) {
            clearInterval(state.timerInterval);
            state.timerInterval = null;
        }
        renderLevelSelect();
    } else if (viewName === 'game') {
        playEnterLevelSound();
        renderGame();
    }
}

// ==================== 进度保存/加载 ====================
function saveProgress() {
    const data = {
        completedLevels: state.completedLevels,
        currentLevel: state.currentLevel
    };
    localStorage.setItem('escape_room_progress', JSON.stringify(data));
}
function loadProgress() {
    try {
        const data = JSON.parse(localStorage.getItem('escape_room_progress'));
        if (data) {
            state.completedLevels = data.completedLevels || [];
            state.currentLevel = data.currentLevel || null;
        }
    } catch(e) {
        state.completedLevels = [];
        state.currentLevel = null;
    }
}

// ==================== 扩展数据保存/加载 ====================
function saveExtendedData() {
    const data = {
        achievements: state.achievements,
        hintCoins: state.hintCoins,
        bestTimes: state.bestTimes,
        totalRoomsExplored: state.totalRoomsExplored,
        totalItemsCollected: state.totalItemsCollected,
        totalCombines: state.totalCombines,
        dailyCompleted: state.dailyCompleted,
        dailyDate: state.dailyDate
    };
    localStorage.setItem('escape_room_extended', JSON.stringify(data));
}
function loadExtendedData() {
    try {
        const data = JSON.parse(localStorage.getItem('escape_room_extended'));
        if (data) {
            state.achievements = data.achievements || [];
            state.hintCoins = data.hintCoins !== undefined ? data.hintCoins : 10;
            state.bestTimes = data.bestTimes || {};
            state.totalRoomsExplored = data.totalRoomsExplored || 0;
            state.totalItemsCollected = data.totalItemsCollected || 0;
            state.totalCombines = data.totalCombines || 0;
            state.dailyCompleted = data.dailyCompleted || false;
            state.dailyDate = data.dailyDate || null;
            // 检查是否是新的一天
            const today = new Date().toDateString();
            if (state.dailyDate !== today) {
                state.dailyCompleted = false;
                state.dailyDate = today;
            }
        }
    } catch(e) {
        state.achievements = [];
        state.hintCoins = 10;
        state.bestTimes = {};
        state.totalRoomsExplored = 0;
        state.totalItemsCollected = 0;
        state.totalCombines = 0;
        state.dailyCompleted = false;
        state.dailyDate = new Date().toDateString();
    }
}

// ==================== 成就系统 ====================
function checkAchievements() {
    let newlyUnlocked = [];
    achievements.forEach(ach => {
        if (!state.achievements.includes(ach.id) && ach.condition()) {
            state.achievements.push(ach.id);
            newlyUnlocked.push(ach);
        }
    });
    if (newlyUnlocked.length > 0) {
        saveExtendedData();
        newlyUnlocked.forEach((ach, idx) => {
            setTimeout(() => {
                playAchievementSound();
                showToast(`\uD83C\uDF89 解锁成就：${ach.icon} ${ach.name}`, 3000);
            }, idx * 800);
        });
    }
}

function playAchievementSound() {
    if (!state.soundEnabled) return;
    try {
        const ctx = getAudioCtx();
        const t = ctx.currentTime;
        // 成就解锁：远处传来的空洞钟声
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(400, t);
        osc.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(180, t);
        gain.gain.setValueAtTime(0.08 * MASTER_VOLUME, t);
        gain.gain.linearRampToValueAtTime(0.03 * MASTER_VOLUME, t + 0.5);
        gain.gain.linearRampToValueAtTime(0, t + 1.2);
        osc.start(t);
        osc.stop(t + 1.2);
        // 混响尾音：粉噪声
        const noise = createPinkNoiseBuffer(ctx, 1.0);
        playNoise(ctx, noise, t + 0.3, 0.8, 0.04, 200, 'lowpass');
    } catch(e) {}
}

// ==================== 星级数据保存/加载 ====================
function saveStarData() {
    localStorage.setItem('escape_room_stars', JSON.stringify(state.starData));
}
function loadStarData() {
    try {
        const data = JSON.parse(localStorage.getItem('escape_room_stars'));
        if (data) state.starData = data;
    } catch(e) {
        state.starData = {};
    }
}

// ==================== 关卡选择页渲染 ====================
const sceneIcons = {'书房': '\uD83D\uDCD6', '储藏室': '\uD83D\uDCE6', '书房\u00B7深处': '\uD83D\uDCDA', '阁楼': '\uD83C\uDFE0', '地下室': '\uD83E\uDDF1', '古墓·内殿': '\uD83D\uDDC4\uFE0F', '古墓·主墓室': '\u26E9\uFE0F'};

function renderLevelSelect() {
    const grid = document.getElementById('level-grid');
    grid.innerHTML = '';

    // 更新进度条
    const completedCount = state.completedLevels.length;
    const totalLevels = levels.length;
    const barInner = document.getElementById('progress-bar-inner');
    const barText = document.getElementById('progress-bar-text');
    if (barInner) barInner.style.width = (completedCount / totalLevels * 100) + '%';
    if (barText) barText.textContent = completedCount + ' / ' + totalLevels;

    // 按场景分组
    const scenes = {};
    levels.forEach(level => {
        if (!scenes[level.scene]) scenes[level.scene] = [];
        scenes[level.scene].push(level);
    });

    Object.entries(scenes).forEach(([sceneName, sceneLevels]) => {
        // 场景标题（带图标）
        const header = document.createElement('div');
        header.style.cssText = 'grid-column: 1 / -1; text-align: center; padding: 16px 0 8px; color: var(--gold-foil); font-family: "Cinzel", "Noto Serif SC", serif; font-size: 1.1em; letter-spacing: 4px; text-shadow: 0 1px 2px rgba(0,0,0,0.5); margin-bottom: 8px; position: relative;';
        const icon = sceneIcons[sceneName] || '';
        header.innerHTML = '<div class="tomb-title-deco"><span style="opacity:0.5">☥</span></div><span class="scene-icon">' + icon + '</span> ' + sceneName + '<div class="tomb-title-deco"><span style="opacity:0.5">☥</span></div>';
        grid.appendChild(header);

        // 该场景的关卡
        sceneLevels.forEach(level => {
            const isCompleted = state.completedLevels.includes(level.id);
            const isAvailable = !isCompleted && (level.id === 1 || state.completedLevels.includes(level.id - 1));
            const isLocked = !isCompleted && !isAvailable;

            const card = document.createElement('div');
            card.className = 'level-card' + (isCompleted ? ' completed' : isAvailable ? ' available' : ' locked');

            // 显示获得的星级（替代固定stars）
            let starsDisplay = '';
            if (isCompleted) {
                const earned = state.starData[level.id] || 1;
                starsDisplay = '\u2B50'.repeat(earned) + '\u2606'.repeat(3 - earned);
            } else {
                starsDisplay = level.stars;
            }

            // 显示最佳时间
            let bestTimeHtml = '';
            if (state.bestTimes[level.id]) {
                const bt = state.bestTimes[level.id];
                const bm = Math.floor(bt.time / 60).toString().padStart(2, '0');
                const bs = (bt.time % 60).toString().padStart(2, '0');
                bestTimeHtml = `<div class="level-best-time">\uD83C\uDFC6 ${bm}:${bs}</div>`;
            }

            card.innerHTML = `
                <div class="level-num">${level.id}</div>
                <div class="level-name">${level.name}</div>
                <div class="level-stars-earned">${starsDisplay}</div>
                ${bestTimeHtml}
            `;
            if (!isLocked) {
                card.addEventListener('click', () => startLevel(level.id));
            } else {
                card.addEventListener('click', () => showToast('请先完成前一关'));
            }
            grid.appendChild(card);
        });
    });
}

// ==================== 开始关卡 ====================
function startLevel(levelId) {
    const level = levels.find(l => l.id === levelId);
    if (!level) return;

    // 重置游戏状态
    state.currentLevel = levelId;
    state.inventory = [];
    state.clues = [];
    state.selectedItem = null;
    state.timer = 0;
    state.steps = 0;
    // 深拷贝房间数据
    state.rooms = JSON.parse(JSON.stringify(level.rooms));

    // 启动计时器
    if (state.timerInterval) clearInterval(state.timerInterval);
    state.timerInterval = setInterval(() => {
        state.timer++;
        const m = Math.floor(state.timer / 60).toString().padStart(2, '0');
        const s = (state.timer % 60).toString().padStart(2, '0');
        const el = document.getElementById('timer-display');
        if (el) el.textContent = m + ':' + s;
    }, 1000);

    // 更新步数显示
    const stepsEl = document.getElementById('steps-display');
    if (stepsEl) stepsEl.textContent = '0';

    updateHintCoinsDisplay();
    saveProgress();
    playStartLevelSound();
    showView('game');
}

// ==================== 游戏页渲染 ====================
function renderGame() {
    const level = levels.find(l => l.id === state.currentLevel);
    if (!level) return;

    // 渲染头部信息
    document.getElementById('level-title').innerHTML = `<div class="tomb-title-deco"><span style="opacity:0.5">☥</span></div>第${level.id}关：${level.name}<div class="tomb-title-deco"><span style="opacity:0.5">☥</span></div>`;
    document.getElementById('level-subtitle').textContent = level.subtitle;
    document.getElementById('level-hint').textContent = '💡 ' + level.hint;

    renderRoomCards();
    renderInventory();
    renderClues();
}

// ==================== 区域卡牌渲染 ====================
function renderRoomCards() {
    const grid = document.getElementById('room-grid');
    grid.innerHTML = '';
    state.rooms.forEach(room => {
        const card = document.createElement('div');
        const isDoor = room.id === 'door';
        let classes = 'room-card';
        if (isDoor) classes += ' door-card';
        if (room.locked) classes += ' locked';
        if (room.explored) classes += ' explored';
        card.className = classes;

        let lockBadge = '';
        if (room.locked && !room.explored) {
            if (room.lockType === 'key') lockBadge = '<div class="lock-badge">🔑</div>';
            else if (room.lockType === 'password') lockBadge = '<div class="lock-badge">🔢</div>';
            else if (room.lockType === 'sequence') lockBadge = '<div class="lock-badge">🧩</div>';
            else if (room.lockType === 'color') lockBadge = '<div class="lock-badge">🎨</div>';
            else if (room.lockType === 'item') lockBadge = '<div class="lock-badge">📦</div>';
            else if (room.lockType === 'multiItem') lockBadge = '<div class="lock-badge">⚙️</div>';
        }

        card.innerHTML = `
            ${lockBadge}
            <div class="room-icon">${room.icon}</div>
            <div class="room-name">${room.name}</div>
            <div class="room-desc">${room.explored ? '已探索' : room.description}</div>
        `;

        card.addEventListener('click', () => handleRoomClick(room));
        grid.appendChild(card);
    });
}

// ==================== 物品栏渲染 ====================
function renderInventory() {
    const slots = document.getElementById('inventory-slots');
    slots.innerHTML = '';
    for (let i = 0; i < state.maxInventory; i++) {
        const slot = document.createElement('div');
        if (i < state.inventory.length) {
            const item = state.inventory[i];
            slot.className = 'inv-slot' + (state.selectedItem === item.name ? ' selected' : '');
            slot.innerHTML = `
                <div class="item-icon">${item.icon}</div>
                <div class="item-name">${item.name}</div>
            `;
            slot.title = item.description;
            slot.addEventListener('click', () => handleItemClick(item.name));
        } else {
            slot.className = 'inv-slot empty';
            slot.innerHTML = '<div class="item-icon">·</div>';
        }
        slots.appendChild(slot);
    }
    // 更新组合提示
    const hint = document.getElementById('combine-hint');
    if (state.selectedItem) {
        hint.textContent = `已选择「${state.selectedItem}」，请点击另一个物品进行组合`;
        hint.className = 'combine-hint active';
    } else {
        hint.textContent = '点击物品选中，再点击另一个物品尝试组合';
        hint.className = 'combine-hint';
    }
}

// ==================== 线索列表渲染 ====================
function renderClues() {
    const list = document.getElementById('clue-list');
    if (state.clues.length === 0) {
        list.innerHTML = '<div class="clue-empty">暂无线索，探索房间来获取线索吧。</div>';
    } else {
        list.innerHTML = state.clues.map(c => `<div class="clue-item">📌 ${c}</div>`).join('');
    }
}

// ==================== 房间点击处理 ====================
function handleRoomClick(room) {
    if (room.explored) {
        if (room.multiExplore && room.exploreCount < room.maxExplores) {
            exploreRoom(room);
        } else {
            showToast('这个区域已经探索过了。');
        }
        return;
    }

    if (room.locked) {
        handleLock(room);
    } else {
        exploreRoom(room);
    }
}

// ==================== 探索房间 ====================
function exploreRoom(room) {
    room.explored = true;
    room.exploreCount++;
    state.steps++;
    state.totalRoomsExplored++;
    const stepsEl = document.getElementById('steps-display');
    if (stepsEl) stepsEl.textContent = state.steps;
    playExploreSound();

    // 添加掉落物品
    let foundItems = [];
    room.drops.forEach(drop => {
        if (state.inventory.length < state.maxInventory) {
            state.inventory.push({ name: drop.name, icon: drop.icon, description: drop.description });
            foundItems.push(drop.name);
            state.totalItemsCollected++;
        } else {
            showToast('物品栏已满！无法获取「' + drop.name + '」');
        }
    });

    // 添加线索
    room.clues.forEach(clue => {
        if (!state.clues.includes(clue)) {
            state.clues.push(clue);
        }
    });

    // 显示探索结果
    let msg = `你仔细搜索了「${room.name}」。\n`;
    if (foundItems.length > 0) {
        msg += `获得了：${foundItems.join('、')}`;
    } else {
        msg += '这里没有发现有用的东西。';
    }

    // 如果是大门且已解锁，触发通关
    if (room.id === 'door') {
        triggerWin();
        return;
    }

    showModal(`
        <button class="modal-close" onclick="hideModal()">&times;</button>
        <div class="modal-title">${room.icon} ${room.name}</div>
        <div class="modal-message">${msg.replace(/\n/g, '<br>')}</div>
        <div class="modal-buttons">
            <button class="btn-primary" onclick="hideModal()">确定</button>
        </div>
    `);

    renderRoomCards();
    renderInventory();
    renderClues();
}

// ==================== 锁处理 ====================
function handleLock(room) {
    switch (room.lockType) {
        case 'key': handleKeyLock(room); break;
        case 'password': handlePasswordLock(room); break;
        case 'sequence': handleSequenceLock(room); break;
        case 'color': handleColorLock(room); break;
        case 'item': handleItemLock(room); break;
        case 'multiItem': handleMultiItemLock(room); break;
    }
}

// ----- key锁 -----
function handleKeyLock(room) {
    const hasItem = state.inventory.some(i => i.name === room.requiredItem);
    if (hasItem) {
        showModal(`
            <button class="modal-close" onclick="hideModal()">&times;</button>
            <div class="modal-title">🔑 使用钥匙</div>
            <div class="modal-message">你用「${room.requiredItem}」打开了「${room.name}」的锁！</div>
            <div class="modal-buttons">
                <button class="btn-primary" onclick="unlockRoom('${room.id}', 'key')">确定</button>
            </div>
        `);
    } else {
        showModal(`
            <button class="modal-close" onclick="hideModal()">&times;</button>
            <div class="modal-title">🔒 锁住了</div>
            <div class="modal-message">「${room.name}」被锁住了。<br>你需要找到「${room.requiredItem}」才能打开。</div>
            <div class="modal-buttons">
                <button class="btn-secondary" onclick="hideModal()">知道了</button>
            </div>
        `);
    }
}

// ----- password锁 -----
function handlePasswordLock(room) {
    const len = room.passwordLength || 4;
    let inputs = '';
    for (let i = 0; i < len; i++) {
        inputs += `<input type="text" maxlength="1" class="pwd-digit" data-index="${i}" inputmode="numeric" pattern="[0-9]">`;
    }
    showModal(`
        <button class="modal-close" onclick="hideModal()">&times;</button>
        <div class="modal-title">🔢 输入密码</div>
        <div class="modal-message">${room.passwordHint || '请输入密码。'}</div>
        <div class="password-inputs" id="pwd-inputs">${inputs}</div>
        <div class="password-hint">密码长度：${len}位数字</div>
        <div class="modal-buttons">
            <button class="btn-primary" id="btn-pwd-submit" onclick="submitPassword('${room.id}')">确认</button>
            <button class="btn-secondary" onclick="hideModal()">取消</button>
        </div>
    `);

    // 绑定输入事件
    setTimeout(() => {
        const digits = document.querySelectorAll('.pwd-digit');
        digits.forEach((input, idx) => {
            input.addEventListener('input', function() {
                // 只允许数字
                this.value = this.value.replace(/[^0-9]/g, '');
                if (this.value && idx < len - 1) {
                    digits[idx + 1].focus();
                }
            });
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && !this.value && idx > 0) {
                    digits[idx - 1].focus();
                }
                if (e.key === 'Enter') {
                    submitPassword(room.id);
                }
            });
        });
        if (digits.length > 0) digits[0].focus();
    }, 100);
}

function submitPassword(roomId) {
    const digits = document.querySelectorAll('.pwd-digit');
    let pwd = '';
    digits.forEach(d => pwd += d.value);
    const room = state.rooms.find(r => r.id === roomId);
    if (!room) return;

    if (pwd.length < room.passwordLength) {
        showToast('请输入完整的密码');
        return;
    }

    if (pwd === room.password) {
        playPasswordCorrect();
        // Add correct flash animation
        document.querySelectorAll('.pwd-digit').forEach(d => d.classList.add('pwd-correct'));
        setTimeout(() => {
            hideModal();
            unlockRoom(roomId, 'password');
        }, 400);
        return;
    } else {
        playPasswordWrong();
        showToast('密码错误，请重试');
        digits.forEach(d => { d.value = ''; d.style.borderColor = 'var(--danger)'; });
        setTimeout(() => {
            digits.forEach(d => d.style.borderColor = '');
            if (digits.length > 0) digits[0].focus();
        }, 500);
    }
}

// ----- sequence锁 -----
function handleSequenceLock(room) {
    const correctSeq = room.sequence || [];
    // 打乱顺序显示
    const shuffled = [...correctSeq].sort(() => Math.random() - 0.5);
    let btns = shuffled.map(s => `<button class="seq-btn" data-symbol="${s}" onclick="handleSeqClick(this, '${room.id}')">${s}</button>`).join('');

    showModal(`
        <button class="modal-close" onclick="hideModal()">&times;</button>
        <div class="modal-title">🧩 符号序列</div>
        <div class="modal-message">${room.sequenceHint || '按照正确的顺序点击符号。'}</div>
        <div class="sequence-grid" id="seq-grid">${btns}</div>
        <div class="seq-progress" id="seq-progress">已选择：0 / ${correctSeq.length}</div>
        <div class="modal-buttons">
            <button class="btn-secondary" onclick="hideModal()">取消</button>
        </div>
    `);

    // 初始化序列状态
    window._seqState = { roomId: room.id, correct: correctSeq, current: [], total: correctSeq.length };
}

function handleSeqClick(btn, roomId) {
    const ss = window._seqState;
    if (!ss || ss.roomId !== roomId) return;

    const symbol = btn.dataset.symbol;
    const expectedIndex = ss.current.length;
    const expected = ss.correct[expectedIndex];

    if (symbol === expected) {
        // 正确
        btn.classList.add('correct');
        btn.style.pointerEvents = 'none';
        ss.current.push(symbol);
        document.getElementById('seq-progress').textContent = `已选择：${ss.current.length} / ${ss.total}`;

        if (ss.current.length === ss.total) {
            // 全部正确
            setTimeout(() => {
                hideModal();
                unlockRoom(roomId, 'sequence');
            }, 500);
        }
    } else {
        // 错误，重置
        btn.classList.add('wrong');
        setTimeout(() => {
            // 重置所有按钮
            document.querySelectorAll('.seq-btn').forEach(b => {
                b.classList.remove('correct', 'wrong');
                b.style.pointerEvents = '';
            });
            ss.current = [];
            document.getElementById('seq-progress').textContent = `已选择：0 / ${ss.total}`;
            showToast('顺序错误，请重试');
        }, 600);
    }
}

// ----- color锁 -----
function handleColorLock(room) {
    const colors = room.colors || [
        { name: '红色', value: '#e74c3c' },
        { name: '蓝色', value: '#3498db' },
        { name: '绿色', value: '#2ecc71' },
        { name: '黄色', value: '#f1c40f' },
        { name: '紫色', value: '#9b59b6' }
    ];
    const correctColor = room.correctColor || '红色';
    const len = room.colorLength || 3;

    let btns = colors.map(c => `<button class="color-btn" data-color="${c.name}" style="background:${c.value}" onclick="handleColorClick(this, '${room.id}')"></button>`).join('');
    let slots = '';
    for (let i = 0; i < len; i++) {
        slots += `<div class="color-seq-slot" data-slot="${i}"></div>`;
    }

    showModal(`
        <button class="modal-close" onclick="hideModal()">&times;</button>
        <div class="modal-title">🎨 颜色密码</div>
        <div class="modal-message">${room.colorHint || '选择正确的颜色组合。'}</div>
        <div class="color-sequence" id="color-seq">${slots}</div>
        <div class="color-grid">${btns}</div>
        <div class="modal-buttons">
            <button class="btn-secondary" onclick="resetColorSeq('${room.id}')">重置</button>
            <button class="btn-secondary" onclick="hideModal()">取消</button>
        </div>
    `);

    window._colorState = { roomId: room.id, correct: correctColor, selected: [], length: len };
}

function handleColorClick(btn, roomId) {
    const cs = window._colorState;
    if (!cs || cs.roomId !== roomId) return;
    if (cs.selected.length >= cs.length) return;

    const color = btn.dataset.color;
    cs.selected.push(color);
    btn.classList.add('selected');

    // 填充槽位
    const slots = document.querySelectorAll('.color-seq-slot');
    const slot = slots[cs.selected.length - 1];
    const colorObj = document.querySelector(`.color-btn[data-color="${color}"]`);
    slot.style.background = colorObj.style.background;
    slot.classList.add('filled');
}

function resetColorSeq(roomId) {
    const cs = window._colorState;
    if (!cs) return;
    cs.selected = [];
    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
    document.querySelectorAll('.color-seq-slot').forEach(s => {
        s.style.background = '';
        s.classList.remove('filled');
    });
}

// ----- item锁 -----
function handleItemLock(room) {

// ----- multiItem锁 -----
function handleMultiItemLock(room) {
    const requiredItems = room.requiredItems || [];
    let allHave = true;
    let rows = requiredItems.map(name => {
        const has = state.inventory.some(i => i.name === name);
        if (!has) allHave = false;
        const item = state.inventory.find(i => i.name === name);
        const icon = has ? (item ? item.icon : '❓') : '❓';
        return `
            <div class="multi-item-row ${has ? 'has' : 'missing'}">
                <span class="mi-icon">${icon}</span>
                <span class="mi-name">${name}</span>
                <span class="mi-status">${has ? '✓' : '✗'}</span>
            </div>
        `;
    }).join('');

    let actionBtn = '';
    if (allHave) {
        actionBtn = `<button class="btn-primary" onclick="unlockRoom('${room.id}', 'multiItem')">安装并解锁</button>`;
    } else {
        actionBtn = `<button class="btn-primary" disabled>缺少物品，无法解锁</button>`;
    }

    showModal(`
        <button class="modal-close" onclick="hideModal()">&times;</button>

        <div class="multi-item-list">${rows}</div>
        <div class="modal-buttons">
            ${actionBtn}
            <button class="btn-secondary" onclick="hideModal()">取消</button>
        </div>
    `);
}

// ==================== 解锁房间 ====================
function unlockRoom(roomId, lockType) {
    const room = state.rooms.find(r => r.id === roomId);
    if (!room) return;

    playLockSound();

    // 根据锁类型处理
    if (lockType === 'key') {
        // 移除钥匙
        removeItem(room.requiredItem);
    } else if (lockType === 'item') {
        // 移除消耗物品
        removeItem(room.requiredItem);
    } else if (lockType === 'multiItem') {
        // 移除所有需要的物品
        (room.requiredItems || []).forEach(name => removeItem(name));
    }

    room.locked = false;
    hideModal();

    // 如果是大门，直接通关
    if (roomId === 'door') {
        triggerWin();
        return;
    }

    showToast(`「${room.name}」已解锁！`);
    renderRoomCards();
    renderInventory();
}

// ==================== 物品操作 ====================
function removeItem(name) {
    const idx = state.inventory.findIndex(i => i.name === name);
    if (idx !== -1) {
        state.inventory.splice(idx, 1);
    }
    if (state.selectedItem === name) {
        state.selectedItem = null;
    }
}

function hasItem(name) {
    return state.inventory.some(i => i.name === name);
}

// ==================== 物品点击/选择/组合 ====================
function handleItemClick(itemName) {
    if (state.selectedItem === null) {
        // 选中物品
        state.selectedItem = itemName;
        renderInventory();
    } else if (state.selectedItem === itemName) {
        // 取消选择
        state.selectedItem = null;
        renderInventory();
    } else {
        // 尝试组合
        tryCombine(state.selectedItem, itemName);
    }
}

function tryCombine(item1Name, item2Name) {
    const level = levels.find(l => l.id === state.currentLevel);
    if (!level) return;

    // 查找匹配的组合（支持两种顺序）
    const combine = level.combines.find(c =>
        (c.item1 === item1Name && c.item2 === item2Name) ||
        (c.item1 === item2Name && c.item2 === item1Name)
    );

    if (combine) {
        // 执行组合
        removeItem(item1Name);
        removeItem(item2Name);
        state.selectedItem = null;
        state.totalCombines++;
        playCombineSound();

        // 添加结果物品
        if (combine.result) {
            state.inventory.push({
                name: combine.result,
                icon: combine.resultIcon || '✨',
                description: combine.result
            });
        }

        // 添加线索
        if (combine.clue && !state.clues.includes(combine.clue)) {
            state.clues.push(combine.clue);
        }

        // 显示结果
        let msg = combine.message;
        if (combine.result) msg += `<br>获得了「${combine.result}」！`;
        if (combine.clue) msg += `<br><br>📌 获得线索：${combine.clue}`;

        showModal(`
            <button class="modal-close" onclick="hideModal()">&times;</button>
            <div class="modal-title">✨ 物品组合</div>
            <div class="modal-message">${msg}</div>
            <div class="modal-buttons">
                <button class="btn-primary" onclick="hideModal()">太好了！</button>
            </div>
        `);

        renderInventory();
        renderClues();
    } else {
        // 组合失败
        state.selectedItem = null;
        playCombineFailSound();
        showToast(`「${item1Name}」和「${item2Name}」无法组合`);
        renderInventory();
    }
}

// ==================== 通关处理 ====================
function triggerWin() {
    const level = levels.find(l => l.id === state.currentLevel);
    if (!level) return;

    // 停止计时器
    if (state.timerInterval) {
        clearInterval(state.timerInterval);
        state.timerInterval = null;
    }

    // 记录通关时间（用于夜猫子成就）
    state._lastWinHour = new Date().getHours();

    // 记录通关
    if (!state.completedLevels.includes(level.id)) {
        state.completedLevels.push(level.id);
    }

    // 计算星级
    const parTime = level.parTime || 60;
    const parSteps = level.parSteps || 10;
    let stars = 1;
    if (state.timer <= parTime && state.steps <= parSteps) {
        stars = 3;
    } else if (state.timer <= parTime * 1.5 || state.steps <= parSteps * 1.5) {
        stars = 2;
    }
    state.starData[level.id] = stars;
    saveStarData();

    // 更新最佳时间
    const existing = state.bestTimes[level.id];
    if (!existing || state.timer < existing.time) {
        state.bestTimes[level.id] = {
            time: state.timer,
            steps: state.steps,
            stars: stars,
            date: new Date().toISOString()
        };
    }

    // 奖励提示币
    const coinReward = 1 + stars;
    state.hintCoins += coinReward;

    saveProgress();
    saveExtendedData();
    playWinSound();

    // 检查成就
    checkAchievements();

    // 切换到通关页
    document.getElementById('victory-text').textContent = level.winMessage;

    // 显示星级
    const starsEl = document.getElementById('victory-stars');
    if (starsEl) starsEl.textContent = '\u2B50'.repeat(stars) + '\u2606'.repeat(3 - stars);

    // 显示时间和步数
    const statsEl = document.getElementById('victory-stats');
    if (statsEl) {
        const m = Math.floor(state.timer / 60).toString().padStart(2, '0');
        const s = (state.timer % 60).toString().padStart(2, '0');
        statsEl.textContent = '\u23F1 ' + m + ':' + s + '  |  \uD83D\uDC46 ' + state.steps + '步  |  标准: ' + parTime + '秒/' + parSteps + '步  |  +' + coinReward + '\uD83D\uDCB0';
    }

    // 隐藏"下一关"按钮（如果是最后一关）
    const btnNext = document.getElementById('btn-next');
    if (level.id >= levels.length) {
        btnNext.style.display = 'none';
    } else {
        btnNext.style.display = '';
    }

    showView('victory');
    launchConfetti();
    launchStarBurst();
}

// ==================== 下一关 ====================
function goNextLevel() {
    const nextId = state.currentLevel + 1;
    if (nextId <= levels.length) {
        startLevel(nextId);
    } else {
        showView('select');
    }
}

// ==================== 升级1: Web Audio API 音效系统 ====================
let audioCtx = null;
function getAudioCtx() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioCtx;
}

// ========== 密室主题音效系统（基于噪声合成，更真实） ==========

// 全局音量倍率（0.0 - 1.0）
const MASTER_VOLUME = 0.5;

// 辅助：创建白噪声缓冲区
function createWhiteNoiseBuffer(ctx, duration) {
    const sampleRate = ctx.sampleRate;
    const buffer = ctx.createBuffer(1, sampleRate * duration, sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
        data[i] = Math.random() * 2 - 1;
    }
    return buffer;
}

// 辅助：创建粉噪声缓冲区（更自然）
function createPinkNoiseBuffer(ctx, duration) {
    const sampleRate = ctx.sampleRate;
    const buffer = ctx.createBuffer(1, sampleRate * duration, sampleRate);
    const data = buffer.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    for (let i = 0; i < data.length; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        b3 = 0.86650 * b3 + white * 0.3104856;
        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        data[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.11;
        b6 = white * 0.115926;
    }
    return buffer;
}

// 辅助：播放噪声片段
function playNoise(ctx, buffer, startTime, duration, volume, filterFreq, filterType = 'lowpass') {
    const source = ctx.createBufferSource();
    const gain = ctx.createGain();
    const filter = ctx.createBiquadFilter();
    source.buffer = buffer;
    filter.type = filterType;
    filter.frequency.setValueAtTime(filterFreq, startTime);
    source.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    gain.gain.setValueAtTime(volume * MASTER_VOLUME, startTime);
    gain.gain.linearRampToValueAtTime(0, startTime + duration);
    source.start(startTime);
    source.stop(startTime + duration);
}

function playStartLevelSound() {
    if (!state.soundEnabled) return;
    try {
        const ctx = getAudioCtx();
        const t = ctx.currentTime;
        const noise = createPinkNoiseBuffer(ctx, 1.0);
        // 石门摩擦：低频粉噪声 + 低通滤波扫频
        playNoise(ctx, noise, t, 0.8, 0.15, 200, 'lowpass');
        // 添加第二声更闷的回响
        playNoise(ctx, noise, t + 0.3, 0.5, 0.08, 100, 'lowpass');
    } catch(e) {}
}

function playEnterLevelSound() {
    if (!state.soundEnabled) return;
    try {
        const ctx = getAudioCtx();
        const t = ctx.currentTime;
        // 阴森风声：白噪声 + 带通滤波
        const noise = createWhiteNoiseBuffer(ctx, 1.5);
        const source = ctx.createBufferSource();
        const gain = ctx.createGain();
        const filter = ctx.createBiquadFilter();
        source.buffer = noise;
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(300, t);
        filter.Q.setValueAtTime(1.5, t);
        source.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        gain.gain.setValueAtTime(0.06 * MASTER_VOLUME, t);
        gain.gain.linearRampToValueAtTime(0.1 * MASTER_VOLUME, t + 0.5);
        gain.gain.linearRampToValueAtTime(0.04 * MASTER_VOLUME, t + 1.0);
        gain.gain.linearRampToValueAtTime(0, t + 1.5);
        source.start(t);
        source.stop(t + 1.5);
        // 远处水滴：高频短促噪声
        const dropNoise = createWhiteNoiseBuffer(ctx, 0.3);
        playNoise(ctx, dropNoise, t + 0.6, 0.15, 0.05, 2000, 'bandpass');

function showHintPanel() {
    playClickSound();
    const hints = levelHints[state.currentLevel] || [];
    let html = '<button class="modal-close" onclick="hideModal()">&times;</button>';
    html += '<div class="modal-title">\uD83D\uDCA1 提示</div>';
    html += `<div style="text-align:center;margin-bottom:12px;color:var(--gold-foil);font-size:0.9em;">当前提示币：${state.hintCoins} \uD83D\uDCB0</div>`;
    hints.forEach((hint, idx) => {
        const used = state._usedHints && state._usedHints[state.currentLevel] && state._usedHints[state.currentLevel].includes(idx);
        const canAfford = state.hintCoins >= hint.cost;
        const showText = used || (idx === 0 && hint.cost === 0);
        html += `
            <div class="hint-panel-item ${!canAfford && !used && hint.cost > 0 ? 'disabled' : ''}" onclick="${canAfford || used || hint.cost === 0 ? `useHint(${state.currentLevel}, ${idx})` : ''}">
                <div class="hint-label">提示 ${idx + 1}${used ? ' (已使用)' : ''}</div>
                <div class="hint-cost">${hint.cost === 0 ? '免费' : `消耗 ${hint.cost} 提示币`}</div>
                ${showText ? `<div class="hint-text">${hint.text}</div>` : '<div class="hint-text" style="opacity:0.5;">???</div>'}
            </div>
        `;
    });
    if (state.hintCoins < 2) {
        html += '<div style="text-align:center;color:var(--danger);font-size:0.85em;margin-top:8px;">提示币不足，完成关卡可获得提示币</div>';
    }
    showModal(html);
}

function useHint(levelId, hintIdx) {
    const hints = levelHints[levelId] || [];
    const hint = hints[hintIdx];
    if (!hint) return;
    if (!state._usedHints) state._usedHints = {};
    if (!state._usedHints[levelId]) state._usedHints[levelId] = [];
    if (state._usedHints[levelId].includes(hintIdx)) {
        showToast('该提示已经使用过');
        return;
    }
    if (state.hintCoins < hint.cost) {
        showToast('提示币不足，完成关卡可获得提示币');
        return;
    }
    state.hintCoins -= hint.cost;
    state._usedHints[levelId].push(hintIdx);
    saveExtendedData();
    updateHintCoinsDisplay();
    showHintPanel();
    showToast(`已使用提示 ${hintIdx + 1}`);
}

function updateHintCoinsDisplay() {
    const el = document.getElementById('hint-coins-display');
    if (el) el.textContent = state.hintCoins;
}

function getDailySeed() {
    const d = new Date();
    return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
}

// 改进的种子随机数生成器（使用 xorshift，避免 sin 的周期性问题）
function createSeededRNG(seed) {
    let s = seed;
    return function() {
        s ^= s << 13;
        s ^= s >> 17;
        s ^= s << 5;
        return (s >>> 0) / 4294967296;
    };
}

function generateDailyChallenge(challengeNum) {
    const baseSeed = getDailySeed();
    const rng = createSeededRNG(baseSeed * 100 + challengeNum);

    // 每个挑战使用不同的关卡模板
    const templates = [
        {
            roomSets: [
                ['书桌', '壁炉', '书架', '挂画', '大门'],
                ['窗户', '地毯', '保险箱', '古钟', '大门'],
                ['书桌', '窗户', '书架', '地毯', '大门'],
                ['壁炉', '古钟', '保险箱', '挂画', '大门'],
                ['书桌', '古钟', '窗户', '壁炉', '大门'],
                ['地毯', '书架', '窗户', '保险箱', '大门'],
                ['壁炉', '书桌', '古钟', '书架', '大门']
            ]
        },
        {
            roomSets: [
                ['书架', '窗户', '壁炉', '地毯', '大门'],
                ['古钟', '书桌', '挂画', '保险箱', '大门'],
                ['地毯', '壁炉', '书架', '窗户', '大门'],
                ['书桌', '挂画', '古钟', '壁炉', '大门'],
                ['保险箱', '窗户', '书架', '古钟', '大门'],
                ['书桌', '地毯', '窗户', '挂画', '大门'],
                ['壁炉', '保险箱', '书架', '古钟', '大门']
            ]
        }
    ];

    const template = templates[challengeNum - 1];
    const setIndex = Math.floor(rng() * template.roomSets.length);
    const selectedRooms = template.roomSets[setIndex];

    const roomData = {
        '书桌': { icon: '📝', desc: '书桌上散落着一些文件和文具。' },
        '书架': { icon: '📚', desc: '书架上满是灰尘的旧书。' },
        '壁炉': { icon: '🔥', desc: '壁炉已经熄灭，但里面似乎有什么东西。' },
        '挂画': { icon: '🖼️', desc: '一幅古老的挂画，背后可能藏着秘密。' },
        '窗户': { icon: '🪟', desc: '窗户被铁栏杆封住了，但窗台上有些东西。' },
        '地毯': { icon: '🟫', desc: '一块破旧的地毯，下面似乎有东西。' },
        '保险箱': { icon: '🗄️', desc: '一个老式保险箱，需要密码才能打开。' },
        '古钟': { icon: '🕰️', desc: '一座停摆的古钟，指针指向某个时刻。' }
    };

    // 生成4位密码
    let pwd = '';
    for (let i = 0; i < 4; i++) pwd += Math.floor(rng() * 10);

    // 物品配置
    const itemConfigs = [
        { key: '铜钥匙', icon: '🗝️', iconAlt: '🔑' },
        { key: '银钥匙', icon: '🗝️', iconAlt: '🔑' },
        { clue: '密码线索', icon: '📜' },
        { door: true }
    ];

    const rooms = selectedRooms.map((name, i) => {
        const data = roomData[name];
        const isDoor = name === '大门';
        const isLocked = i >= 2 || isDoor;
        const isPassword = isDoor;

        let drops = [];
        let clues = [];
        let requiredItem = null;

        if (i === 0) {
            drops = [{ name: itemConfigs[0].key, icon: itemConfigs[0].icon, description: '一把铜钥匙。' }];
        } else if (i === 1) {
            drops = [{ name: itemConfigs[1].key, icon: itemConfigs[1].iconAlt, description: '一把银钥匙。' }];
        } else if (i === 2) {
            requiredItem = itemConfigs[0].key;
            drops = [{ name: itemConfigs[2].clue, icon: itemConfigs[2].icon, description: '一张写着线索的纸条。' }];
            clues = [`纸条上写着："密码的第一位是${pwd[0]}，最后一位是${pwd[3]}"`];
        } else if (i === 3) {
            requiredItem = itemConfigs[1].key;
            clues = [`${data.desc} 密码的中间两位是：${pwd[1]}${pwd[2]}`];
        }

        return {
            id: isDoor ? 'door' : 'room' + i,
            name: isDoor ? '大门' : name,
            icon: isDoor ? '🚪' : data.icon,
            description: isDoor ? '通往自由的大门，需要密码才能打开。' : data.desc,
            locked: isLocked,
            lockType: isPassword ? 'password' : (isLocked ? 'key' : null),
            password: isPassword ? pwd : null,
            passwordLength: isPassword ? 4 : null,
            passwordHint: isPassword ? '四位数字密码。需要收集所有线索才能推理出完整密码。' : null,
            requiredItem: requiredItem,
            drops: drops,
            clues: clues,
            multiExplore: false,
            exploreCount: 0,
            maxExplores: 1
        };
    });

    dailyState.password = pwd;
    dailyState.hints = [
        { text: '先搜索未锁的房间，收集钥匙和线索。', cost: 0 },
        { text: '线索分散在不同房间中，需要全部找到才能推理密码。', cost: 1 },
        { text: `密码提示：第一位${pwd[0]}，最后一位${pwd[3]}，中间两位需要从其他线索推理。`, cost: 2 }
    ];

    return rooms;
}

function startDailyChallenge(challengeNum) {
    if (!challengeNum) challengeNum = 1;
    dailyState.currentChallenge = challengeNum;

    const today = new Date().toDateString();
    if (state.dailyDate !== today) {
        state.dailyDate = today;
        state.dailyCompleted = false;
        dailyState.challenge1Completed = false;
        dailyState.challenge2Completed = false;
    }

    dailyState.rooms = generateDailyChallenge(challengeNum);
    dailyState.inventory = [];
    dailyState.clues = [];
    dailyState.selectedItem = null;
    dailyState.timer = 0;
    dailyState.steps = 0;

    if (dailyState.timerInterval) clearInterval(dailyState.timerInterval);
    dailyState.timerInterval = setInterval(() => {
        dailyState.timer++;
        const m = Math.floor(dailyState.timer / 60).toString().padStart(2, '0');
        const s = (dailyState.timer % 60).toString().padStart(2, '0');
        const el = document.getElementById('daily-timer-display');
        if (el) el.textContent = m + ':' + s;
    }, 1000);

    document.getElementById('daily-steps-display').textContent = '0';
    const label = document.getElementById('daily-challenge-label');
    if (label) label.textContent = `当前：第${challengeNum}关`;
    renderDailyGame();
    showView('daily');
}

function renderDailyGame() {
    const grid = document.getElementById('daily-room-grid');
    grid.innerHTML = '';
    dailyState.rooms.forEach(room => {
        const card = document.createElement('div');
        let classes = 'room-card';
        if (room.id === 'door') classes += ' door-card';
        if (room.locked) classes += ' locked';
        if (room.explored) classes += ' explored';
        card.className = classes;

        let lockBadge = '';
        if (room.locked && !room.explored) {
            if (room.lockType === 'key') lockBadge = '<div class="lock-badge">\uD83D\uDDDD\uFE0F</div>';
            else if (room.lockType === 'password') lockBadge = '<div class="lock-badge">\uD83D\uDD22</div>';
        }

        card.innerHTML = `
            ${lockBadge}
            <div class="room-icon">${room.icon}</div>
            <div class="room-name">${room.name}</div>
            <div class="room-desc">${room.explored ? '\u5DF2\u63A2\u7D22' : room.description}</div>
        `;
        card.addEventListener('click', () => handleDailyRoomClick(room));
        grid.appendChild(card);
    });

    renderDailyInventory();
    renderDailyClues();
}

function renderDailyInventory() {
    const slots = document.getElementById('daily-inventory-slots');
    slots.innerHTML = '';
    for (let i = 0; i < 8; i++) {
        const slot = document.createElement('div');
        if (i < dailyState.inventory.length) {
            const item = dailyState.inventory[i];
            slot.className = 'inv-slot' + (dailyState.selectedItem === item.name ? ' selected' : '');
            slot.innerHTML = `<div class="item-icon">${item.icon}</div><div class="item-name">${item.name}</div>`;
            slot.addEventListener('click', () => handleDailyItemClick(item.name));
        } else {
            slot.className = 'inv-slot empty';
            slot.innerHTML = '<div class="item-icon">\u00B7</div>';
        }
        slots.appendChild(slot);
    }
    const hint = document.getElementById('daily-combine-hint');
    if (dailyState.selectedItem) {
        hint.textContent = `\u5DF2\u9009\u62E9\u300C${dailyState.selectedItem}\u300D\uFF0C\u8BF7\u70B9\u51FB\u53E6\u4E00\u4E2A\u7269\u54C1\u8FDB\u884C\u7EC4\u5408`;
        hint.className = 'combine-hint active';
    } else {
        hint.textContent = '\u70B9\u51FB\u7269\u54C1\u9009\u4E2D\uFF0C\u518D\u70B9\u51FB\u53E6\u4E00\u4E2A\u7269\u54C1\u5C1D\u8BD5\u7EC4\u5408';
        hint.className = 'combine-hint';
    }
}

function renderDailyClues() {
    const list = document.getElementById('daily-clue-list');
    if (dailyState.clues.length === 0) {
        list.innerHTML = '<div class="clue-empty">\u6682\u65E0\u7EBF\u7D22\uFF0C\u63A2\u7D22\u623F\u95F4\u6765\u83B7\u53D6\u7EBF\u7D22\u5427\u3002</div>';
    } else {
        list.innerHTML = dailyState.clues.map(c => `<div class="clue-item">\uD83D\uDCCC ${c}</div>`).join('');
    }
}

function handleDailyRoomClick(room) {
    if (room.explored) {
        showToast('\u8FD9\u4E2A\u533A\u57DF\u5DF2\u7ECF\u63A2\u7D22\u8FC7\u4E86\u3002');
        return;
    }
    if (room.locked) {
        if (room.lockType === 'key') {
            const hasItem = dailyState.inventory.some(i => i.name === room.requiredItem);
            if (hasItem) {
                dailyState.inventory = dailyState.inventory.filter(i => i.name !== room.requiredItem);
                room.locked = false;
                showToast(`\u300C${room.name}\u300D\u5DF2\u89E3\u9501\uFF01`);
                renderDailyGame();
            } else {
                showToast(`\u9700\u8981\u300C${room.requiredItem}\u300D\u624D\u80FD\u6253\u5F00`);
            }
        } else if (room.lockType === 'password') {
            showDailyPasswordModal(room);
        }
    } else {
        exploreDailyRoom(room);
    }
}

function showDailyPasswordModal(room) {
    let inputs = '';
    for (let i = 0; i < 4; i++) {
        inputs += `<input type="text" maxlength="1" class="pwd-digit" data-index="${i}" inputmode="numeric" pattern="[0-9]">`;
    }
    showModal(`
        <button class="modal-close" onclick="hideModal()">&times;</button>
        <div class="modal-title">\uD83D\uDD22 \u8F93\u5165\u5BC6\u7801</div>
        <div class="modal-message">${room.passwordHint || '\u8BF7\u8F93\u5165\u5BC6\u7801\u3002'}</div>
        <div class="password-inputs" id="pwd-inputs">${inputs}</div>
        <div class="password-hint">\u5BC6\u7801\u957F\u5EA6\uFF1A4\u4F4D\u6570\u5B57</div>
        <div class="modal-buttons">
            <button class="btn-primary" id="btn-pwd-submit" onclick="submitDailyPassword()">\u786E\u8BA4</button>
            <button class="btn-secondary" onclick="hideModal()">\u53D6\u6D88</button>
        </div>
    `);
    setTimeout(() => {
        const digits = document.querySelectorAll('.pwd-digit');
        digits.forEach((input, idx) => {
            input.addEventListener('input', function() {
                this.value = this.value.replace(/[^0-9]/g, '');
                if (this.value && idx < 3) digits[idx + 1].focus();
            });
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && !this.value && idx > 0) digits[idx - 1].focus();
                if (e.key === 'Enter') submitDailyPassword();
            });
        });
        if (digits.length > 0) digits[0].focus();
    }, 100);
}

function submitDailyPassword() {
    const digits = document.querySelectorAll('.pwd-digit');
    let pwd = '';
    digits.forEach(d => pwd += d.value);
    if (pwd === dailyState.password) {
        playPasswordCorrect();
        hideModal();
        triggerDailyWin();
    } else {
        playPasswordWrong();
        showToast('\u5BC6\u7801\u9519\u8BEF\uFF0C\u8BF7\u91CD\u8BD5');
        digits.forEach(d => { d.value = ''; d.style.borderColor = 'var(--danger)'; });
        setTimeout(() => {
            digits.forEach(d => d.style.borderColor = '');
            if (digits.length > 0) digits[0].focus();
        }, 500);
    }
}

function exploreDailyRoom(room) {
    room.explored = true;
    room.exploreCount++;
    dailyState.steps++;
    document.getElementById('daily-steps-display').textContent = dailyState.steps;
    playExploreSound();

    let foundItems = [];
    room.drops.forEach(drop => {
        if (dailyState.inventory.length < 8) {
            dailyState.inventory.push({ name: drop.name, icon: drop.icon, description: drop.description });
            foundItems.push(drop.name);
        }
    });
    room.clues.forEach(clue => {
        if (!dailyState.clues.includes(clue)) dailyState.clues.push(clue);
    });

    let msg = `\u4F60\u4ED4\u7EC6\u641C\u7D22\u4E86\u300C${room.name}\u300D\u3002\n`;
    msg += foundItems.length > 0 ? `\u83B7\u5F97\u4E86\uFF1A${foundItems.join('\u3001')}` : '\u8FD9\u91CC\u6CA1\u6709\u53D1\u73B0\u6709\u7528\u7684\u4E1C\u897F\u3002';

    showModal(`
        <button class="modal-close" onclick="hideModal()">&times;</button>
        <div class="modal-title">${room.icon} ${room.name}</div>
        <div class="modal-message">${msg.replace(/\n/g, '<br>')}</div>
        <div class="modal-buttons">
            <button class="btn-primary" onclick="hideModal()">\u786E\u5B9A</button>
        </div>
    `);
    renderDailyGame();
}

function handleDailyItemClick(itemName) {
    if (dailyState.selectedItem === null) {
        dailyState.selectedItem = itemName;
    } else if (dailyState.selectedItem === itemName) {
        dailyState.selectedItem = null;
    } else {
        // 每日挑战中不实现复杂组合，简单提示
        showToast(`\u300C${dailyState.selectedItem}\u300D\u548C\u300C${itemName}\u300D\u65E0\u6CD5\u7EC4\u5408`);
        dailyState.selectedItem = null;
    }
    renderDailyInventory();
}

function triggerDailyWin() {
    if (dailyState.timerInterval) {
        clearInterval(dailyState.timerInterval);
        dailyState.timerInterval = null;
    }

    const today = new Date().toDateString();
    const alreadyCompleted = state.dailyCompleted && state.dailyDate === today;

    if (!alreadyCompleted) {
        state.dailyCompleted = true;
        state.dailyDate = today;
        state.hintCoins += 3;
        saveExtendedData();
    }

    // 模拟排名
    const time = dailyState.timer;
    let rankClass = 'rank-50', rankText = '\u524D 50%';
    if (time < 30) { rankClass = 'rank-1'; rankText = '\u524D 1% \uD83D\uDD25'; }
    else if (time < 60) { rankClass = 'rank-5'; rankText = '\u524D 5% \uD83D\uDCAF'; }
    else if (time < 90) { rankClass = 'rank-10'; rankText = '\u524D 10% \uD83D\uDC4D'; }

    const m = Math.floor(time / 60).toString().padStart(2, '0');
    const s = (time % 60).toString().padStart(2, '0');

    showModal(`
        <button class="modal-close" onclick="hideModal(); showView('select');">&times;</button>
        <div class="modal-title">\uD83C\uDF89 \u6BCF\u65E5\u6311\u6218\u901A\u5173\uFF01</div>
        <div class="modal-message" style="text-align:center;">
            <div style="font-size:2em;margin:12px 0;">\u2B50\u2B50\u2B50</div>
            <div>\u7528\u65F6\uFF1A${m}:${s} | \u6B65\u6570\uFF1A${dailyState.steps}</div>
            <div class="rank-badge ${rankClass}">${rankText}</div>
            ${!alreadyCompleted ? '<div style="margin-top:10px;color:var(--gold-foil);">+3 \uD83D\uDCB0 \u63D0\u793A\u5E01</div>' : ''}
        </div>
        <div class="modal-buttons">
            <button class="btn-primary" onclick="hideModal(); showView('select');">\u8FD4\u56DE\u9009\u5173</button>
        </div>
    `);
    launchConfetti();
    launchStarBurst();
}

function showDailyHintPanel() {
    playClickSound();
    const hints = dailyState.hints || [];
    let html = '<button class="modal-close" onclick="hideModal()">&times;</button>';
    html += '<div class="modal-title">\uD83D\uDCA1 \u63D0\u793A</div>';
    html += `<div style="text-align:center;margin-bottom:12px;color:var(--gold-foil);font-size:0.9em;">\u5F53\u524D\u63D0\u793A\u5E01\uFF1A${state.hintCoins} \uD83D\uDCB0</div>`;
    hints.forEach((hint, idx) => {
        const used = dailyState._usedHints && dailyState._usedHints.includes(idx);
        const canAfford = state.hintCoins >= hint.cost;
        const showText = used || (idx === 0 && hint.cost === 0);
        html += `
            <div class="hint-panel-item ${!canAfford && !used && hint.cost > 0 ? 'disabled' : ''}" onclick="${canAfford || used || hint.cost === 0 ? `useDailyHint(${idx})` : ''}">
                <div class="hint-label">\u63D0\u793A ${idx + 1}${used ? ' (\u5DF2\u4F7F\u7528)' : ''}</div>
                <div class="hint-cost">${hint.cost === 0 ? '\u514D\u8D39' : `\u6D88\u8017 ${hint.cost} \u63D0\u793A\u5E01`}</div>
                ${showText ? `<div class="hint-text">${hint.text}</div>` : '<div class="hint-text" style="opacity:0.5;">???</div>'}
            </div>
        `;
    });
    if (state.hintCoins < 2) {
        html += '<div style="text-align:center;color:var(--danger);font-size:0.85em;margin-top:8px;">\u63D0\u793A\u5E01\u4E0D\u8DB3\uFF0C\u5B8C\u6210\u5173\u5361\u53EF\u83B7\u5F97\u63D0\u793A\u5E01</div>';
    }
    showModal(html);
}

function useDailyHint(hintIdx) {
    const hints = dailyState.hints || [];
    const hint = hints[hintIdx];
    if (!hint) return;
    if (!dailyState._usedHints) dailyState._usedHints = [];
    if (dailyState._usedHints.includes(hintIdx)) {
        showToast('\u8BE5\u63D0\u793A\u5DF2\u7ECF\u4F7F\u7528\u8FC7');
        return;
    }
    if (state.hintCoins < hint.cost) {
        showToast('\u63D0\u793A\u5E01\u4E0D\u8DB3\uFF0C\u5B8C\u6210\u5173\u5361\u53EF\u83B7\u5F97\u63D0\u793A\u5E01');
        return;
    }
    state.hintCoins -= hint.cost;
    dailyState._usedHints.push(hintIdx);
    saveExtendedData();
    updateHintCoinsDisplay();
    showDailyHintPanel();
    showToast(`\u5DF2\u4F7F\u7528\u63D0\u793A ${hintIdx + 1}`);
}

// 启动游戏
init();
</script>
</body>
</html>
