<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>上锁的书房 - 密室逃脱</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ========== 基础重置与全局样式 ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --oil-wax: #32271E;
            --oil-wax-light: #423228;
            --oil-wax-dark: #1e1710;
            --cashmere: #E8DFD0;
            --cashmere-dim: #b8a898;
            --stitch: #75593F;
            --stitch-light: #8a6d50;
            --gold-foil: #C8A775;
            --gold-foil-glow: rgba(200, 167, 117, 0.3);
            --gold-foil-bright: #d4b888;
            --shadow-deep: #16120c;
            --shadow-mid: #241c14;
            --success: #5a7a4a;
            --danger: #a04030;
            --rivet: #7a6a5a;
            --rivet-shine: #9a8a78;
            --leather-dark: #362920;
            --leather-light: #4a3528;
            --copper: #D4B888;
            --copper-glow: rgba(212, 184, 136, 0.35);
            --text: #E6DDCF;
            --text-dim: #c4b8a8;
            --card-bg: #362920;
            --card-hover: #4a3528;
            --card-border: #7A5C42;
            --info: #7A9E8E;
            --overlay: rgba(26, 18, 12, 0.92);
            --shadow: #1a120c;
            --radius: 12px;
            --radius-sm: 6px;
        }
        html, body {
            width: 100%; min-height: 100vh;
            font-family: 'Noto Serif SC', 'Cinzel', 'Songti SC', serif;
            background: #16120c;
            color: var(--cashmere);
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        body { 
            background: #16120c;
            position: relative;
        }
        /* 皮匣底板皮纹 */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background:
                radial-gradient(ellipse 4px 3px at 15% 25%, rgba(60,45,30,0.12) 0%, transparent 100%),
                radial-gradient(ellipse 5px 3px at 45% 15%, rgba(50,38,25,0.1) 0%, transparent 100%),
                radial-gradient(ellipse 3px 4px at 72% 35%, rgba(65,50,35,0.08) 0%, transparent 100%),
                radial-gradient(ellipse 6px 4px at 22% 58%, rgba(55,42,28,0.11) 0%, transparent 100%),
                radial-gradient(ellipse 4px 5px at 55% 72%, rgba(62,48,32,0.09) 0%, transparent 100%),
                radial-gradient(ellipse 3px 3px at 82% 48%, rgba(52,40,26,0.1) 0%, transparent 100%),
                repeating-linear-gradient(173deg, transparent 0px, rgba(30,22,14,0.04) 1px, transparent 2px, transparent 22px),
                repeating-linear-gradient(177deg, transparent 0px, rgba(38,28,18,0.03) 1px, transparent 2px, transparent 30px),
                linear-gradient(155deg, #1e1710 0%, #241c14 20%, #201810 40%, #261e16 60%, #1a1410 80%, #1e1812 100%);
            z-index: -2;
        }
        /* 极淡族徽暗印 */
        body::after {
            content: '';
            position: fixed; inset: 0;
            background:
                radial-gradient(circle at 50% 50%, rgba(200,167,117,0.015) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(200,167,117,0.008) 10%, transparent 30%);
            z-index: -1;
            pointer-events: none;
        }

        /* ========== 视图容器 ========== */
        .view { display: none; width: 100%; min-height: 100vh; padding: 20px; }
        .view.active { display: flex; flex-direction: column; align-items: center; z-index: 200; position: relative; }

        /* ========== 游戏内古墓装饰（高级版） ========== */
        /* 页面四角 — 精致石雕角花 */
        .tomb-corner-deco {
            position: fixed; width: 60px; height: 60px;
            z-index: 150; pointer-events: none; opacity: 0.35;
        }
        .tomb-corner-deco::before, .tomb-corner-deco::after {
            content: ''; position: absolute;
        }
        /* 主线条 */
        .tomb-corner-deco::before {
            width: 40px; height: 40px;
            border: 1.5px solid var(--gold-foil);
            opacity: 0.6;
        }
        /* 内角装饰点 */
        .tomb-corner-deco::after {
            width: 6px; height: 6px; border-radius: 50%;
            background: radial-gradient(circle, var(--gold-foil), #8a7a5a);
            box-shadow: 0 0 4px rgba(200,167,117,0.4);
        }
        .tomb-corner-tl { top: 10px; left: 10px; }
        .tomb-corner-tl::before { top: 0; left: 0; border-right: none; border-bottom: none; border-radius: 4px 0 0 0; }
        .tomb-corner-tl::after { top: 2px; left: 2px; }
        .tomb-corner-tr { top: 10px; right: 10px; }
        .tomb-corner-tr::before { top: 0; right: 0; border-left: none; border-bottom: none; border-radius: 0 4px 0 0; }
        .tomb-corner-tr::after { top: 2px; right: 2px; }
        .tomb-corner-bl { bottom: 10px; left: 10px; }
        .tomb-corner-bl::before { bottom: 0; left: 0; border-right: none; border-top: none; border-radius: 0 0 0 4px; }
        .tomb-corner-bl::after { bottom: 2px; left: 2px; }
        .tomb-corner-br { bottom: 10px; right: 10px; }
        .tomb-corner-br::before { bottom: 0; right: 0; border-left: none; border-top: none; border-radius: 0 0 4px 0; }
        .tomb-corner-br::after { bottom: 2px; right: 2px; }

        /* 页面边缘 — 精致符文装饰带（带发光） */
        .tomb-edge-rune {
            position: fixed; z-index: 150; pointer-events: none;
            font-size: 0.95em; color: var(--gold-foil); opacity: 0.18;
            letter-spacing: 8px; font-family: 'Cinzel', serif;
            writing-mode: vertical-rl;
            text-shadow:
                0 0 6px rgba(200,167,117,0.3),
                0 0 12px rgba(200,167,117,0.1);
            filter: blur(0.3px);
        }
        .tomb-edge-rune-left { left: 14px; top: 50%; transform: translateY(-50%); }
        .tomb-edge-rune-right { right: 14px; top: 50%; transform: translateY(-50%); }

        /* 顶部 — 精致石梁 + 中央符文 */
        .tomb-top-beam {
            position: fixed; top: 0; left: 50%; transform: translateX(-50%);
            width: 280px; height: 3px; z-index: 150; pointer-events: none;
            background: linear-gradient(90deg, transparent 0%, rgba(200,167,117,0.1) 15%, var(--gold-foil) 50%, rgba(200,167,117,0.1) 85%, transparent 100%);
            opacity: 0.35; border-radius: 2px;
            box-shadow: 0 0 8px rgba(200,167,117,0.15);
        }
        .tomb-top-beam::before {
            content: '⛧'; position: absolute;
            left: 50%; top: -16px; transform: translateX(-50%);
            font-size: 1.1em; color: var(--gold-foil); opacity: 0.4;
            text-shadow: 0 0 8px rgba(200,167,117,0.3);
        }
        .tomb-top-beam::after {
            content: ''; position: absolute;
            left: 50%; top: -4px; transform: translateX(-50%);
            width: 8px; height: 8px; border-radius: 50%;
            background: radial-gradient(circle, rgba(200,167,117,0.5), transparent);
            box-shadow: 0 0 12px rgba(200,167,117,0.2);
        }

        /* 底部 — 精致石砖地面纹理 */
        .tomb-ground {
            position: fixed; bottom: 0; left: 0; right: 0; height: 50px;
            z-index: 150; pointer-events: none;
            background:
                /* 砖缝线 */
                repeating-linear-gradient(90deg, transparent 0px, transparent 58px, rgba(60,45,30,0.15) 58px, rgba(60,45,30,0.15) 60px),
                repeating-linear-gradient(0deg, transparent 0px, transparent 18px, rgba(60,45,30,0.1) 18px, rgba(60,45,30,0.1) 20px),
                /* 碎石颗粒 */
                radial-gradient(ellipse 3px 2px at 15% 70%, rgba(90,75,55,0.15) 0%, transparent 100%),
                radial-gradient(ellipse 2px 1.5px at 45% 85%, rgba(80,65,45,0.12) 0%, transparent 100%),
                radial-gradient(ellipse 4px 2px at 75% 60%, rgba(70,55,40,0.1) 0%, transparent 100%),
                radial-gradient(ellipse 2px 1px at 90% 80%, rgba(85,70,50,0.13) 0%, transparent 100%),
                /* 底部阴影渐变 */
                linear-gradient(to top, rgba(20,15,8,0.7) 0%, rgba(20,15,8,0.3) 40%, transparent 100%);
        }

        /* 火光环境光 + 微弱闪烁动画 */
        .tomb-ambient-glow {
            position: fixed; inset: 0; z-index: 149; pointer-events: none;
            background:
                radial-gradient(ellipse 300px 250px at 8% 15%, rgba(255,140,40,0.035) 0%, transparent 100%),
                radial-gradient(ellipse 300px 250px at 92% 15%, rgba(255,140,40,0.035) 0%, transparent 100%),
                radial-gradient(ellipse 400px 300px at 50% 95%, rgba(200,167,117,0.02) 0%, transparent 100%);
            animation: tomb-flicker 4s ease-in-out infinite alternate;
        }
        @keyframes tomb-flicker {
            0% { opacity: 1; }
            25% { opacity: 0.85; }
            50% { opacity: 1; }
            75% { opacity: 0.9; }
            100% { opacity: 0.95; }
        }

        /* 浮尘粒子效果 */
        .tomb-dust {
            position: fixed; z-index: 148; pointer-events: none;
            width: 100%; height: 100%; inset: 0;
        }
        .tomb-dust-particle {
            position: absolute;
            width: 2px; height: 2px; border-radius: 50%;
            background: rgba(200,180,140,0.25);
            animation: dust-float linear infinite;
        }
        @keyframes dust-float {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.15; }
            100% { transform: translateY(-100vh) translateX(30px); opacity: 0; }
        }

        /* 游戏标题 — 精致分隔线 */
        .tomb-title-deco {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 6px;
        }
        .tomb-title-deco::before, .tomb-title-deco::after {
            content: ''; flex: 1; height: 1px; max-width: 50px;
            background: linear-gradient(90deg, transparent, var(--gold-foil), transparent);
            opacity: 0.5;
            box-shadow: 0 0 4px rgba(200,167,117,0.15);
        }
        .tomb-title-deco span {
            font-size: 0.7em; opacity: 0.5;
            text-shadow: 0 0 6px rgba(200,167,117,0.3);
        }

        /* ========== 关卡选择页 ========== */
        .select-header { text-align: center; margin-top: 30px; margin-bottom: 30px; }
        .select-header h1, .level-title {
            font-family: 'Cinzel', 'Noto Serif SC', serif;
            font-size: 2.4em; color: var(--gold-foil);
            text-shadow: 
                0 1px 0 rgba(255,255,255,0.25),
                0 2px 4px rgba(0,0,0,0.7),
                0 4px 8px rgba(0,0,0,0.4);
            letter-spacing: 4px; margin-bottom: 8px;
        }
        .select-header p {
            font-size: 1.1em; color: var(--cashmere-dim); letter-spacing: 8px;
        }
        .level-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; max-width: 900px; width: 100%; padding: 0 10px; }
        .level-card {
            background: linear-gradient(145deg, #32271E 0%, #2a1f16 50%, #32271E 100%);
            outline: none; border-radius: 12px;
            padding: 18px 10px; text-align: center;
            cursor: pointer; transition: all 0.3s ease;
            position: relative; overflow: hidden;
            box-shadow: 
                inset 0 0 0 1px var(--stitch),
                inset 0 0 0 3px #32271E,
                inset 0 0 0 4px var(--stitch),
                0 4px 12px rgba(0,0,0,0.5);
        }
        /* 内圈哑光鎏金压槽边线 */
        .level-card::before {
            content: ''; position: absolute; inset: 8px;
            border: 1px solid rgba(200,167,117,0.08);
            border-radius: 8px; pointer-events: none;
        }
        .level-card:hover { 
            transform: translateY(-4px);
            background: linear-gradient(145deg, #3a2c20 0%, #2e2218 50%, #362820 100%);
            box-shadow: 
                inset 0 0 0 1px var(--stitch-light),
                inset 0 0 0 3px #3a2c20,
                inset 0 0 0 4px var(--stitch-light),
                0 8px 24px rgba(0,0,0,0.5),
                0 0 15px rgba(200,167,117,0.1);
        }
        .level-card:active {
            transform: translateY(0);
            box-shadow: 
                inset 0 0 0 1px var(--stitch),
                inset 0 0 0 3px #1e1710,
                inset 0 0 0 4px var(--stitch),
                inset 0 4px 12px rgba(0,0,0,0.5);
        }
        .level-card .level-num { font-size: 1.8em; font-weight: bold; color: var(--gold-foil); margin-bottom: 6px; }
        .level-card .level-name { font-size: 0.85em; color: var(--cashmere); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .level-card .level-stars { font-size: 0.75em; color: var(--gold-foil); }
        /* 已通关 */
        .level-card.completed {
            box-shadow: inset 0 0 0 1px var(--success), inset 0 0 0 3px #32271E, inset 0 0 0 4px var(--success), 0 0 10px rgba(90,122,74,0.3);
        }
        .level-card.completed .level-num::after { content: ' ✅'; font-size: 0.5em; }
        /* 可玩 */
        .level-card.available {
            box-shadow: inset 0 0 0 1px var(--gold-foil), inset 0 0 0 3px #32271E, inset 0 0 0 4px var(--gold-foil), 0 0 15px rgba(200,167,117,0.15);
            animation: pulse 2s infinite;
        }
        /* 锁定 */
        .level-card.locked {
            border-color: var(--shadow-deep); opacity: 0.5; cursor: not-allowed;
        }
        .level-card.locked:hover { 
            border-color: var(--shadow-deep);
            box-shadow: inset 0 0 0 1px var(--shadow-deep), inset 0 0 0 3px #32271E, inset 0 0 0 4px var(--shadow-deep), 0 4px 12px rgba(0,0,0,0.5);
        }
        .level-card.locked .level-num::after { content: ' 🔒'; font-size: 0.5em; }

        /* ========== 游戏页 ========== */
        .game-header { text-align: center; margin-bottom: 16px; }
        .btn-back {
            position: absolute; top: 16px; left: 16px;
            background: rgba(50,39,30,0.7);
            color: var(--cashmere-dim);
            border: 1px solid var(--stitch);
            padding: 8px 16px; border-radius: 6px;
            cursor: pointer; font-size: 0.85em;
            transition: all 0.3s;
            font-family: 'Noto Serif SC', serif;
        }
        .btn-back:hover { background: rgba(50,39,30,0.9); color: var(--cashmere); border-color: var(--stitch-light); }
        .level-title {
            font-family: 'Cinzel', 'Noto Serif SC', serif;
            font-size: 1.6em; color: var(--gold-foil); margin-bottom: 6px;
            text-shadow: 
                0 1px 0 rgba(255,255,255,0.25),
                0 2px 4px rgba(0,0,0,0.7),
                0 4px 8px rgba(0,0,0,0.4);
        }
        .level-subtitle { font-size: 0.9em; color: var(--cashmere-dim); margin-bottom: 8px; }
        .level-hint {
            background: rgba(50,39,30,0.5);
            border: 1px solid var(--stitch); border-radius: 8px;
            padding: 10px 14px; font-size: 0.85em;
            color: var(--cashmere-dim); line-height: 1.6;
        }

        /* ========== 区域卡牌网格 ========== */
        .room-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; max-width: 700px; width: 100%; padding: 0 10px; }
        .room-card {
            background: linear-gradient(145deg, #32271E 0%, #2a1f16 50%, #32271E 100%);
            outline: none; border-radius: 12px;
            padding: 20px 14px; text-align: center;
            cursor: pointer; transition: all 0.3s ease;
            position: relative; min-height: 160px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            box-shadow: 
                inset 0 0 0 1px var(--stitch),
                inset 0 0 0 3px #32271E,
                inset 0 0 0 4px var(--stitch),
                0 4px 12px rgba(0,0,0,0.5);
        }
        /* 内圈哑光鎏金压槽 */
        .room-card::before {
            content: ''; position: absolute; inset: 8px;
            border: 1px solid rgba(200,167,117,0.08);
            border-radius: 8px; pointer-events: none;
        }
        .room-card:hover { 
            transform: translateY(-4px);
            background: linear-gradient(145deg, #3a2c20 0%, #2e2218 50%, #362820 100%);
            box-shadow: 
                inset 0 0 0 1px var(--stitch-light),
                inset 0 0 0 3px #3a2c20,
                inset 0 0 0 4px var(--stitch-light),
                0 8px 24px rgba(0,0,0,0.5),
                0 0 15px rgba(200,167,117,0.1);
        }
        .room-card:active {
            transform: translateY(0);
            box-shadow: 
                inset 0 0 0 1px var(--stitch),
                inset 0 0 0 3px #1e1710,
                inset 0 0 0 4px var(--stitch),
                inset 0 4px 12px rgba(0,0,0,0.5);
        }
        .room-card .room-icon { font-size: 2.8em; margin-bottom: 10px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        .room-card .room-name { font-size: 1em; font-weight: 600; color: var(--cashmere); margin-bottom: 4px; }
        .room-card .room-desc { font-size: 0.75em; color: var(--cashmere-dim); line-height: 1.4; max-width: 160px; }
        /* 锁定 */
        .room-card.locked { opacity: 0.7; }
        .room-card.locked .room-icon { filter: brightness(0.5); }
        .room-card .lock-badge {
            position: absolute; top: 8px; right: 8px;
            background: rgba(22,18,12,0.6); border-radius: 50%;
            width: 28px; height: 28px; display: flex; align-items: center;
            justify-content: center; font-size: 0.9em;
        }
        /* 已探索 */
        .room-card.explored {
            border-color: var(--success); opacity: 0.6; cursor: default;
        }
        .room-card.explored:hover { 
            border-color: var(--success);
            box-shadow: inset 0 0 0 1px var(--success), inset 0 0 0 3px #32271E, inset 0 0 0 4px var(--success), 0 0 8px rgba(90,122,74,0.2);
        }
        .room-card.explored .room-icon::after {
            content: ' ✓'; color: var(--success); font-size: 0.5em;
            position: absolute; top: -5px; right: -15px;
        }
        /* 大门 */
        .room-card.door-card {
            border-color: var(--gold-foil);
            background: linear-gradient(145deg, #2e2218 0%, #241a12 50%, #2e2218 100%);
        }
        .room-card.door-card.locked {
            border-color: var(--stitch);
            animation: doorGlow 3s infinite;
        }

        /* ========== 底部面板（物品栏+线索） ========== */
        .game-bottom { display: flex; flex-direction: column; gap: 12px; max-width: 700px; width: 100%; padding: 0 10px; margin-top: 16px; }
        .clue-panel {
            flex: 1; background: linear-gradient(145deg, #2a1f16 0%, #241a12 100%);
            outline: none; border-radius: 12px; padding: 14px; max-height: 200px;
            box-shadow: 
                inset 0 0 0 1px var(--stitch),
                inset 0 0 0 3px #2a1f16,
                inset 0 0 0 4px var(--stitch),
                0 4px 12px rgba(0,0,0,0.4);
        }
        .clue-panel h3 { font-size: 0.9em; color: var(--gold-foil); margin-bottom: 8px; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
        .clue-list { display: flex; flex-direction: column; gap: 6px; max-height: 150px; overflow-y: auto; }
        .clue-item {
            background: rgba(232,223,208,0.06);
            border-left: 2px solid var(--gold-foil);
            padding: 6px 10px; border-radius: 0 6px 6px 0;
            font-size: 0.85em; color: var(--cashmere);
            line-height: 1.5;
        }
        /* 巨型古董收纳皮盒 */
        .inventory-panel {
            flex: 1.5; background: linear-gradient(145deg, #2a1f16 0%, #241a12 100%);
            outline: none; border-radius: 12px; padding: 14px;
            box-shadow: 
                inset 0 0 0 1px var(--stitch),
                inset 0 0 0 3px #2a1f16,
                inset 0 0 0 4px var(--stitch),
                0 4px 12px rgba(0,0,0,0.4);
            position: relative;
        }
        /* 黄铜圆铆钉装饰 */
        .inventory-panel::before {
            content: ''; position: absolute; inset: 6px;
            border: 2px dotted rgba(122,106,90,0.15);
            border-radius: 8px; pointer-events: none;
        }
        .inventory-panel h3 { font-size: 0.9em; color: var(--gold-foil); margin-bottom: 10px; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
        .inventory-slots { display: flex; gap: 10px; flex-wrap: wrap; }
        /* 内部分格凹槽卡槽 */
        .inv-slot {
            width: 60px; height: 60px;
            background: linear-gradient(145deg, #d4c8b8 0%, #c4b8a8 100%);
            outline: none; border-radius: 6px;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; cursor: pointer; transition: all 0.2s;
            position: relative;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
        }
        .inv-slot:hover { 
            background: linear-gradient(145deg, #ddd0c0 0%, #cdc0b0 100%);
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.3), 0 0 8px rgba(200,167,117,0.15);
        }
        .inv-slot.selected {
            outline: 2px solid var(--gold-foil);
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.3), 0 0 12px rgba(200,167,117,0.2);
            background: linear-gradient(145deg, #c8baa8 0%, #b8aa98 100%);
        }
        .inv-slot .item-icon { font-size: 1.6em; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3)); }
        .inv-slot .item-name { font-size: 0.6em; color: #5a4a3a; margin-top: 2px; text-align: center; }
        .inv-slot.empty {
            background: rgba(212, 200, 184, 0.15);
            opacity: 0.5;
            cursor: default;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
        }
        .inv-slot.empty:hover {
            border-color: var(--stitch);
            background: rgba(212, 200, 184, 0.2);
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
        }
        .combine-hint { font-size: 0.8em; color: var(--gold-foil); margin-top: 8px; text-align: center; opacity: 0.7; }
        .combine-hint.active { color: var(--gold-foil); }

        /* ========== 弹窗 ========== */
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(22,18,12,0.85);
            z-index: 1000; justify-content: center; align-items: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        /* 迷你古董藏宝皮盒 */
        .modal-content {
            background: linear-gradient(145deg, #32271E 0%, #2a1f16 50%, #32271E 100%);
            border-radius: 16px;
            padding: 30px; max-width: 420px; width: 90%;
            max-height: 85vh;
            animation: slideUp 0.3s ease; position: relative;
            box-shadow:
                inset 0 0 0 1px var(--stitch),
                inset 0 0 0 3px #32271E,
                inset 0 0 0 4px var(--stitch),
                inset 0 0 30px rgba(0,0,0,0.3),
                0 16px 48px rgba(0,0,0,0.6);
            overflow-y: auto;
            overflow-x: hidden;
        }
        .modal-content::-webkit-scrollbar { width: 4px; }
        .modal-content::-webkit-scrollbar-track { background: transparent; }
        .modal-content::-webkit-scrollbar-thumb { background: var(--gold-foil); border-radius: 2px; opacity: 0.4; }
        /* 四角加厚皮包角 */
        .modal-content::before {
            content: ''; position: absolute; inset: 8px;
            border: 1px solid rgba(200,167,117,0.08);
            border-radius: 10px; pointer-events: none;
        }
        /* 内部虚线装饰框 */
        .modal-content::after {
            content: ''; position: absolute; top: 14px; left: 14px; right: 14px; bottom: 14px;
            border: 1px dashed var(--stitch);
            border-radius: 8px; opacity: 0.15;
            pointer-events: none;
        }
        .modal-close {
            position: absolute; top: 12px; right: 16px;
            font-size: 1.5em; cursor: pointer; color: var(--cashmere-dim);
            transition: color 0.3s; z-index: 10;
        }
        .modal-close:hover { color: var(--gold-foil); }
        .modal-title {
            font-family: 'Cinzel', 'Noto Serif SC', serif;
            font-size: 1.2em; color: var(--gold-foil); text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }
        .modal-message { color: var(--cashmere); line-height: 1.8; margin-bottom: 20px; font-size: 0.95em; }
        .modal-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

        /* 密码输入框 */
        .password-inputs { display: flex; gap: 10px; justify-content: center; margin: 20px 0; }
        .password-inputs input {
            width: 48px; height: 56px; font-size: 1.4em; text-align: center;
            border: 2px solid var(--stitch); border-radius: 8px;
            background: #1e1710; color: var(--gold-foil);
            font-family: 'Cinzel', serif;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
        }
        .password-inputs input:focus {
            outline: none; border-color: var(--gold-foil);
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.4), 0 0 10px rgba(200,167,117,0.15);
        }
        .password-hint {
            text-align: center; color: var(--cashmere-dim); font-size: 0.8em; margin-top: 10px;
        }

        /* 序列谜题 */
        .sequence-grid {
            display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;
            margin: 20px 0;
        }
        .seq-btn {
            width: 64px; height: 64px; font-size: 2em; border: 2px solid var(--stitch);
            border-radius: var(--radius-sm); background: var(--oil-wax);
            color: var(--cashmere); cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Cinzel', serif;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.3);
        }
        .seq-btn:hover { border-color: var(--gold-foil); background: var(--oil-wax-light); box-shadow: inset 0 0 8px rgba(0,0,0,0.3), 0 0 10px var(--gold-foil-glow); }
        .seq-btn.correct { border-color: var(--success); background: rgba(90,122,74,0.2); color: var(--success); }
        .seq-btn.wrong { border-color: var(--danger); background: rgba(160,64,48,0.2); color: var(--danger); }
        .seq-progress {
            text-align: center; color: var(--cashmere-dim); font-size: 0.85em; margin-top: 10px;
        }

        /* 多物品锁 */
        .multi-item-list { margin: 15px 0; }
        .multi-item-row {
            display: flex; align-items: center; gap: 10px;
            padding: 10px; margin-bottom: 8px; border-radius: var(--radius-sm);
            background: rgba(0,0,0,0.15);
            border: 1px solid var(--stitch);
        }
        .multi-item-row .mi-icon { font-size: 1.3em; }
        .multi-item-row .mi-name { flex: 1; font-size: 0.9em; color: var(--cashmere); }
        .multi-item-row .mi-status { font-size: 1.1em; }
        .multi-item-row.has .mi-status { color: var(--success); }
        .multi-item-row.missing .mi-status { color: var(--danger); }

        /* 颜色锁 */
        .color-grid {
            display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 20px 0;
        }
        .color-btn {
            width: 56px; height: 56px; border-radius: 50%; border: 3px solid transparent;
            cursor: pointer; transition: all 0.2s; position: relative;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .color-btn:hover { transform: scale(1.1); box-shadow: 0 4px 16px rgba(0,0,0,0.5); }
        .color-btn.selected { border-color: var(--gold-foil); box-shadow: 0 0 16px var(--gold-foil-glow); }
        .color-btn.selected::after {
            content: '✓'; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); color: var(--gold-foil); font-size: 1.5em;
            font-weight: bold; text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }
        .color-sequence {
            display: flex; justify-content: center; gap: 8px; margin: 15px 0;
        }
        .color-seq-slot {
            width: 40px; height: 40px; border-radius: 50%;
            border: 2px dashed var(--stitch);
            background: var(--oil-wax-dark);
        }
        .color-seq-slot.filled { border-style: solid; border-color: var(--gold-foil); }

        /* 通用按钮 */
        .btn-primary, .btn-secondary {
            padding: 10px 20px;
            border: none; border-radius: 8px;
            cursor: pointer; font-size: 0.95em;
            transition: all 0.3s ease;
            font-family: 'Noto Serif SC', serif;
            position: relative; overflow: hidden;
        }
        /* 复古皮面嵌青铜五金 */
        .btn-primary {
            background: linear-gradient(145deg, #32271E 0%, #2a1f16 50%, #32271E 100%);
            color: var(--gold-foil);
            box-shadow: 
                inset 0 0 0 1px var(--stitch),
                inset 0 0 0 3px #32271E,
                inset 0 0 0 4px var(--stitch),
                0 4px 10px rgba(0,0,0,0.4);
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
        }
        .btn-primary:hover {
            background: linear-gradient(145deg, #3a2c20 0%, #2e2218 50%, #3a2c20 100%);
            box-shadow: 
                inset 0 0 0 1px var(--stitch-light),
                inset 0 0 0 3px #3a2c20,
                inset 0 0 0 4px var(--stitch-light),
                0 6px 16px rgba(0,0,0,0.4),
                0 0 12px rgba(200,167,117,0.1);
            color: var(--gold-foil-bright);
        }
        .btn-primary:active {
            transform: translateY(1px);
            background: linear-gradient(145deg, #241a12 0%, #1e1710 50%, #241a12 100%);
            box-shadow: 
                inset 0 0 0 1px var(--stitch),
                inset 0 0 0 3px #1e1710,
                inset 0 0 0 4px var(--stitch),
                inset 0 3px 8px rgba(0,0,0,0.5),
                0 1px 4px rgba(0,0,0,0.3);
        }
        .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-secondary {
            background: rgba(50,39,30,0.6);
            color: var(--cashmere-dim);
            border: 1px solid var(--stitch);
        }
        .btn-secondary:hover {
            background: rgba(50,39,30,0.8);
            color: var(--cashmere);
            border-color: var(--stitch-light);
        }
        .btn-secondary:active {
            transform: translateY(1px);
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.5);
        }
        .btn-danger {
            background: linear-gradient(145deg, var(--danger), #7a3020); color: var(--cashmere);
            border: 2px solid var(--danger);
            padding: 10px 20px; border-radius: 8px;
            font-size: 0.95em; cursor: pointer; transition: all 0.3s ease;
            font-family: 'Noto Serif SC', serif;
        }
        .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(160,64,48,0.4); }

        /* ========== 通关页 ========== */
        .victory-content { text-align: center; }
        .victory-icon { font-size: 4em; margin-bottom: 16px; }
        .victory-content h1 {
            font-family: 'Cinzel', 'Noto Serif SC', serif;
            font-size: 2em; color: var(--gold-foil); margin-bottom: 12px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }
        .victory-content p { color: var(--cashmere); margin-bottom: 24px; line-height: 1.8; }
        .victory-buttons { display: flex; gap: 12px; justify-content: center; }

        /* ========== 粒子/庆祝效果 ========== */
        .confetti-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 999; overflow: hidden;
        }
        .confetti {
            position: absolute; width: 10px; height: 10px;
            top: -10px; animation: confettiFall linear forwards;
        }

        /* ========== Toast提示 ========== */
        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(145deg, #32271E 0%, #2a1f16 100%);
            color: var(--gold-foil); padding: 10px 24px; border-radius: 8px;
            font-size: 0.9em; z-index: 2000; opacity: 0; transition: opacity 0.3s;
            pointer-events: none;
            box-shadow: 
                inset 0 0 0 1px var(--stitch),
                0 4px 12px rgba(0,0,0,0.4);
            border: none;
        }
        .toast.show { opacity: 1; }

        /* ========== 动画 ========== */
        @keyframes pulse {
            0%, 100% { box-shadow: inset 0 0 0 1px var(--gold-foil), inset 0 0 0 3px #32271E, inset 0 0 0 4px var(--gold-foil), 0 0 15px rgba(200,167,117,0.15); }
            50% { box-shadow: inset 0 0 0 1px var(--gold-foil), inset 0 0 0 3px #32271E, inset 0 0 0 4px var(--gold-foil), 0 0 25px rgba(200,167,117,0.25); }
        }
        @keyframes doorGlow {
            0%, 100% { box-shadow: inset 0 0 0 1px var(--stitch), inset 0 0 0 3px #2e2218, inset 0 0 0 4px var(--stitch), 0 0 15px rgba(200,167,117,0.1); }
            50% { box-shadow: inset 0 0 0 1px var(--gold-foil), inset 0 0 0 3px #2e2218, inset 0 0 0 4px var(--gold-foil), 0 0 25px rgba(200,167,117,0.2); }
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        @keyframes confettiFall {
            0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
        @keyframes shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        /* ========== 响应式设计 ========== */
        @media (max-width: 600px) {
            .level-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .select-header h1 { font-size: 1.8em; }
            .room-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .room-card { min-height: 130px; padding: 16px 10px; }
            .room-card .room-icon { font-size: 2.2em; }
            .inventory-slots { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 6px; }
            .inv-slot { flex-shrink: 0; }
            .game-bottom { flex-direction: column-reverse; }
        }

        /* ========== 加载动画：皮匣开启 ========== */
        #loading-overlay {
            position: fixed; inset: 0; z-index: 20000;
            background: #16120c;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column;
            transition: opacity 0.8s ease;
        }
        #loading-overlay.hidden { opacity: 0; pointer-events: none; }
        .loading-leather-box {
            width: 200px; height: 140px;
            position: relative;
            perspective: 800px;
        }
        .loading-leather-lid {
            position: absolute; inset: 0;
            background: linear-gradient(145deg, #3a2c20 0%, #2a1f16 50%, #32271E 100%);
            border-radius: 8px;
            box-shadow: inset 0 0 0 1px var(--stitch), inset 0 0 0 3px #32271E, inset 0 0 0 4px var(--stitch), 0 8px 24px rgba(0,0,0,0.6);
            transform-origin: top center;
            animation: lidOpen 2.5s ease forwards;
            z-index: 2;
        }
        .loading-leather-lid::before {
            content: ''; position: absolute; inset: 8px;
            border: 1px solid rgba(200,167,117,0.08); border-radius: 6px;
        }
        .loading-leather-base {
            position: absolute; inset: 0;
            background: linear-gradient(145deg, #241a12 0%, #1e1710 100%);
            border-radius: 8px;
            box-shadow: inset 0 0 0 1px var(--stitch), inset 0 0 0 3px #1e1710, inset 0 0 0 4px var(--stitch);
            z-index: 1;
        }
        .loading-leather-glow {
            position: absolute; inset: 10px;
            background: radial-gradient(ellipse at center, rgba(200,167,117,0.15) 0%, transparent 70%);
            opacity: 0;
            animation: glowReveal 2.5s ease forwards;
            z-index: 0;
        }
        .loading-text {
            margin-top: 30px;
            font-family: 'Cinzel', 'Noto Serif SC', serif;
            color: var(--gold-foil);
            letter-spacing: 6px;
            font-size: 0.9em;
            opacity: 0;
            animation: textFadeIn 1s ease 1.5s forwards;
        }
        @keyframes lidOpen {
            0% { transform: rotateX(0deg); }
            40% { transform: rotateX(-45deg); }
            70% { transform: rotateX(-110deg); }
            100% { transform: rotateX(-110deg); opacity: 0.3; }
        }
        @keyframes glowReveal {
            0% { opacity: 0; transform: scale(0.5); }
            60% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes textFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========== 视图过渡动画 ========== */
        .view {
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .view.active {
            opacity: 1;
            display: flex;
        }

        /* ========== 皮革按压阴影 ========== */
        .room-card:hover {
            transform: translateY(-4px) rotateX(2deg) rotateY(-2deg);
            box-shadow:
                inset 0 0 0 1px var(--stitch-light),
                inset 0 0 0 3px #3a2c20,
                inset 0 0 0 4px var(--stitch-light),
                0 8px 24px rgba(0,0,0,0.5),
                0 0 15px rgba(200,167,117,0.1),
                inset 0 4px 12px rgba(0,0,0,0.3);
        }

        /* ========== 物品弹跳动画 ========== */
        @keyframes itemBounce {
            0% { transform: scale(1); }
            30% { transform: scale(1.25); }
            50% { transform: scale(0.95); }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .inv-slot.just-got {
            animation: itemBounce 0.6s ease-out, itemGlow 0.8s ease-out;
        }

        /* ========== 金色星星爆开动画 ========== */
        @keyframes starBurst {
            0% { transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 1; }
            50% { opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0.3) rotate(720deg); opacity: 0; }
        }
        .star-burst {
            position: fixed; width: 24px; height: 24px; font-size: 24px;
            pointer-events: none; z-index: 998;
            left: 50%; top: 50%;
        }

        /* ========== 按钮统一反馈 ========== */
        button, .level-card, .room-card, .inv-slot {
            cursor: pointer;
        }
        button:active, .btn-primary:active, .btn-secondary:active, .cover-start-btn:active {
            transform: translateY(1px) scale(0.98);
        }

        /* ========== 成就面板样式 ========== */
        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 6px;
        }
        .achievement-item {
            background: linear-gradient(160deg, #1e1610 0%, #2a1f16 40%, #1a130d 100%);
            border-radius: 12px;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(200,167,117,0.15);
            transition: all 0.4s ease;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.4), 0 4px 12px rgba(0,0,0,0.3);
        }
        .achievement-item::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(200,167,117,0.06) 0%, transparent 60%);
            pointer-events: none;
        }
        .achievement-item::after {
            content: '';
            position: absolute;
            inset: 3px;
            border: 1px dashed rgba(200,167,117,0.08);
            border-radius: 9px;
            pointer-events: none;
        }
        .achievement-item.unlocked {
            border-color: rgba(200,167,117,0.4);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3), 0 0 20px rgba(200,167,117,0.1), 0 4px 12px rgba(0,0,0,0.3);
            animation: cardPulse 3s ease-in-out infinite;
        }
        .achievement-item.locked {
            opacity: 0.45;
            filter: grayscale(0.8) brightness(0.7);
        }
        @keyframes cardPulse {
            0%, 100% { box-shadow: inset 0 0 20px rgba(0,0,0,0.3), 0 0 15px rgba(200,167,117,0.08), 0 4px 12px rgba(0,0,0,0.3); }
            50% { box-shadow: inset 0 0 20px rgba(0,0,0,0.3), 0 0 25px rgba(200,167,117,0.15), 0 4px 12px rgba(0,0,0,0.3); }
        }
        .achievement-icon {
            font-size: 2.2em;
            flex-shrink: 0;
            filter: drop-shadow(0 0 6px rgba(200,167,117,0.2));
        }
        .achievement-info { flex: 1; width: 100%; }
        .achievement-name { font-size: 0.9em; color: var(--gold-foil); font-weight: 600; letter-spacing: 0.5px; }
        .achievement-desc { font-size: 0.72em; color: rgba(200,180,150,0.6); margin-top: 6px; line-height: 1.5; font-style: italic; }
        .achievement-status { font-size: 0.9em; margin-top: 4px; }

        /* ========== 提示面板样式 ========== */
        .hint-panel-item {
            background: linear-gradient(145deg, #2a1f16 0%, #241a12 100%);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 10px;
            border: 1px solid var(--stitch);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .hint-panel-item:hover {
            border-color: var(--gold-foil);
            box-shadow: 0 0 10px rgba(200,167,117,0.1);
        }
        .hint-panel-item.disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .hint-label { font-size: 0.85em; color: var(--gold-foil); font-weight: 600; }
        .hint-cost { font-size: 0.8em; color: var(--cashmere-dim); margin-top: 4px; }
        .hint-text { font-size: 0.85em; color: var(--cashmere); margin-top: 6px; line-height: 1.5; }

        /* ========== 统计面板样式 ========== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .stat-card {
            background: linear-gradient(145deg, #2a1f16 0%, #241a12 100%);
            border-radius: 10px;
            padding: 14px;
            text-align: center;
            border: 1px solid var(--stitch);
        }
        .stat-card .stat-number {
            font-size: 1.6em; font-family: 'Cinzel', serif;
            color: var(--gold-foil); font-weight: bold;
        }
        .stat-card .stat-label {
            font-size: 0.75em; color: var(--cashmere-dim); margin-top: 4px;
        }

        /* ========== 每日挑战样式 ========== */
        .daily-btn {
            background: linear-gradient(145deg, #32271E 0%, #2a1f16 50%, #32271E 100%);
            color: var(--gold-foil);
            border: 2px solid var(--gold-foil);
            box-shadow: inset 0 0 0 1px var(--stitch), 0 0 15px rgba(200,167,117,0.2);
            animation: dailyPulse 2s infinite;
        }
        @keyframes dailyPulse {
            0%, 100% { box-shadow: inset 0 0 0 1px var(--stitch), 0 0 15px rgba(200,167,117,0.2); }
            50% { box-shadow: inset 0 0 0 1px var(--stitch), 0 0 25px rgba(200,167,117,0.35); }
        }
        .daily-completed-badge {
            display: inline-block;
            background: var(--success);
            color: var(--cashmere);
            font-size: 0.7em;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 6px;
        }
        .rank-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
            margin-top: 8px;
        }
        .rank-1 { background: linear-gradient(135deg, #ffd700, #ffaa00); color: #332200; }
        .rank-5 { background: linear-gradient(135deg, #c0c0c0, #a0a0a0); color: #222; }
        .rank-10 { background: linear-gradient(135deg, #cd7f32, #a0522d); color: #fff; }
        .rank-50 { background: linear-gradient(135deg, #4a7a5a, #3a5a4a); color: #fff; }

        /* ========== 关卡卡片最佳时间 ========== */
        .level-best-time {
            font-size: 0.7em;
            color: var(--gold-foil);
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        /* 滚动条 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(200,167,117,0.15); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(200,167,117,0.3); }

        /* ================================================================
           典藏封面页 - 欧式古董精装皮匣奢华质感
           ================================================================ */
        #cover-page {
            position: fixed; inset: 0; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
            transition: opacity 1.4s cubic-bezier(0.4, 0, 0.2, 1), transform 1.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #cover-page.fade-out { opacity: 0; transform: scale(1.03); pointer-events: none; }

        /* 底层 - 重磅进口黑咖色油蜡硬牛皮 */
        #cover-page::before {
            content: ''; position: absolute; inset: 0;
            background:
                radial-gradient(ellipse 4px 3px at 12% 22%, rgba(70,50,35,0.18) 0%, transparent 100%),
                radial-gradient(ellipse 5px 3px at 38% 12%, rgba(55,40,28,0.14) 0%, transparent 100%),
                radial-gradient(ellipse 3px 4px at 68% 30%, rgba(80,58,40,0.12) 0%, transparent 100%),
                radial-gradient(ellipse 6px 4px at 22% 58%, rgba(65,48,33,0.16) 0%, transparent 100%),
                radial-gradient(ellipse 4px 5px at 55% 72%, rgba(75,52,36,0.13) 0%, transparent 100%),
                radial-gradient(ellipse 3px 3px at 82% 48%, rgba(60,44,30,0.15) 0%, transparent 100%),
                radial-gradient(ellipse 5px 4px at 42% 88%, rgba(72,54,38,0.11) 0%, transparent 100%),
                radial-gradient(ellipse 7px 5px at 75% 15%, rgba(68,50,35,0.09) 0%, transparent 100%),
                radial-gradient(ellipse 3px 2px at 8% 78%, rgba(78,56,40,0.13) 0%, transparent 100%),
                radial-gradient(ellipse 4px 6px at 92% 68%, rgba(62,46,32,0.12) 0%, transparent 100%),
                radial-gradient(ellipse 5px 3px at 48% 42%, rgba(85,60,42,0.07) 0%, transparent 100%),
                repeating-linear-gradient(173deg, transparent 0px, rgba(35,25,16,0.05) 1px, transparent 2px, transparent 20px),
                repeating-linear-gradient(177deg, transparent 0px, rgba(45,32,20,0.04) 1px, transparent 2px, transparent 28px),
                linear-gradient(155deg, #221a13 0%, #2e231a 18%, #2a1f16 35%, #302418 55%, #261c14 75%, #2b2017 100%);
            z-index: 1;
        }

        /* 庄园徽章暗纹 - 默认隐形，光标靠近浮现 */
        #cover-page::after {
            content: ''; position: absolute; inset: 0;
            background:
                radial-gradient(circle at 50% 42%, rgba(180,155,120,0.04) 0%, transparent 22%),
                radial-gradient(circle at 50% 42%, rgba(180,155,120,0.025) 8%, transparent 18%),
                radial-gradient(circle at 50% 42%, rgba(180,155,120,0.015) 14%, transparent 28%);
            z-index: 2; pointer-events: none;
            opacity: 0;
            transition: opacity 1.2s ease;
        }
        #cover-page:hover::after { opacity: 1; }

        /* 四周渐变暗角 */
        .cover-vignette {
            position: absolute; inset: 0;
            background:
                radial-gradient(ellipse at 0% 0%, rgba(8,5,2,0.75) 0%, transparent 45%),
                radial-gradient(ellipse at 100% 0%, rgba(8,5,2,0.75) 0%, transparent 45%),
                radial-gradient(ellipse at 0% 100%, rgba(8,5,2,0.75) 0%, transparent 45%),
                radial-gradient(ellipse at 100% 100%, rgba(8,5,2,0.75) 0%, transparent 45%),
                radial-gradient(ellipse at 50% 50%, transparent 35%, rgba(8,5,2,0.35) 100%);
            z-index: 3; pointer-events: none;
        }

        /* 电影级环境柔光 */
        .cover-ambient {
            position: absolute; inset: 0;
            background:
                radial-gradient(ellipse at 50% 30%, rgba(180,155,120,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 15% 50%, rgba(255,150,50,0.03) 0%, transparent 30%),
                radial-gradient(ellipse at 85% 50%, rgba(255,150,50,0.03) 0%, transparent 30%),
                radial-gradient(ellipse at 50% 80%, rgba(180,155,120,0.03) 0%, transparent 40%);
            z-index: 4; pointer-events: none;
        }

        /* 四角仿古金属包角 */
        .cover-corner {
            position: absolute; width: 40px; height: 40px;
            z-index: 6; pointer-events: none;
        }
        .cover-corner::before, .cover-corner::after {
            content: ''; position: absolute;
            background: linear-gradient(135deg, #8a7a6a 0%, #6a5a4a 40%, #8a7a6a 60%, #5a4a3a 100%);
            border-radius: 1px;
        }
        /* 水平条 */
        .cover-corner::before { width: 40px; height: 3px; }
        /* 垂直条 */
        .cover-corner::after { width: 3px; height: 40px; }
        /* 包角高光 */
        .cover-corner-tl { top: 20px; left: 20px; }
        .cover-corner-tl::before { top: 0; left: 0; }
        .cover-corner-tl::after { top: 0; left: 0; }
        .cover-corner-tr { top: 20px; right: 20px; }
        .cover-corner-tr::before { top: 0; right: 0; }
        .cover-corner-tr::after { top: 0; right: 0; }
        .cover-corner-bl { bottom: 20px; left: 20px; }
        .cover-corner-bl::before { bottom: 0; left: 0; }
        .cover-corner-bl::after { bottom: 0; left: 0; }
        .cover-corner-br { bottom: 20px; right: 20px; }
        .cover-corner-br::before { bottom: 0; right: 0; }
        .cover-corner-br::after { bottom: 0; right: 0; }
        /* 包角铆钉 */
        .cover-corner::before {
            box-shadow: 2px 2px 0 rgba(90,74,58,0.6);
        }

        /* 封面内容 */
        .cover-content {
            position: relative; z-index: 10;
            display: flex; flex-direction: column; align-items: center;
            gap: 60px;
        }

        /* 异形切割真皮铭牌 */
        .cover-title-plate {
            position: relative;
            padding: 32px 56px 28px;
            background:
                linear-gradient(150deg, #3a2c20 0%, #302418 25%, #2e2219 50%, #342a1e 75%, #302418 100%);
            /* 异形切割 - 上宽下窄的盾形 */
            clip-path: polygon(8% 0%, 92% 0%, 100% 15%, 98% 85%, 88% 100%, 12% 100%, 2% 85%, 0% 15%);
            box-shadow:
                inset 0 0 0 1px var(--stitch),
                inset 0 0 0 4px #2a1f16,
                inset 0 0 0 5px var(--stitch),
                0 10px 40px rgba(0,0,0,0.6),
                0 2px 10px rgba(0,0,0,0.4);
            text-align: center;
        }
        /* 双层皮料叠边效果 */
        .cover-title-plate::before {
            content: ''; position: absolute;
            inset: 6px;
            clip-path: polygon(6% 0%, 94% 0%, 100% 12%, 98% 88%, 90% 100%, 10% 100%, 2% 88%, 0% 12%);
            border: 1px solid rgba(212,184,136,0.1);
            pointer-events: none;
        }
        /* 铭牌内暗纹 */
        .cover-title-plate::after {
            content: ''; position: absolute; inset: 12px;
            clip-path: polygon(5% 0%, 95% 0%, 100% 10%, 98% 90%, 92% 100%, 8% 100%, 2% 90%, 0% 10%);
            background: repeating-linear-gradient(
                45deg, transparent 0px, transparent 10px,
                rgba(180,155,120,0.008) 10px, rgba(180,155,120,0.008) 11px
            );
            pointer-events: none;
        }

        /* 立体凹陷烫金标题 */
        .cover-title {
            position: relative;
            font-family: 'Cinzel', 'Noto Serif SC', serif;
            font-size: 3em; font-weight: 700;
            color: #c4a87a;
            letter-spacing: 10px;
            text-shadow:
                0 1px 1px rgba(0,0,0,0.9),
                0 2px 3px rgba(0,0,0,0.7),
                0 4px 8px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.08);
            line-height: 1.4;
        }
        .cover-subtitle {
            position: relative;
            font-family: 'Noto Serif SC', serif;
            font-size: 1em;
            color: var(--cashmere-dim);
            letter-spacing: 14px;
            margin-top: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.7);
            opacity: 0.7;
        }

        /* 古董锁扣式真皮按键 */
        .cover-start-btn {
            position: relative;
            display: flex; align-items: center; justify-content: center;
            padding: 24px 60px;
            background:
                linear-gradient(150deg, #382a1e 0%, #302418 35%, #2a1f16 70%, #302418 100%);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow:
                inset 0 0 0 1px var(--stitch),
                inset 0 0 0 4px #261c14,
                inset 0 0 0 5px var(--stitch),
                /* 外圈做旧青铜锁钉 */
                0 0 0 8px rgba(100,85,68,0.08),
                0 0 0 10px rgba(80,68,52,0.06),
                0 10px 30px rgba(0,0,0,0.5),
                0 2px 8px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        /* 按钮中心复古纹样 */
        .cover-start-btn::before {
            content: ''; position: absolute; inset: 14px;
            background:
                repeating-linear-gradient(60deg, transparent 0px, transparent 14px, rgba(180,155,120,0.012) 14px, rgba(180,155,120,0.012) 15px),
                repeating-linear-gradient(-60deg, transparent 0px, transparent 14px, rgba(180,155,120,0.012) 14px, rgba(180,155,120,0.012) 15px);
            border-radius: 4px; pointer-events: none;
            opacity: 0.5; transition: opacity 0.4s;
        }
        /* 青铜锁钉装饰圈 */
        .cover-start-btn::after {
            content: ''; position: absolute; inset: 10px;
            border: 2px dotted rgba(138,122,106,0.15);
            border-radius: 6px; pointer-events: none;
        }

        .cover-start-text {
            position: relative;
            font-family: 'Noto Serif SC', serif;
            font-size: 1.25em; font-weight: 600;
            color: #c4a87a;
            letter-spacing: 8px;
            text-shadow:
                0 1px 1px rgba(0,0,0,0.8),
                0 2px 3px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.06);
            white-space: nowrap;
        }

        /* 悬浮 - 青铜锁钉漫反射暖金光 */
        .cover-start-btn:hover {
            transform: translateY(-3px);
            background:
                linear-gradient(150deg, #403020 0%, #382a1e 35%, #302418 70%, #382a1e 100%);
            box-shadow:
                inset 0 0 0 1px var(--stitch-light),
                inset 0 0 0 4px #2e231a,
                inset 0 0 0 5px var(--stitch-light),
                0 0 0 8px rgba(138,122,106,0.12),
                0 0 0 10px rgba(120,104,86,0.08),
                0 14px 40px rgba(0,0,0,0.5),
                0 0 25px rgba(180,155,120,0.08);
        }
        .cover-start-btn:hover::before { opacity: 1; }
        .cover-start-btn:hover .cover-start-text {
            color: #d4b888;
            text-shadow:
                0 1px 1px rgba(0,0,0,0.8),
                0 2px 3px rgba(0,0,0,0.5),
                0 0 15px rgba(180,155,120,0.1);
        }

        /* 点击 - 锁扣下沉+皮面挤压 */
        .cover-start-btn:active {
            transform: translateY(2px);
            background:
                linear-gradient(150deg, #2a1f16 0%, #241a12 35%, #1e150e 70%, #241a12 100%);
            box-shadow:
                inset 0 0 0 1px var(--stitch),
                inset 0 0 0 4px #1a120c,
                inset 0 0 0 5px var(--stitch),
                inset 0 8px 20px rgba(0,0,0,0.5),
                0 1px 4px rgba(0,0,0,0.4);
            transition-duration: 0.08s;
        }

        /* 封面功能按钮组 */
        .cover-action-btns {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .cover-action-btns .btn-primary,
        .cover-action-btns .btn-secondary {
            padding: 10px 20px;
            font-size: 0.85em;
            letter-spacing: 2px;
        }
        .cover-action-btns .daily-btn {
            animation: pulse 2s infinite;
        }

        /* 封面响应式 */
        @media (max-width: 600px) {
            .cover-title { font-size: 2em; letter-spacing: 5px; }
            .cover-subtitle { font-size: 0.85em; letter-spacing: 8px; }
            .cover-title-plate { padding: 24px 36px 20px; }
            .cover-start-btn { padding: 20px 40px; }
            .cover-start-text { font-size: 1.05em; letter-spacing: 4px; }
            .cover-corner { width: 28px; height: 28px; }
            .cover-corner::before { width: 28px; }
            .cover-corner::after { height: 28px; }
            .cover-action-btns { flex-direction: column; align-items: center; gap: 8px; }
            .cover-action-btns .btn-primary, .cover-action-btns .btn-secondary { width: 160px; }
        }

        /* ================================================================
           古墓元素装饰
           ================================================================ */

        /* 火把 */
        .cover-torch {
            position: absolute;
            z-index: 8;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .cover-torch-left { left: 8%; top: 30%; }
        .cover-torch-right { right: 8%; top: 30%; }
        .torch-handle {
            width: 8px;
            height: 100px;
            background: linear-gradient(180deg, #5a4a3a 0%, #3a2a1a 50%, #2a1a0a 100%);
            border-radius: 2px;
            box-shadow: inset 0 0 3px rgba(0,0,0,0.5);
        }
        .torch-flame {
            position: relative;
            width: 20px;
            height: 30px;
            margin-bottom: -4px;
        }
        .flame-core {
            position: absolute;
            bottom: 0; left: 50%;
            transform: translateX(-50%);
            width: 8px; height: 16px;
            background: linear-gradient(180deg, #fff8e0 0%, #ffcc33 40%, #ff8800 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: flicker-core 0.8s ease-in-out infinite alternate;
        }
        .flame-outer {
            position: absolute;
            bottom: -2px; left: 50%;
            transform: translateX(-50%);
            width: 16px; height: 24px;
            background: linear-gradient(180deg, rgba(255,170,0,0.6) 0%, rgba(255,100,0,0.3) 60%, transparent 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: flicker-outer 1.2s ease-in-out infinite alternate;
        }
        .flame-glow {
            position: absolute;
            bottom: -10px; left: 50%;
            transform: translateX(-50%);
            width: 120px; height: 120px;
            background: radial-gradient(circle, rgba(255,150,50,0.3) 0%, transparent 70%);
            animation: flicker-glow 1.5s ease-in-out infinite alternate;
        }
        @keyframes flicker-core {
            0% { height: 16px; opacity: 0.9; }
            100% { height: 20px; opacity: 1; transform: translateX(-50%) skewX(-2deg); }
        }
        @keyframes flicker-outer {
            0% { height: 24px; opacity: 0.7; }
            100% { height: 28px; opacity: 0.9; transform: translateX(-50%) skewX(3deg); }
        }
        @keyframes flicker-glow {
            0% { opacity: 0.6; transform: translateX(-50%) scale(1); }
            100% { opacity: 1; transform: translateX(-50%) scale(1.15); }
        }

        /* 蛛网 */
        .cover-cobweb {
            position: absolute;
            z-index: 7;
            pointer-events: none;
            opacity: 0.35;
        }
        .cover-cobweb-tl {
            top: 0; left: 0;
            width: 180px; height: 180px;
            background:
                radial-gradient(circle at 0% 0%, rgba(200,180,160,0.8) 0%, transparent 2%),
                radial-gradient(circle at 0% 0%, rgba(200,180,160,0.5) 0%, transparent 1px),
                conic-gradient(from 0deg at 0% 0%,
                    transparent 0deg, rgba(200,180,160,0.6) 1deg, transparent 2deg,
                    transparent 30deg, rgba(200,180,160,0.4) 31deg, transparent 32deg,
                    transparent 60deg, rgba(200,180,160,0.5) 61deg, transparent 62deg,
                    transparent 90deg, rgba(200,180,160,0.4) 91deg, transparent 92deg,
                    transparent 120deg, rgba(200,180,160,0.5) 121deg, transparent 122deg,
                    transparent 150deg, rgba(200,180,160,0.4) 151deg, transparent 152deg,
                    transparent 180deg
                );
        }
        .cover-cobweb-br {
            bottom: 0; right: 0;
            width: 150px; height: 150px;
            background:
                radial-gradient(circle at 100% 100%, rgba(200,180,160,0.8) 0%, transparent 2%),
                conic-gradient(from 180deg at 100% 100%,
                    transparent 0deg, rgba(200,180,160,0.6) 1deg, transparent 2deg,
                    transparent 30deg, rgba(200,180,160,0.4) 31deg, transparent 32deg,
                    transparent 60deg, rgba(200,180,160,0.5) 61deg, transparent 62deg,
                    transparent 90deg, rgba(200,180,160,0.4) 91deg, transparent 92deg,
                    transparent 120deg, rgba(200,180,160,0.5) 121deg, transparent 122deg,
                    transparent 150deg, rgba(200,180,160,0.4) 151deg, transparent 152deg,
                    transparent 180deg
                );
        }

        /* 骷髅 */
        .cover-skull {
            position: absolute;
            z-index: 7;
            pointer-events: none;
            opacity: 0.4;
        }
        .cover-skull-left {
            bottom: 15%;
            left: 6%;
            width: 80px;
            height: 96px;
        }
        .cover-skull-left::before {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 58px; height: 64px;
            background: radial-gradient(ellipse at 50% 40%, rgba(200,180,160,0.9) 0%, rgba(200,180,160,0.3) 60%, transparent 100%);
            border-radius: 50% 50% 45% 45%;
        }
        /* 眼眶 */
        .cover-skull-left::after {
            content: '';
            position: absolute;
            top: 18px; left: 50%;
            transform: translateX(-50%);
            width: 44px; height: 22px;
            background:
                radial-gradient(ellipse at 30% 50%, rgba(26,18,10,0.8) 0%, transparent 70%),
                radial-gradient(ellipse at 70% 50%, rgba(26,18,10,0.8) 0%, transparent 70%);
            border-radius: 50%;
        }
        /* 下颌 */
        .cover-skull {
            box-shadow:
                0 18px 0 -2px rgba(200,180,160,0.15),
                0 20px 0 -2px rgba(200,180,160,0.1);
        }

        /* 符文石 */
        .cover-rune {
            position: absolute;
            z-index: 7;
            pointer-events: none;
            opacity: 0.35;
        }
        .cover-rune-right {
            top: 18%;
            right: 6%;
            width: 55px;
            height: 75px;
            background: linear-gradient(180deg, rgba(100,85,68,0.6) 0%, rgba(80,65,48,0.4) 100%);
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .cover-rune-right::before {
            content: '᛭';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.4em;
            color: rgba(200,167,117,0.8);
            text-shadow: 0 0 12px rgba(200,167,117,0.35);
        }

        /* 底部古墓符文装饰带 */
        .cover-rune-band {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 7;
            pointer-events: none;
            display: flex;
            gap: 24px;
            opacity: 0.3;
        }
        .cover-rune-band::before {
            content: 'ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ ᚷ ᚹ ᚺ ᚾ ᛁ ᛃ ᛇ ᛈ ᛉ ᛊ ᛏ ᛒ ᛖ ᛗ ᛚ ᛜ ᛞ ᛟ';
            font-size: 1em;
            color: rgba(200,167,117,1);
            letter-spacing: 4px;
            white-space: nowrap;
        }

        /* 右下骷髅 */
        .cover-skull-right {
            top: 20%;
            right: 5%;
            width: 70px;
            height: 84px;
        }

        /* 左侧符文石 */
        .cover-rune-left {
            bottom: 22%;
            left: 5%;
            width: 50px;
            height: 70px;
            background: linear-gradient(180deg, rgba(100,85,68,0.6) 0%, rgba(80,65,48,0.4) 100%);
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .cover-rune-left::before {
            content: 'ᛟ';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.2em;
            color: rgba(200,167,117,0.8);
            text-shadow: 0 0 12px rgba(200,167,117,0.35);
        }

        /* 顶部中央古墓石雕 */
        .cover-tombstone {
            position: absolute;
            top: 6%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 7;
            pointer-events: none;
            width: 200px;
            height: 60px;
            opacity: 0.2;
        }
        .cover-tombstone::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(80,65,48,0.5) 0%, rgba(60,48,35,0.3) 100%);
            clip-path: polygon(5% 0%, 95% 0%, 100% 30%, 100% 100%, 0% 100%, 0% 30%);
            border-radius: 4px 4px 0 0;
        }
        .cover-tombstone::after {
            content: '☠';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.2em;
            color: rgba(200,167,117,0.6);
            text-shadow: 0 0 10px rgba(200,167,117,0.2);
        }

        /* 链条 */
        .cover-chain {

        /* ========== 升级2: 动画增强 ========== */
        /* room-card 3D tilt on hover */
        .room-card {
            perspective: 800px;
            transform-style: preserve-3d;
        }
        .room-card:hover {
            transform: translateY(-4px) rotateX(2deg) rotateY(-2deg);
        }
        /* inv-slot glow when item obtained */
        @keyframes itemGlow {
            0% { box-shadow: inset 0 2px 6px rgba(0,0,0,0.3), 0 0 0 rgba(200,167,117,0); }
            50% { box-shadow: inset 0 2px 6px rgba(0,0,0,0.3), 0 0 18px rgba(200,167,117,0.6); }
            100% { box-shadow: inset 0 2px 6px rgba(0,0,0,0.3), 0 0 0 rgba(200,167,117,0); }
        }
        .inv-slot.just-got {
            animation: itemGlow 0.8s ease-out;
        }
        /* level-card completed breathing glow */
        .level-card.completed {
            animation: completedBreath 3s ease-in-out infinite;
        }
        @keyframes completedBreath {
            0%, 100% { box-shadow: inset 0 0 0 1px var(--success), inset 0 0 0 3px #32271E, inset 0 0 0 4px var(--success), 0 0 10px rgba(90,122,74,0.3); }
            50% { box-shadow: inset 0 0 0 1px var(--success), inset 0 0 0 3px #32271E, inset 0 0 0 4px var(--success), 0 0 20px rgba(90,122,74,0.5); }
        }
        /* unlock pulse - gold border pulse when room unlocked */
        @keyframes unlockPulse {
            0% { box-shadow: inset 0 0 0 1px var(--stitch), inset 0 0 0 3px #32271E, inset 0 0 0 4px var(--stitch), 0 4px 12px rgba(0,0,0,0.5); }
            50% { box-shadow: inset 0 0 0 2px var(--gold-foil), inset 0 0 0 4px #32271E, inset 0 0 0 5px var(--gold-foil), 0 0 25px rgba(200,167,117,0.5); }
            100% { box-shadow: inset 0 0 0 1px var(--stitch), inset 0 0 0 3px #32271E, inset 0 0 0 4px var(--stitch), 0 4px 12px rgba(0,0,0,0.5); }
        }
        .room-card.just-unlocked {
            animation: unlockPulse 1s ease-out;
        }
        /* password correct flash */
        @keyframes correctFlash {
            0% { box-shadow: inset 0 2px 6px rgba(0,0,0,0.4), 0 0 0 rgba(90,122,74,0); border-color: var(--stitch); }
            50% { box-shadow: inset 0 2px 6px rgba(0,0,0,0.4), 0 0 20px rgba(90,122,74,0.6); border-color: var(--success); }

            content: ''; position: absolute;
            width: 50px; height: 60px;
            background: linear-gradient(160deg, rgba(160,140,110,0.5) 0%, rgba(120,100,75,0.3) 40%, rgba(90,70,50,0.2) 100%);

        .cover-mirror::after {
            content: ''; position: absolute; top: 6px; left: 6px;

        .cover-test-tube-right { top: 34%; right: 4%; }
        .cover-test-tube::before {
            content: ''; position: absolute;
